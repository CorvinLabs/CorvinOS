version: '3.8'

services:
  # OpenTelemetry Collector (receives metrics/traces from instances)
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: corvinOS-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC (for exporters)
      - "4318:4318"    # OTLP HTTP
      - "9411:9411"    # Zipkin (optional)
      - "8888:8888"    # Prometheus scrape endpoint
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - prometheus
    environment:
      - LOG_LEVEL=info
    networks:
      - corvinOS-telemetry

  # Prometheus (time-series database for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: corvinOS-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    networks:
      - corvinOS-telemetry

  # Grafana (visualization & dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: corvinOS-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - corvinOS-telemetry

  # (Optional) Jaeger UI for trace visualization
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: corvinOS-jaeger
    ports:
      - "6831:6831/udp"   # Jaeger agent
      - "16686:16686"     # Jaeger UI
    networks:
      - corvinOS-telemetry

volumes:
  prometheus-storage:
  grafana-storage:

networks:
  corvinOS-telemetry:
    driver: bridge
