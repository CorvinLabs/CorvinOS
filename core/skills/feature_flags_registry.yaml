# ─── SPECIAL PARAMETERS (Non-flag Settings) ──────────────────────────────────

special_params:
  - param_id: "worker_engine_mode"
    type: "enum"
    values: ["native", "acs", "tde"]
    default: "native"
    description: "Worker engine selection (NOT a feature flag — separate config)"
    note: "Handled separately via legacy feature_flags.py::worker_engine_mode()"

# ─── AUDIT INTEGRATION ────────────────────────────────────────────────────────

audit_events:
  - event_type: "skill_executed"
    description: "Emitted on every Skill.execute() call for feature_flags operations"
    required_fields:
      - "skill_id"
      - "operation" # is_enabled | set_enabled | describe_all | tier_of | etc.
      - "flag_id"
      - "tenant_id"
      - "input" # operation parameters
      - "output" # operation result
      - "timestamp"
      - "lom" # Line of Moral Responsibility
      - "hash" # hash-chained to previous event

# ─── COMPLIANCE & CONSTRAINTS ─────────────────────────────────────────────────

constraints:
  - name: "Tenant Isolation (GDPR Art. 5, 32)"
    description: "Every operation must validate tenant_id; cross-tenant queries blocked"

  - name: "Audit Trail (GDPR Art. 30)"
    description: "Every is_enabled/set_enabled call emits audit event"

  - name: "No Compliance Bypass"
    description: "Compliance mechanisms (audit, consent, disclosure, etc.) cannot be flagged"

  - name: "Protected Substrings"
    blocked_in_flag_ids:
      - "audit"
      - "consent"
      - "disclosure"
      - "path_gate"
      - "pathgate"
      - "house_rules"
      - "houserules"
      - "flow_guard"
      - "flowguard"
      - "license"
      - "licence"
      - "compliance"
      - "gdpr"
      - "erasure"

# ─── METADATA ─────────────────────────────────────────────────────────────────

metadata:
  created_date: "2026-09-02"
  phase: "spike1"
  scenario: "wrapper_phased"
  comment: |
    This manifest represents the 59 feature flags from feature_flags.py
    reorganized as 6 composite Skills. The wrapper adapter (FeatureFlagLegacyAdapter)
    transparently delegates to these Skills, so 88 call-sites remain unchanged
    during Phase 1b migration.

    For Phase 1b Big Bang scenario, use 1:1 mapping instead.

# ─── DEPLOYMENT ──────────────────────────────────────────────────────────────

deployment:
  location: "core/skills/"
  files:
    - "feature_flags_registry.yaml" # This manifest
    - "feature_flags_skill.py" # Skills implementation
    - "feature_flags_legacy_adapter.py" # Wrapper for 88 call-sites

  test_files:
    - "tests/integration/test_feature_flags_equivalence_template.py" # 59 tests
    - "tests/unit/test_feature_flags_skill.py" # Unit tests (TBD)

  dependencies:
    - "core/console/corvin_core/feature_flags.py" # Original (still used by wrapper)
    - "audit_backend" # For SKILL_EXECUTED events
