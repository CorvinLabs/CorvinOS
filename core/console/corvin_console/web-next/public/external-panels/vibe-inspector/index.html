<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibe Inspector</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: transparent;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --card: #ffffff;
      --card-shadow: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.1);
      --accent: #6366f1;
      --ok: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
      --pill: #f1f5f9;
    }
    body.dark {
      --fg: #e2e8f0; --muted: #94a3b8; --border: #1e293b;
      --card: #0f172a; --card-shadow: none; --pill: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
      margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
    .sub { color: var(--muted); font-size: 12px; }
    .stats { display: flex; gap: 16px; margin: 14px 0 18px; flex-wrap: wrap; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; box-shadow: var(--card-shadow); min-width: 92px; }
    .stat .n { font-size: 22px; font-weight: 680; letter-spacing: -.02em; }
    .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .turn { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
    .turn-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .turn-id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
    .badges { display: flex; gap: 8px; align-items: center; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
             background: var(--pill); color: var(--fg); white-space: nowrap; }
    .badge.score { color: #fff; }
    .badge.degraded { background: var(--bad); color: #fff; }
    .stages { display: flex; flex-wrap: wrap; gap: 6px; }
    .stage { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 9px;
             border-radius: 8px; background: var(--pill); border: 1px solid var(--border); }
    .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
    .stage .nm { font-weight: 600; }
    .stage .ms { color: var(--muted); font-variant-numeric: tabular-nums; }
    .tier { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .status { color: var(--muted); font-size: 12px; margin: 6px 0 18px; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <!--
    Vibe Inspector — the reference external Console panel (ADR-0363 P5).
    Served as a static asset, embedded by PanelHost as a sandboxed iframe. Uses the
    raw postMessage protocol (ADR-0362) inline; receives ctx.baseUrl from the host
    and calls the same-origin Vibe-Engineering API with the browser's own
    credentials. DOM is built with createElement/textContent only — a panel must
    never build DOM from a string it did not control.
  -->
  <div class="head">
    <h1>Vibe Inspector</h1>
    <span class="sub" id="sub">context-engineering traces</span>
  </div>
  <div class="status" id="status">connecting to Console host…</div>
  <div class="stats" id="stats" style="display:none"></div>
  <div id="turns"></div>

  <script>
    (function () {
      var PROTOCOL_VERSION = "1";
      var hostOrigin = null;
      var $status = document.getElementById("status");
      var $stats = document.getElementById("stats");
      var $turns = document.getElementById("turns");

      // ── tiny safe DOM builder ──
      function el(tag, attrs, kids) {
        var n = document.createElement(tag);
        if (attrs) for (var k in attrs) {
          if (k === "class") n.className = attrs[k];
          else if (k === "style") n.setAttribute("style", attrs[k]);
          else if (k === "text") n.textContent = attrs[k];
          else n.setAttribute(k, attrs[k]);
        }
        (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
        return n;
      }
      function scoreColor(s) {
        if (s == null) return "var(--muted)";
        if (s >= 0.75) return "var(--ok)";
        if (s >= 0.4) return "var(--warn)";
        return "var(--bad)";
      }
      function statusColor(st) {
        return st === "ok" ? "var(--ok)" : st === "degraded" ? "var(--warn)" : "var(--bad)";
      }
      function reportHeight() {
        parent.postMessage({ type: "corvin:panel:resize", height: document.body.scrollHeight + 24 },
          hostOrigin || "*");
      }

      function applyTheme(t) { if (t) document.body.classList.toggle("dark", t === "dark"); }

      // The reliable theme source for a sandboxed iframe is the URL query param the
      // host (PanelHost) sets: ?corvinTheme=dark|light. No cross-origin read, no
      // postMessage race. host:theme still updates it live if the operator toggles.
      try {
        var urlTheme = new URLSearchParams(location.search).get("corvinTheme");
        if (urlTheme) applyTheme(urlTheme);
      } catch (e) {}

      window.addEventListener("message", function (ev) {
        var m = ev.data;
        if (!m || typeof m.type !== "string") return;
        if (m.type === "corvin:host:hello") { hostOrigin = ev.origin; onHello(m.ctx); }
        if (m.type === "corvin:host:theme") applyTheme(m.theme);
      });
      parent.postMessage({ type: "corvin:panel:ready", protocolVersion: PROTOCOL_VERSION }, "*");

      function onHello(ctx) {
        applyTheme(ctx.theme);
        $status.textContent = "loading traces…";
        fetch(ctx.baseUrl + "/vibe-engineering/traces", { credentials: "include" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(render)
          .catch(function (e) { $status.textContent = "could not load traces: " + e.message; reportHeight(); });
      }

      function render(data) {
        var sessions = (data && data.sessions) || [];
        var turns = [];
        sessions.forEach(function (s) { (s.turns || []).forEach(function (t) { turns.push(t); }); });

        $status.style.display = "none";
        if (!turns.length) {
          $turns.appendChild(el("div", { class: "empty", text: "No context-engineering traces yet." }));
          reportHeight(); return;
        }

        // aggregate stats
        var avg = turns.reduce(function (a, t) { return a + (t.top_score || 0); }, 0) / turns.length;
        var degraded = turns.filter(function (t) { return t.degraded; }).length;
        $stats.style.display = "flex";
        [["Turns", turns.length], ["Sessions", sessions.length],
         ["Avg score", avg.toFixed(2)], ["Degraded", degraded]].forEach(function (p) {
          $stats.appendChild(el("div", { class: "stat" }, [
            el("div", { class: "n", text: String(p[1]) }),
            el("div", { class: "l", text: p[0] }),
          ]));
        });

        turns.slice(0, 25).forEach(function (t) {
          var stages = (t.stages || []).map(function (st) {
            return el("div", { class: "stage" }, [
              el("span", { class: "dot", style: "background:" + statusColor(st.status) }),
              el("span", { class: "nm", text: st.stage || "?" }),
              st.confidence_tier ? el("span", { class: "tier", text: st.confidence_tier }) : null,
              st.duration_ms != null
                ? el("span", { class: "ms", text: Math.round(st.duration_ms) + "ms" }) : null,
            ]);
          });
          var badges = [
            el("span", { class: "badge score", style: "background:" + scoreColor(t.top_score),
                         text: "score " + (t.top_score != null ? t.top_score.toFixed(2) : "—") }),
            el("span", { class: "badge", text: (t.stages_ok != null ? t.stages_ok : "?") + "/" + (t.stages || []).length + " ok" }),
          ];
          if (t.degraded) badges.push(el("span", { class: "badge degraded", text: "degraded" }));

          $turns.appendChild(el("div", { class: "turn" }, [
            el("div", { class: "turn-top" }, [
              el("span", { class: "turn-id", text: String(t.turn_id || t.brief_sha256 || "").slice(0, 22) }),
              el("div", { class: "badges" }, badges),
            ]),
            el("div", { class: "stages" }, stages),
          ]));
        });
        reportHeight();
      }
    })();
  </script>
</body>
</html>
