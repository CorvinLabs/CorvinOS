# Prometheus Alert Rules for CorvinOS Console Production Monitoring
#
# Installation:
# 1. Save this file to /etc/prometheus/rules/corvinos_console_alerts.yaml
# 2. Add to prometheus.yml:
#    rule_files:
#      - /etc/prometheus/rules/corvinos_console_alerts.yaml
# 3. Reload Prometheus: curl -X POST http://localhost:9090/-/reload
# 4. Configure alerting backend (PagerDuty/Slack/Email in alertmanager.yml)

groups:
  - name: corvinos_console_slos
    interval: 30s
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 1: SLO Latency Violation (CRITICAL)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSSLOLatencyViolation
        expr: corvinos_console_slo_latency_p99_ms > 500
        for: 5m
        labels:
          severity: critical
          component: marketplace
          slo: latency
        annotations:
          summary: "CorvinOS P99 latency exceeds SLO"
          description: |
            P99 latency is {{ $value | humanize }}ms (threshold: 500ms)
            This indicates slow marketplace response times.
            Actions:
            1. Check marketplace health status
            2. Review model API latencies
            3. Check if circuit breaker is engaged
            Dashboard: http://localhost:3000/d/slo-monitoring

  - name: corvinos_console_error_rate
    interval: 30s
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 2: SLO Error Rate Violation (CRITICAL)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSSLOErrorRateViolation
        expr: corvinos_console_slo_error_rate_pct > 0.1
        for: 5m
        labels:
          severity: critical
          component: marketplace
          slo: error_rate
        annotations:
          summary: "CorvinOS error rate exceeds SLO"
          description: |
            Error rate is {{ $value | humanize }}% (threshold: 0.1%)
            {{ $value }} errors per 100 requests is unacceptable.
            Actions:
            1. Check recent deployments
            2. Review error logs (Sentry dashboard)
            3. Check database/API connectivity
            Dashboard: http://localhost:3000/d/slo-monitoring

  - name: corvinos_console_circuit_breaker
    interval: 1m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 3: Circuit Breaker Open (WARNING)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSCircuitBreakerTriggered
        expr: corvinos_console_circuit_breaker_state{endpoint="marketplace"} > 0
        for: 2m
        labels:
          severity: warning
          component: marketplace
          mechanism: circuit_breaker
        annotations:
          summary: "CorvinOS marketplace circuit breaker triggered"
          description: |
            Circuit breaker is CLOSED (triggered) for marketplace.
            The service is temporarily refusing new requests to recover.

            Recovery: breaker will attempt recovery in 60 seconds.
            Manual recovery: restart the marketplace service.
            Dashboard: http://localhost:3000/d/slo-monitoring

  - name: corvinos_console_redos
    interval: 1m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 4: ReDoS Attack Detection (CRITICAL)
      # ────────────────────────────────────────────────────────────────────────
      # Note: ReDoS should be 0 after fix, but monitor for regression
      - alert: CorvinOSReDoSDetected
        expr: increase(corvinos_console_redos_timeouts_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: regex_engine
          attack_surface: sql_patterns
        annotations:
          summary: "CRITICAL: ReDoS (regex denial of service) detected"
          description: |
            ReDoS timeouts detected: {{ $value | humanize }} in last 5 minutes.
            This indicates a potential regex-based denial of service attack.

            Immediate actions:
            1. Page security team immediately
            2. Check recent SQL queries in logs
            3. Review input validation on search endpoints
            4. Consider blocking source IP if pattern detected
            Sentry: https://sentry.io/search?query=ReDoS+timeout

  - name: corvinos_console_audit_chain
    interval: 30s
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 5: Audit Chain Verification Failed (CRITICAL - GDPR)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSAuditChainFailure
        expr: increase(corvinos_console_audit_chain_verification_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: audit_chain
          compliance: gdpr
        annotations:
          summary: "CRITICAL: Audit chain verification failed (GDPR risk)"
          description: |
            Audit chain verification failed {{ $value | humanize }} times.
            This is a CRITICAL compliance violation (GDPR Art. 30, 32).

            Immediate actions:
            1. Page security + compliance lead IMMEDIATELY
            2. Verify audit chain integrity: corvin audit verify-chain
            3. Check storage backend for corruption
            4. Consider incident response activation
            5. Prepare incident report for regulators
            Audit verification: http://localhost:8765/v1/console/audit/verify

  - name: corvinos_console_budget
    interval: 5m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 6: Budget Exceeded (HIGH)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSDailyBudgetExceeded
        expr: >
          increase(corvinos_console_cost_total[24h]) > 50
        for: 5m
        labels:
          severity: high
          component: cost_control
          action: budget_enforcement
        annotations:
          summary: "CorvinOS daily cost approaching/exceeding budget"
          description: |
            Daily cost: ${{ $value | humanize }} (budget: $50)
            Cost is {{ $value | humanizeSI }}% of daily budget.

            Actions:
            1. Review active tasks in console
            2. Check for runaway model calls (loop iterations)
            3. Consider pausing non-critical tasks
            4. Increase budget if legitimate spike expected
            Console cost tracking: http://localhost:8765/v1/console/models

  - name: corvinos_console_model_api
    interval: 1m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 7a: Claude Opus API Failures (WARNING)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSModelAPIErrorsOpus
        expr: >
          increase(corvinos_console_model_api_errors_total{model="claude-opus-5"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
          component: model_api
          model: opus
        annotations:
          summary: "Claude Opus API errors detected"
          description: |
            {{ $value | humanize }} Opus API errors in last 5 minutes.

            This is expected to be transient. If persists >10m:
            1. Check Anthropic API status: https://status.anthropic.com
            2. Review Sentry for error patterns
            3. Verify API key is valid and has quota
            4. Fallback to Sonnet is automatic
            Sentry errors: https://sentry.io/?query=model%3DOpus

      # ────────────────────────────────────────────────────────────────────────
      # ALERT 7b: Claude Sonnet API Failures (WARNING)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSModelAPIErrorsSonnet
        expr: >
          increase(corvinos_console_model_api_errors_total{model="claude-sonnet-5"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
          component: model_api
          model: sonnet
        annotations:
          summary: "Claude Sonnet API errors detected"
          description: |
            {{ $value | humanize }} Sonnet API errors in last 5 minutes.

            Actions same as Opus. Fallback to Haiku is automatic.

      # ────────────────────────────────────────────────────────────────────────
      # ALERT 7c: Claude Haiku API Failures (CRITICAL - last resort)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSModelAPIErrorsHaiku
        expr: >
          increase(corvinos_console_model_api_errors_total{model="claude-haiku-4-5"}[5m]) > 5
        for: 1m
        labels:
          severity: critical
          component: model_api
          model: haiku
          fallback_exhausted: "true"
        annotations:
          summary: "Claude Haiku API errors (ALL fallbacks exhausted)"
          description: |
            {{ $value | humanize }} Haiku API errors in last 5 minutes.
            CRITICAL: This is the last fallback model. If Haiku fails, NO models work.

            Immediate actions:
            1. Page oncall + incident commander
            2. Check Anthropic API status immediately
            3. Verify all API keys and quotas
            4. Investigate broader service outage
            5. Prepare incident communication

  - name: corvinos_console_learning
    interval: 5m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 8: Learning Convergence Stalled (INFO)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSLearningConvergenceStalled
        expr: >
          (
            avg(corvinos_console_learning_convergence_score) over (24h)
            < 0.3
          )
        for: 1h
        labels:
          severity: info
          component: learning_loop
          action: manual_tuning_suggested
        annotations:
          summary: "CorvinOS learning loop not converging"
          description: |
            Convergence score is {{ $value | humanize }} (expected: >0.5).
            The learning optimizer is not making progress.

            This is informational (not critical), but manual tuning may help:
            1. Review learning feedback quality in dashboard
            2. Check if feedback signals are realistic
            3. Consider adjusting optimizer learning rate
            4. Verify skills are receiving diverse task inputs
            Learning dashboard: http://localhost:3000/d/learning-health

  - name: corvinos_console_confidence
    interval: 5m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 9: Routing Confidence Declining (WARNING)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSRoutingConfidenceDeclining
        expr: >
          (
            avg(corvinos_console_routing_confidence_score) over (1h)
            < 0.7
          )
        for: 30m
        labels:
          severity: warning
          component: intelligent_router
          signal: quality_degradation
        annotations:
          summary: "CorvinOS routing confidence declining below expected"
          description: |
            Average confidence score: {{ $value | humanize }} (expected: >0.85).
            The router is making less confident decisions.

            This suggests task classification is uncertain. Actions:
            1. Review recent task inputs (characteristics changing?)
            2. Check token boundary transitions (50, 250 tokens)
            3. Review learning feedback for the router skill
            4. Consider retraining confidence model with fresh data
            Routing dashboard: http://localhost:3000/d/routing-overview

  - name: corvinos_console_token_accuracy
    interval: 10m
    rules:
      # ────────────────────────────────────────────────────────────────────────
      # ALERT 10: Token Estimation Inaccuracy (WARNING)
      # ────────────────────────────────────────────────────────────────────────
      - alert: CorvinOSTokenEstimationInaccurate
        expr: >
          histogram_quantile(
            0.95,
            rate(corvinos_console_token_estimation_error_bucket[1h])
          ) > 30
        for: 1h
        labels:
          severity: warning
          component: intelligent_router
          signal: cost_accuracy
        annotations:
          summary: "CorvinOS token estimation accuracy below threshold"
          description: |
            95th percentile error: {{ $value | humanize }}% (threshold: 30%).
            Token estimates are off by more than expected.

            This affects cost prediction accuracy. Actions:
            1. Check if task characteristics changed
            2. Review recent model updates (new models may tokenize differently)
            3. Re-calibrate token estimation model
            4. Consider expanding sample for estimation validation
            Metrics: http://localhost:3000/d/routing-overview

