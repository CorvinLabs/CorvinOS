  - id: L19
    name: Autonomous Forge (skill canary autopilot, on by default)
    state: A
    callers:
      - core/console/corvin_console/app.py:289:autonomous_forge_route
      # the autopilot scheduler, started when the route module is imported (every 600 s, all tenants)
      - core/console/corvin_console/routes/autonomous_forge_routes.py:419:_auto.start_scheduler
    tests:
      - core/console/tests/test_autonomous_forge_canary_e2e.py
    # A since 2026-10-27 (review c120, s5_completeness-2 contract check). The entry said "autopilot off by
    # default" and "nothing is learned while it is off"; the code says the opposite:
    # skill_creator/autonomous.py::autopilot_settings defaults `enabled` to True, the route module starts
    # the scheduler at import, and test_full_canary_lifecycle_over_http asserts `enabled is True` on a
    # fresh root. Each tick executes the canary gate (escalate a traffic step, mark ready, roll back) and
    # forks at most one skill whose organic follow-up grades show a loss. Promotion of a candidate stays
    # an operator decision (POST /approve). Whether the scheduler has acted on the live install is not
    # verified (PLAN-0964). The loss scan reads the USER scope only: the scheduler's roots are the
    # tenant registries <corvin_home>/tenants/<tid>/skill-forge (autonomous_forge_routes._tenant_roots)
    # and skills_overview reads registry_for(root).list(). A follow-up grade of a session- or
    # project-scope skill is stored in that scope's registry and never reaches it: no loss signal,
    # fork or canary is started for such a skill.
    promoted_from: B
    signal_contract:
      signal: >-
        organic follow-up grades of a skill (approval 0.9 / rephrase 0.3 / rejection 0.1),
        mean below 0.5 over at least 3 grades in 14 days = loss signal; a canary's two
        variants are graded apart for its gate
      proxy_of: skill output quality
      validity: {min_outcomes: 3, window_days: 14}   # autonomous.py LOSS_MIN_OUTCOMES / LOSS_WINDOW_S
      consumer: corvin_operator/skill_creator/autonomous.py:115:LOSS_MIN_OUTCOMES
      target: none
      guard: the live skill body is untouched until an operator approves the candidate
      control: >-
        autopilot ON by default (the operator may switch it off per tenant, POST
        /autonomous-forge/autopilot, audited); at most one fork per tick; 24 h cooldown
        per skill; promotion is a human decision
      rollback: canary rollback (POST /autonomous-forge/rollback or the gate verdict)

