# Register of the learning systems (ADR-2281; PLAN-0964 inventory L01-L19, H01-H03, D01-D12).
#
# The single statement of which learning systems exist. One entry per system
# that learns or measures learning. The state is:
#   A  live and read: a reachable production caller runs it AND something reads
#      its output (a decision, a prompt, an operator-facing number)
#   B  live, but its output is shadow or has no reader yet; `intake` states the
#      condition under which the output may act
#   D  dead and scheduled for retirement; `retired_by` names the decision and
#      `modules` the paths it deletes (globs allowed). The entry leaves the
#      register in the same change that deletes its last module.
#
# `callers` lists production call sites as "path:line:needle"; every line was
# re-read on 2026-10-29 against the integrated tree (review c120 r2_s3-1) and
# points at the call, import or registration itself. `needle` is the code of
# that reference (the called function, `module.attr`, `call(arg, "literal"`),
# at least 4 characters and starting with an identifier; the register test
# requires it as CODE tokens - never in a comment, docstring or other string -
# within 3 lines of `line`, and for a caller as an import, a call, an argument
# of a call or a decorated definition (r2_s3-2). So a reference that drifts, a
# call turned into a comment and a deleted call whose name survives nearby fail.
# `readers` lists, the same way, the code that reads a system's output (a
# decision, a prompt, an operator-facing number). An A entry names a reader:
# `readers`, or a signal_contract whose consumer is not `none` (r2_s3-3).
# `promoted_from` marks an entry promoted to A because of its contract; the
# test keeps that contract required.
# `tests` lists the test files that exercise the system.
# tests/learning/test_learning_systems_register.py checks well-formedness and
# the needles, not truth: that a caller really runs is the job of the tests
# named here and of the E2E suites.
#
# `signal_contract` (ADR-2303, CONCEPT-0120) states what a system's signal is.
# Required on every B entry, optional on A. A system with several independent
# signals (L11) carries a list, one contract per skill (`skill`). Keys:
#   signal    what is measured
#   proxy_of  what it stands in for, or `none` when it is the outcome itself;
#             a proxy (proxy_of != none) has `target: none` - it may guard, never
#             be optimised for (Goodhart)
#   validity  the sample floor and join/age bounds as numbers where a decision
#             already fixed them, else `unmeasured` (PLAN-0966 WP4/WP5 measure
#             them; the register never invents a number)
#   consumer  "path:line:needle" of the code that reads the learned value or the
#             measurement (a decision, a gate, an operator-facing number), or `none`
#   target    the learned parameter, or `none`
#   writes    (optional) the stored parameter this signal moves. A signal that
#             is not a proxy and writes a parameter names it as its target; a
#             proxy that writes one keeps `target: none` - the register then
#             says openly that a proxy moves a stored value (L05)
#   guard     the counter-metric that must not get worse
#   control   what holds the learning back today
#   rollback  how a learned change is undone, or `none` (nothing is learned)
# The contract grants no permission to learn; promotion B -> A stays its own
# decision per consumer (ADR-2281 intake rule).
#
# Unreachable modules in the learning scopes are tracked separately by the
# reachability ratchet (scripts/learning_reachability.py + its baseline).
systems:
  # ── A / B: reachable ──────────────────────────────────────────────────────
  - id: L01
    name: Learning host and Data Hub daemon
    state: A
    callers:
      - core/gateway/corvin_gateway/app.py:547:_lh.start
      - core/console/corvin_console/app.py:895:learning_host.start
      - core/console/corvin_console/standalone.py:369:learning_host
    readers:
      # the daemon state (weights, queue, cooldowns) on the console's learning dashboard
      - core/console/corvin_console/routes/learning_dashboard.py:105:learning_host.read_state_summary
    tests:
      - core/background/test_learning_host.py
      - core/console/tests/test_datahub_learning_loop_e2e.py
      - core/console/tests/test_datahub_prune_e2e.py   # D6: the host's daily self-clean pass

  - id: L02
    name: Anomaly monitor (learning host, every 300 s)
    state: A
    callers:
      - core/background/learning_host.py:298:anomaly_monitor.scan
    readers:
      # an anomaly in FREEZES_LEARNING freezes the learned config (ADR-2304 learning brake)
      - core/background/learning_host.py:327:self._freeze
    tests:
      - tests/learning/test_anomaly_monitor.py
      # ADR-2304: two anomalies freeze - SkillAdapter configs on oscillation of their versions or
      # confidence regression; the DoD weights on the chained-change oscillation (> 3
      # skill_config_updated for os.definition_of_done_verifier in 1 h), never on confidence
      - tests/learning/test_adr_2304_learning_brake_e2e.py
      - tests/learning/test_adr_2304_brake_review_fixes_e2e.py

  - id: L03
    name: Event store and outcome sink
    state: A
    callers:
      - core/console/corvin_core/task_manager.py:485:emit_task_outcome
    readers:
      # the optimizer epoch of POST /v1/console/learning/feedback reads the tenant's last 10 outcomes
      - core/console/corvin_console/routes/method_discovery_api.py:406:recent_outcomes
    tests:
      - core/learning/tests/test_outcome_sink.py
      - core/console/tests/test_task_manager_outcome_sink.py
      - core/console/tests/test_learning_loop_routes_e2e.py

  - id: L04
    name: Feedback gate (throttle, reality check, trust weight)
    state: A
    callers:
      - core/learning/event_store.py:149:admit(
      - core/console/corvin_console/routes/stream4_skill_feedback.py:174:admit(
    readers:
      # the verdict decides the write: a refused signal raises FeedbackRejected and nothing is stored
      - core/learning/event_store.py:149:admit(
    tests:
      - core/learning/tests/test_operator_feedback.py
      - core/console/tests/test_learning_loop_routes_e2e.py

  - id: L05
    name: Delegation-router config loop (os.delegation_router learned config)
    state: B
    callers:
      # writer 1: the operator star rating (stream4) -> loop closure -> SkillAdapter
      - core/console/corvin_console/routes/stream4_skill_feedback.py:314:apply_outcome_to_skill
      - core/skills/feedback/loop_closure.py:407:apply_config_delta
      # writer 2: the optimizer epoch of POST /v1/console/learning/feedback (PLAN-0966 A2)
      - core/console/corvin_console/routes/method_discovery_api.py:418:run_optimizer_epoch
      # reader: the router reads the learned threshold back (used only by the gated Phase 2 path)
      - core/skills/os_skills/delegation_router.py:143:_learned_threshold
    tests:
      - tests/e2e/test_stream4_skill_feedback_console_e2e.py
      - tests/learning/test_adr_2305_unverified_causality_e2e.py   # ADR-2305 Part 1 label
    intake: >-
      ADR-2092 gates G0-G4. The two writers are live and both learn from a proxy
      (see signal_contract): the operator star rating and the epoch test on the
      tenant's last 10 task outcomes. Neither is joined to a routing decision; the
      routing-ledger join (L12) feeds only the readiness gates. The only reader of
      the learned threshold is the Phase-2 path (delegation_policy), which runs only
      when the console's EFFECTIVE phase is dual_write: CORVIN_ACP_PHASE=
      phase2_dual_write AND the readiness gates holding on the live ledger (Skill
      booted, no rollback, >=500 judged decisions, judged join rate >=0.95, proxy
      evidence; the bridge additionally the continuous 7-day console soak). Until
      then the learned threshold changes no routing. Before it may act, the target
      needs a signal that is not a proxy (the ledger-joined causal epoch test of
      ADR-2305 Part 2, not built) - a decision, not this register.
    signal_contract:
      - skill: os.delegation_router
        writer: operator star rating (POST /v1/console/feedback/skill)
        signal: >-
          the sign of an operator rating (-2..2) moves the threshold by +/-0.05,
          scaled by the ADR-0534 trust weight; the rating names an arbitrary
          subject_id and is joined to no routing decision
        proxy_of: routing correctness of the router's de-escalation advice
        writes: confidence_threshold
        validity: unmeasured
        consumer: corvin_operator/bridges/shared/delegation_policy.py:235:output.get("confidence_threshold"
        target: none
        guard: task success of the turns routed to native
        control: >-
          read only by the gated Phase 2 path (ADR-2092 G0-G4); feedback trust gate
          (ADR-0534); learning brake (ADR-2304)
        rollback: SkillAdapter.rollback (versioned config snapshots)
      - skill: os.delegation_router
        writer: optimizer epoch (POST /v1/console/learning/feedback)
        signal: >-
          success share of the tenant's last 10 finished tasks (recent_outcomes,
          tenant-wide, not attributed to the router) in the epoch test; every
          accepted change carries ":unverified_causality" (ADR-2305 Part 1)
        proxy_of: routing correctness of the router's de-escalation advice
        writes: confidence_threshold
        validity: unmeasured
        consumer: corvin_operator/bridges/shared/delegation_policy.py:235:output.get("confidence_threshold"
        target: none
        guard: task success of the turns routed to native
        control: >-
          read only by the gated Phase 2 path (ADR-2092 G0-G4); learning_feedback
          consent; feedback trust gate (ADR-0534); learning brake (ADR-2304)
        rollback: SkillAdapter.rollback (versioned config snapshots)
    measured:
      date: "2026-10-25"
      source: core/skills/os_skills/monitoring/readiness.py evaluate(), tenant _default, read-only
      gates: ADR-2092 (>=500 decisions, join rate >=0.95, console soak 7 d, proxy evidence)
      bridge: {ready: false, reason: console_soak_incomplete, decisions: 962, join_rate: 0.989, delegating: 26, disagreements: 1}
      console: {ready: false, reason: insufficient_samples, decisions: 365, join_rate: 0.923, delegating: 36, disagreements: 0}
      verdict: Phase 2 is not switched; no gate-holding decision is proposed.

  - id: L06
    name: Skill grades, injection gate, promotion
    state: A
    callers:
      - corvin_operator/bridges/shared/adapter.py:3330:collect_active_skills
      - corvin_operator/bridges/shared/adapter.py:12792:grade_from_user_followup
      - corvin_operator/bridges/shared/adapter.py:13434:auto_grade_from_output
      - corvin_operator/skill-forge/skill_forge/mcp_server.py:490:promote
      - core/console/corvin_console/routes/chat.py:772:grade_followup
      - core/console/corvin_console/chat_runtime.py:8639:record_turn_skills
    readers:
      # the injection gate: a skill with no grade or a mean score <= 0 is not injected
      - corvin_operator/bridges/shared/skill_inject.py:696:spec.n_grades
    tests:
      - corvin_operator/skill-forge/tests/test_grading.py
      - corvin_operator/bridges/shared/test_adapter_skill_inject.py
      - corvin_operator/bridges/shared/test_outcome_praise_e2e.py
      - core/console/tests/test_followup_grading_ws_e2e.py
      - tests/learning/test_learning_call_site_pins.py

  - id: L07
    name: CEL turn grades
    state: B
    callers:
      - core/console/corvin_console/chat_runtime.py:8414:_cel_record_outcome
      - core/console/corvin_console/chat_runtime.py:9168:_cel_record_outcome
    tests:
      - corvin_operator/context_engineering/tests/test_grades_adr0285.py
    intake: >-
      Advisory only. The native console path records success=True for every
      turn that reaches its end (chat_runtime.py:9168), so the grade means "turn
      completed", not "the stage helped"; the delegated (ACS/TDE) branch records
      the run's own result (ok or bounded stop, chat_runtime.py:8414). Behind the
      outcome_feedback_loop flag (default off). An automatic grade never makes a
      stage default-eligible, only an operator grade does. It may steer stage
      selection only with a measured outcome source (T-0128 was cancelled for want
      of one) and a decision naming it.
    signal_contract:
      signal: >-
        turn completed: success=True for every native console turn that reaches
        its end; the run's result (ok or bounded stop) on the delegated branch
      proxy_of: output quality
      validity: unmeasured
      consumer: none
      target: none
      guard: a stage whose completed-turn rate falls below its reference is a warning
      control: advisory only; automatic grades never make a stage default-eligible
      rollback: none

  - id: L08
    name: Model selector learner (descriptive only, shown on the Models page)
    state: A
    callers:
      - corvin_operator/bridges/shared/adapter.py:5398:shadow_classify_task
      - corvin_operator/bridges/shared/adapter.py:6888:report_turn_outcome
      - corvin_operator/bridges/shared/adapter.py:6927:report_turn_outcome
      - core/console/corvin_core/task_manager.py:676:_update_model_selection_confidence
      # reader: GET /v1/console/v1/engine/config -> the Models page task cards
      - core/console/corvin_console/routes/engine_api.py:667:optimizer.get_stats
    tests:
      - corvin_operator/bridges/shared/test_model_selector_shadow.py
      - core/console/corvin_console/web-next/tests/unit/task-type-card-evidence.test.tsx
    # A since 2026-10-27 (review c120, s5_completeness-4), by the state definition above: its output
    # has an operator-facing reader - GET /v1/engine/config returns confidence_score per tier and the
    # Models page shows it on each task card. The number is a proxy, so the page labels it
    # "no-error score (proxy)", never "confidence". Model selection never reads it; it may influence
    # selection only with a real quality signal (IDEA-0002) and a decision naming that consumer.
    # promoted_from: the register test requires the contract (and its consumer) to stay.
    promoted_from: B
    signal_contract:
      signal: >-
        bridge turn: 0.85 when it ended without an error, 0.2 with one
        (model_selector_shadow.report_turn_outcome); finished task carrying a
        model_selected: 0.95 completed / 0.3 failed, +0.05 under 2 s
        (model_selection_learning_listener.process_outcome)
      proxy_of: answer quality
      validity: unmeasured
      consumer: core/console/corvin_console/routes/engine_api.py:667:optimizer.get_stats
      target: none
      guard: error rate per model tier
      control: descriptive only; model selection never reads it; shown labelled as a proxy
      rollback: none

  - id: L09
    name: Savings meter (Free-tier cost.optimize allowance)
    state: A
    callers:
      - core/console/corvin_console/routes/settings.py:687:savings_meter.read
      - corvin_operator/bridges/shared/savings_cap.py:224:_core_module("core.learning.savings_meter"
    readers:
      # the Free-tier cap decision reads the measured saving
      - corvin_operator/bridges/shared/savings_cap.py:225:meter.read
    tests:
      - corvin_operator/bridges/shared/test_savings_cap.py
      - corvin_operator/bridges/shared/test_savings_cap_wiring.py
      - core/console/tests/test_cost_optimize_settings_e2e.py

  - id: L10
    name: User model distillation (L28, opt-in per chat)
    state: A
    callers:
      - corvin_operator/bridges/shared/adapter.py:13558:_user_model_distill_async
    readers:
      # the distilled model is loaded into the prompt of the opted-in chat
      - corvin_operator/bridges/shared/adapter.py:3649:_user_model.load
    tests:
      - corvin_operator/bridges/shared/test_user_model.py
      - corvin_operator/bridges/shared/test_adapter_recall.py
      - tests/learning/test_learning_call_site_pins.py
    # A since 2026-10-25: distill() asked recall('') and the empty query matched no FTS5 row, so
    # no model was ever written; recall() now answers an empty, chat-scoped query with that
    # chat's newest turns. Only chats whose profile sets user_model_enabled distill (GDPR Art. 6).

  - id: L11
    name: Shadow OS skills (workflow optimizer, flow guard, security orchestrator, context adapter)
    state: B
    callers:
      - corvin_operator/bridges/shared/adapter.py:3222:workflow_optimizer_wrapper
      - corvin_operator/bridges/shared/spawn_gates.py:348:flow_guard_skill
      - corvin_operator/bridges/shared/auth_elevation.py:216:security_orchestrator_skill
      - corvin_operator/context_engineering/stages/l10_adapter.py:138:adapt_context_l10
    tests:
      - tests/skills/test_workflow_optimizer_skill_shadow_e2e.py
      - tests/skills/test_flow_guard_skill_shadow_e2e.py
      - tests/skills/test_security_orchestrator_skill_shadow_e2e.py
      - tests/e2e/test_os_context_adapter_l10_production.py
    intake: >-
      ADR-0532 shadow intake: each call compares the skill's advice with the
      production decision and audits it (skill.executed / context.adapted); the
      advice is never applied and nothing consumes it. A skill may act only
      through a new decision that names its consumer, after a readiness
      measurement on live data in the ADR-2092 shape (>=500 joined decisions per
      surface). os.flow_guard may never weaken an L34 decision.
    signal_contract:
      - skill: os.workflow_optimizer
        signal: agreement of the shadow advice with the production decision
        proxy_of: none
        validity: unmeasured
        consumer: none
        target: none
        guard: task success when advice and production decision differ
        control: shadow only (ADR-0532); the advice is never applied
        rollback: none
      - skill: os.flow_guard
        signal: agreement of the shadow advice with the L34 gate decision
        proxy_of: none
        validity: unmeasured
        consumer: none
        target: none
        guard: no L34 decision is ever weakened (ADR-2049)
        control: shadow only (ADR-0532); the advice is never applied
        rollback: none
      - skill: os.security_orchestrator
        signal: agreement of the shadow advice with the elevation decision
        proxy_of: none
        validity: unmeasured
        consumer: none
        target: none
        guard: it may only tighten, never loosen
        control: shadow only (ADR-0532); rarely reached
        rollback: none
      - skill: os.context_adapter
        signal: content-free context adaptation compared with the served brief
        proxy_of: none
        validity: unmeasured
        consumer: none
        target: none
        guard: the served brief is never changed
        control: shadow only (ADR-0532); audited as context.adapted
        rollback: none

  - id: L12
    name: Routing ledger and rollback judge
    state: B
    callers:
      # decision record, one per turn: a turn that stays native is recorded by the triage
      # (delegation_policy.resolve_delegation_route), a delegation-worthy one by
      # resolve_worker_engine, a turn neither reached by the unrouted fallback
      - core/console/corvin_console/chat_runtime.py:4237:resolve_delegation_route
      - core/console/corvin_console/chat_runtime.py:4536:_shared_target
      - core/console/corvin_console/chat_runtime.py:4574:route_and_record
      - corvin_operator/bridges/shared/adapter.py:9785:resolve_delegation_route
      - corvin_operator/bridges/shared/adapter.py:9436:resolve_worker_engine
      - corvin_operator/bridges/shared/adapter.py:9644:route_and_record
      # outcome record, joined to the decision by turn_id
      - core/console/corvin_console/chat_runtime.py:4612:record_turn_outcome
      - corvin_operator/bridges/shared/adapter.py:9698:record_turn_outcome
    tests:
      - core/console/tests/test_l5_routing_loop_console_e2e.py
      - tests/e2e/test_l5_routing_loop_bridge_e2e.py
    intake: >-
      ADR-2092 gates G0-G4 (see L05). The ledger is written on every OS turn on
      both surfaces; the rollback judge and readiness evaluation act only for
      Phase 2, which is refused and audited until the gates hold. Delegating
      decisions exist on both surfaces (see measured); what is missing is the
      sample/join floor on the console and the 7-day console soak for the bridge.
    signal_contract:
      signal: >-
        task success per router decision (routing ledger joined to the OUTCOME by
        turn_id; NOT-JUDGED turns - cancelled, orphaned, no_engine - are counted
        but excluded from the join rate and every success rate)
      proxy_of: none
      # ADR-2092 gates: G1 samples + join rate, G4 the continuous console soak (days)
      validity: {min_joined_decisions: 500, min_join_rate: 0.95, min_console_soak_days: 7}
      consumer: core/skills/os_skills/monitoring/dual_write.py:112:readiness.cached_evaluate
      # the join learns no parameter: it gates Phase 2 (readiness) and trips the rollback judge
      target: none
      guard: task success of the turns routed to native
      control: ADR-2092 gates G0-G4 (Phase 2 only)
      rollback: rollback judge (rollback_detector) trips Phase 2 back to shadow; audited reset
    measured:
      date: "2026-10-25"
      source: core/skills/os_skills/monitoring/readiness.py evaluate(), tenant _default, read-only
      gates: ADR-2092 (>=500 decisions, join rate >=0.95, console soak 7 d, proxy evidence)
      bridge: {ready: false, reason: console_soak_incomplete, decisions: 962, join_rate: 0.989, delegating: 26, disagreements: 1}
      console: {ready: false, reason: insufficient_samples, decisions: 365, join_rate: 0.923, delegating: 36, disagreements: 0}
      verdict: Phase 2 is not switched; no gate-holding decision is proposed.

  - id: L13
    name: Flow-guard learning route
    state: B
    callers:
      - core/console/corvin_console/routes/flow_guard.py:51:learning_integration
      - core/console/corvin_console/app.py:266:flow_guard_route
    tests:
      # the real POST /v1/console/flow/feedback and GET /flow/policy routes over HTTP
      - tests/learning/test_adr_2283_flow_guard_feedback_e2e.py
    intake: >-
      No automatic feedback source exists (T-0169 cancelled); the only input is an
      operator's POST /v1/console/flow/feedback. Since ADR-2283 the route writes
      audit-first through the strict core-chain backend (a record that does not
      commit answers 503 and changes nothing), and it may only strengthen
      (rejected / pii_leak_detected add or raise a DENY rule; success / approved
      answer 422). It changes the route's own per-tenant in-memory FlowGuard, never
      the L34 production gate (spawn_gates.check_l34). Advisory learning for L34 may
      come only after the ADR-2264 classifier fix, as a new decision (ADR-2282).
    signal_contract:
      signal: >-
        an operator's flow feedback (rejected / pii_leak_detected) adds or raises a
        DENY rule of the route's own FlowGuard; weakening results are refused
      proxy_of: none
      validity: unmeasured
      # read only by GET /v1/console/flow/policy of the same route; no production gate reads it
      consumer: none
      target: none
      guard: no L34 decision is ever weakened (ADR-2049)
      control: strengthen-only; audit-first strict core chain (ADR-2283); not read by L34
      rollback: none (the instance is in memory and is rebuilt on restart)

  - id: L14
    name: Layer Forge learning integration (emit_*_confidence / *_outcome)
    state: B
    callers:
      - core/forge_bundle/item_import.py:411:create_layer_definition
      - core/orchestration/layer_forge/orchestrator.py:136:emit_gate_confidence
      - core/orchestration/layer_forge/orchestrator.py:170:emit_enforcement_confidence
      - core/orchestration/layer_forge/orchestrator.py:211:emit_review_confidence
    tests:
      - tests/learning/test_learning_call_site_pins.py
    # B since 2026-10-29 (review c120 r2_s3-3): the events are emitted and stored, but nothing reads
    # them - LayerForgeAnalytics._read_learning_events (core/orchestration/layer_forge/analytics.py)
    # is a stub that returns [] ("TODO: implement actual event store query"). State A requires a
    # reader; the generic learning status only counts events, it does not read a confidence.
    intake: >-
      None yet. The confidence_score / outcome_feedback events of Layer Forge
      definitions are written audit-first to the learning event store and read by
      nothing (the analytics read is a stub). They may inform a Layer Forge
      decision only through a new decision that names the consumer and the gate.
    signal_contract:
      signal: >-
        gate / enforcement / review verdicts of a Layer Forge definition as
        confidence steps (PASS +0.1, FAIL -0.2, ...) and transition / rejection
        outcomes
      proxy_of: correctness of the layer definition
      validity: unmeasured
      consumer: none
      target: none
      guard: the quality gates stay fail-closed on FAIL/ERROR
      control: written only; no reader
      rollback: none

  - id: L15
    name: KB learning (kb guidance run, guidance skills)
    state: A
    callers:
      - core/console/corvin_console/kb_projection.py:527:_run(repo, "guidance", "run"
    readers:
      # the pending guidance is read and minted as a user-scope SkillForge skill (injected by L06)
      - core/console/corvin_console/kb_projection.py:466:_run(repo, "guidance", "pending"
    tests:
      - core/console/tests/test_kb_projection_e2e.py

  - id: L16
    name: Compute search strategies (grid, random, bayes) and HAC attribution
    state: A
    callers:
      - core/compute/corvin_compute/worker.py:370:load_strategy
      - core/compute/corvin_compute/cli.py:247:HACEngine
    readers:
      # the search reads the strategy's next proposal from the history it learned
      - core/compute/corvin_compute/driver.py:171:self.strategy.suggest_batch
    tests:
