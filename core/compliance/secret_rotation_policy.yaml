# Secret Rotation Policy (GDPR Art. 32, ADR-0232 compliance)
# Defines rotation intervals, storage, and enforcement for secrets

rotation_policy:
  enabled: true
  # Fail-closed: if rotation is overdue, boot tripwire refuses to serve requests
  fail_closed: true
  
  # Rotation intervals per secret type
  intervals:
    api_keys: 90        # days
    database_credentials: 90
    encryption_keys: 180
    oauth_tokens: 30
    session_tokens: 7

  # Storage (immutable audit trail)
  storage:
    location: "~/.corvin/compliance/secret_rotations.jsonl"
    format: "jsonl"  # append-only
    permissions: "0600"  # owner read+write only
    encryption: "age"  # encrypted at rest

  # Audit trail (ADR-0232 integration)
  audit:
    event_type: "secret_rotated"
    mandatory_fields:
      - secret_id
      - rotation_time
      - old_secret_hash (SHA256, never plaintext)
      - new_secret_hash
      - rotated_by
      - tenant_id
    hash_chained: true

  # Boot-time enforcement
  boot_enforcement:
    enabled: true
    fail_threshold_days: 0  # Any overdue rotation → fail-closed
    check_on_startup: true

  # Notification
  notifications:
    enabled: true
    grace_period_days: 14  # warn at 14 days before rotation due
    channels:
      - type: "audit_log"
        message_type: "secret_rotation_due"
