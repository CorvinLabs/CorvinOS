# Slack Notifier Plugin Manifest
# Example plugin that sends audit events to Slack

plugin_id: slack-notifier
version: 1.0.0
display_name: "Slack Notifier"

# This is a notification backend
plugin_type: notification_backend

# Compliance & provenance
origin: community
boot_layer: installed
pii_risk: low
requires_consent: false
audit_required: true

# This plugin only makes outbound HTTPS calls to Slack
locality: local
network_egress: external
egress_hosts:
  - hooks.slack.com

# Author information
author: "Your Name"
email: "your.email@example.com"
homepage: "https://github.com/your-org/slack-notifier"
license: "Apache-2.0"

# Settings schema (JSON Schema Draft 7)
settings_schema:
  type: object
  properties:
    webhook_url:
      type: string
      description: "Slack incoming webhook URL (from https://api.slack.com/apps/)"
      pattern: "^https://hooks\\.slack\\.com/services/.+$"

    test_webhook_on_load:
      type: boolean
      description: "Test the webhook URL when the plugin loads"
      default: true

    notify_on_events:
      type: array
      items:
        type: string
      description: "Only notify on these event types (empty = all events)"
      default: []
      examples:
        - "plugin.loaded"
        - "user.login"
        - "plugin.error"

    min_severity:
      type: string
      enum: ["debug", "info", "warning", "error", "critical"]
      description: "Minimum severity level to send"
      default: "warning"

    channel:
      type: string
      description: "Slack channel to post to (webhook-specific; optional)"
      default: ""

    mention_on_error:
      type: string
      description: "Slack mention/group to tag on errors (e.g., @channel, @oncall)"
      default: ""

  required:
    - webhook_url

# Plugin dependencies (other plugins this one depends on)
dependencies: []

# Settings schema version (for tracking breaking changes across versions)
settings_schema_version: "1.0"

# Optional: breaking changes from a previous version
# breaking_changes:
#   - old_setting: "channel_id"
#     new_setting: "channel"
#     migration: "Use the channel name or webhook channel setting instead"
