# Semantic Context Retriever — builtin marketplace plugin (ADR-0598).
#
# Registers as an ADR-0599 `context_retriever` provider. It NARROWS/REORDERS the
# candidate context set the CEL memory stage (and, later, TDE step assembly)
# already produced — it never adds. This first cut ranks with BM25 (lexical
# Okapi); embeddings are a later version.
#
# Field names are the REAL PluginRecord fields (core/plugins/corvin_plugins/
# manifest.py::PluginRecord.from_dict). The ADR-0247 gate is fail-closed on
# unknown fields, so only registry/gate fields live here — no Plugin-Builder
# interview fields (id / requires_network_egress / requires_auth /
# external_libraries / category), which would be rejected as unknown.
plugin_id: semantic-context-retriever
plugin_type: context_retriever
version: 0.1.0
display_name: Semantic Context Retriever
origin: builtin
boot_layer: installed
# Local, torch-free BM25 ranking. No outbound calls at all → truthful `none`.
locality: local
network_egress: none
egress_hosts: []
# Selects only from already-gated candidates (ADR-0297); introduces no new PII.
pii_risk: none
requires_consent: false
audit_required: true
