# Nginx configuration for CorvinOS Stats Dashboard

upstream api_backend {
    # Internal CorvinOS API server (metrics endpoint)
    server api.internal:8000;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=stats_limit:10m rate=100r/m;

# Cache zones
proxy_cache_path /var/cache/nginx/stats levels=1:2 keys_zone=stats_cache:10m max_size=100m inactive=1h;

server {
    listen 80;
    server_name corvin-labs.com www.corvin-labs.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name corvin-labs.com www.corvin-labs.com;

    # SSL Certificates (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/corvin-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corvin-labs.com/privkey.pem;

    # Security headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1024;
    gzip_proxied any;

    # Stats dashboard (static HTML)
    location /stats {
        alias /usr/share/nginx/html/stats;
        index index.html;
        expires 5m;  # Cache for 5 minutes
        add_header Cache-Control "public, max-age=300";
    }

    # API proxy (real-time metrics)
    location /api/metrics/ {
        limit_req zone=stats_limit burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache GET requests
        proxy_cache stats_cache;
        proxy_cache_valid 200 5s;  # Cache successful responses for 5 seconds
        proxy_cache_use_stale error timeout invalid_header updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Metrics for Prometheus
    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;  # Internal network
        deny all;
    }

    # Root redirect
    location / {
        return 301 /stats;
    }

    # 404 handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
