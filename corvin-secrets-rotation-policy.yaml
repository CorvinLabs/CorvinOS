# Secret Rotation Policy (GDPR Art. 32 compliance)
# Enforces periodic credential rotation and audit trail

kind: SecretRotationPolicy
version: "1.0"
metadata:
  name: corvin-secrets-rotation
  namespace: corvinOS
  owner: compliance-team
  created: 2026-09-19

spec:
  # Rotation schedule (GDPR Art. 32)
  rotation_interval: 90  # days
  rotation_grace_period: 7  # days before expiry when rotation must start

  # Affected secret types
  secrets:
    - name: api_keys
      type: bearer_token
      rotation_interval: 90

    - name: db_credentials
      type: username_password
      rotation_interval: 90

    - name: signing_keys
      type: asymmetric
      rotation_interval: 180  # Longer for signing keys

    - name: encryption_keys
      type: symmetric
      rotation_interval: 365  # Annual for master keys

  # Enforcement
  enforcement:
    fail_closed: true  # Deny access if secret expired
    audit_required: true  # GDPR Art. 32: log all rotations
    notification: true  # Alert on expiry approaching

  # Audit trail (GDPR Art. 30)
  audit:
    log_location: ~/.corvin/audit.jsonl
    log_format: "json"
    include_fields:
      - timestamp
      - secret_id
      - rotation_reason
      - old_hash
      - new_hash
      - operator_id
      - tenant_id

  # Exception handling
  exceptions:
    allow_override: false  # No emergency bypass
    escalation_email: security@corvinlabs.com
