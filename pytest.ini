[pytest]
# Console panel E2E test configuration (ADR-0XXX Phase A Blocker 1)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for panel testing (from tests/console/conftest.py)
markers =
    p0: Critical P0 infrastructure panels (dashboard, login, models, vibe-engineering)
    p1: Core P1 user-facing panels (settings, forge, skills, marketplace, video-producer)
    p2: Secondary P2 panels (bridges, voice, quality, compliance, api-keys, agent-hub)
    p3: Secondary P3 features (files, memory, compute, skill-forge, ldd, rag, etc.)
    p4: Edge case P4 panels (custom-provider, flows, datahub, licensing, telemetry)
    p5: Rarely used / future panels (orgs, people)
    p6: Error and onboarding pages (login, not-found, landing)
    critical_path: P0 + P1 panels + auth flow (run first, blocks Phase 2)
    secondary: P2 + P3 panels
    interactive: Panels with forms, tables, tabs, charts (need interaction testing)
    slow: Panels with >2s load time
    manifest_driven: Panels from backend capability manifest (plugins, installed, dynamic)
    requires_flag: Panel requires a capability flag to be visible
    smoke: Quick smoke test (visibility + no 404s)
    full: Full panel test (smoke + interactions + assertions)
    perf: Performance measurement test
    auth: Authentication-related tests
    accessibility: Accessibility / a11y tests

# Asyncio mode for async tests
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = .pytest_cache/pytest.log
log_file_level = DEBUG

# Timeout for tests (30s default, can override per test)
timeout = 30

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (optional, for pytest-cov)
# addopts = --cov=core/console --cov-report=html --cov-report=term

# Report settings
# addopts = -v --tb=short --strict-markers --disable-warnings
