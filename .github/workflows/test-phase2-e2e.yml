name: Phase 2 E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "core/console/**"
      - "core/task_notifications/**"
      - "core/learning/**"
      - "tests/e2e/test_phase2_*.py"
  pull_request:
    paths:
      - "core/console/**"
      - "core/task_notifications/**"
      - "tests/e2e/test_phase2_*.py"

jobs:
  phase2-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Phase 2 E2E Tests
        env:
          CORVIN_TENANT_ID: "ci-test-tenant"
          CORVIN_HOME: /tmp/corvin-ci
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          mkdir -p /tmp/corvin-ci
          python -m pytest tests/e2e/test_phase2_real_task_e2e.py -v --tb=short --cov=core.console --cov=core.task_notifications

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: phase2-e2e
          name: phase2-coverage
