name: Zero-Caller Sweep

# Fails when a NEW implementation of a registration contract (Brain Hub
# Subsystem, OS BaseSkill, CEL stage, Plugin = a class with plugin_id + on_load)
# has no import path from any
# entry point. Pre-existing dead ones are recorded in
# scripts/zero_caller_baseline.json; wiring or deleting one means removing its
# baseline line. Background: three "context bridge" implementations were built
# and none was used (Corvin-Knowledge ADR-2102). Limit: an implementation a live
# package re-exports but nothing calls passes this gate.

on:
  pull_request:
    paths:
      - '**.py'
      - '**.sh'
      - '**/plugin.yaml'
      - 'pyproject.toml'
      - '**.service'
      - 'scripts/zero_caller_baseline.json'
      - 'scripts/path_composition_baseline.json'
      - 'core/learning/learning_systems.yaml'
      - 'scripts/learning_reachability_baseline.json'
      - 'docs/claude-ref/learning-loop.md'
      - 'CLAUDE.md'
      - '.github/workflows/zero-caller-sweep.yml'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.sh'
      - '**/plugin.yaml'
      - 'pyproject.toml'
      - '**.service'
      - 'scripts/zero_caller_baseline.json'
      - 'scripts/path_composition_baseline.json'
      - 'core/learning/learning_systems.yaml'
      - 'scripts/learning_reachability_baseline.json'
      - 'docs/claude-ref/learning-loop.md'
      - 'CLAUDE.md'
      - '.github/workflows/zero-caller-sweep.yml'

jobs:
  zero-caller-sweep:
    name: No new unreachable contract implementations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run sweep (gate)
        run: python3 scripts/zero_caller_sweep.py --check

      # stdlib + pytest only. tests/conftest.py loads the console fixture plugin
      # (FastAPI + the console package), which this job does not install, so it
      # is blocked by name — same as audit-completeness.yml.
      - name: Run sweep tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q -p no:tests.fixtures_console tests/scripts/test_zero_caller_sweep.py

  # C-1 path composition guard (measuring mode): no NEW hand-built tenant/chain
  # path composition, counts only shrink. Baseline:
  # scripts/path_composition_baseline.json (ratcheted; additions need
  # --accept KEY --reason TEXT). Same stdlib-only baseline-gate shape as the
  # sweep, but its own job so one gate's failure does not skip the other.
  path-composition-guard:
    name: No new hand-built tenant/chain path composition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Path composition guard (gate)
        run: bash scripts/path_composition_guard.sh --check

      - name: Run guard tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q -p no:tests.fixtures_console tests/scripts/test_path_composition_guard.py

  # ADR-2281/2282: the learning-system register, its reachability ratchet and the retirement
  # guards are CI invariants, not only a local run-all-tests.sh entry. Static tests only
  # (pytest + pyyaml, no console): the call-site pins need the adapter and stay in
  # run-all-tests.sh. The register test skips its ADR-resolution check when no
  # Corvin-Knowledge checkout is reachable (it is not checked out here).
  learning-register:
    name: Learning register, reachability ratchet, retirement guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run learning register tests
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest -q -p no:tests.fixtures_console \
            tests/learning/test_learning_systems_register.py \
            tests/learning/test_learning_reachability_ratchet.py \
            tests/learning/test_adr_2282_retired_modules.py \
            tests/learning/test_adr_2282_supersession_audit.py
