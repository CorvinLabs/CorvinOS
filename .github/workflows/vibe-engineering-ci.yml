name: Vibe Engineering CI

on:
  push:
    branches: [main]
    paths:
      - 'core/vibe_engineering/**'
      - '.github/workflows/vibe-engineering-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/vibe_engineering/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage scikit-learn structlog

      - name: Run unit tests (Sprint 1)
        run: |
          python -m pytest core/vibe_engineering/tests/test_sprint1_lifecycle_checkpoint.py \
            -v --tb=short --cov=core/vibe_engineering --cov-report=term-missing

      - name: Run unit tests (Sprint 2)
        run: |
          python -m pytest core/vibe_engineering/tests/test_sprint2_context_reducer.py \
            core/vibe_engineering/tests/test_sprint2_recovery_engine.py \
            -v --tb=short --cov=core/vibe_engineering --cov-append --cov-report=term-missing

      - name: Check code coverage
        run: |
          coverage report --fail-under=80 || true
          coverage html --title="Vibe Engineering Coverage"

      - name: Type checking (mypy)
        run: |
          pip install mypy
          mypy core/vibe_engineering --ignore-missing-imports || true

      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: vibe-engineering
          name: vibe-engineering-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run ruff
        run: ruff check core/vibe_engineering/

      - name: Check formatting (black)
        run: black --check core/vibe_engineering/ || true

      - name: Check import sorting (isort)
        run: isort --check-only core/vibe_engineering/ || true
