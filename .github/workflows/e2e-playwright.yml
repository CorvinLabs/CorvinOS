name: E2E Tests — Playwright (Console Panels)

on:
  push:
    branches: [main, develop]
    paths:
      - 'core/console/corvin_console/web-next/**'
      - '.github/workflows/e2e-playwright.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'core/console/corvin_console/web-next/**'
  schedule:
    # Nightly run at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    name: E2E Tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        browser: [chromium, firefox]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'core/console/corvin_console/web-next/package-lock.json'

      - name: Install dependencies
        working-directory: core/console/corvin_console/web-next
        run: npm ci

      - name: Install Playwright browsers
        working-directory: core/console/corvin_console/web-next
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests (P0 critical path) — ${{ matrix.browser }}
        working-directory: core/console/corvin_console/web-next
        env:
          CI: true
          CONSOLE_BASE_URL: http://127.0.0.1:8765/console
        run: npm run test:e2e -- --project=${{ matrix.browser }} --grep="^P0-"
        continue-on-error: false

      - name: Run E2E tests (P1-P3 important) — ${{ matrix.browser }}
        working-directory: core/console/corvin_console/web-next
        env:
          CI: true
          CONSOLE_BASE_URL: http://127.0.0.1:8765/console
        run: npm run test:e2e -- --project=${{ matrix.browser }} --grep="^P[1-3]-"
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: core/console/corvin_console/web-next/playwright-report/
          retention-days: 14

  e2e-status:
    name: E2E Test Status
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always()

    steps:
      - name: Check E2E status
        run: |
          if [ "${{ needs.e2e-tests.result }}" = "failure" ]; then
            echo "❌ E2E tests failed"
            exit 1
          else
            echo "✅ E2E tests passed"
          fi
