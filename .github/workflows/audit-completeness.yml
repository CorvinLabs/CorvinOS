name: Audit Completeness Check

on:
  pull_request:
    paths:
      - 'corvin_operator/forge/forge/security_events.py'
      - 'core/compute/corvin_compute/audit.py'
      - 'corvin_operator/bridges/shared/a2a_audit.py'
      - 'core/plugins/corvin_plugins/audit.py'
      - 'tests/security/test_audit_phase2_events.py'
      - 'tests/security/test_audit_registry_round4.py'
      - 'tests/security/test_anchor_key_relative_path.py'
      - 'scripts/verify_audit_event_completeness.py'
      - '.github/workflows/audit-completeness.yml'
  push:
    branches:
      - main
    paths:
      - 'corvin_operator/forge/forge/security_events.py'
      - 'core/compute/corvin_compute/audit.py'
      - 'corvin_operator/bridges/shared/a2a_audit.py'
      - 'core/plugins/corvin_plugins/audit.py'
      - 'tests/security/test_audit_phase2_events.py'
      - 'tests/security/test_audit_registry_round4.py'
      - 'tests/security/test_anchor_key_relative_path.py'
      - 'scripts/verify_audit_event_completeness.py'
      - '.github/workflows/audit-completeness.yml'

jobs:
  audit-completeness:
    name: Verify Audit Event Completeness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run audit completeness check
        run: python3 scripts/verify_audit_event_completeness.py
        id: audit-check

      - name: Comment on PR if sync error
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Audit Completeness Check Failed\n\nThe EVENT_SEVERITY and _EVENT_ALLOWLIST registries are out of sync.\n\nRun `python3 scripts/verify_audit_event_completeness.py` locally to debug.',
            })

      - name: Install pytest
        if: success()
        run: python3 -m pip install pytest

      # These tests need only the stdlib + pytest. tests/conftest.py loads the
      # console fixture plugin (FastAPI + the whole console package), which this
      # job does not install, so it is blocked by name; the repo-root conftest
      # still runs and sandboxes CORVIN_HOME / XDG_CONFIG_HOME / the anchor key.
      - name: Run audit tests
        if: success()
        run: >-
          python3 -m pytest -v -p no:tests.fixtures_console
          tests/security/test_audit_phase2_events.py
          tests/security/test_audit_registry_round4.py
          tests/security/test_anchor_key_relative_path.py

  audit-coverage:
    name: Audit Event Coverage Report
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # The measured numbers, from the same script the gate runs (it imports
      # the registries as the writer sees them). This step used to regex the
      # source and print a hard-coded "Coverage: 100%".
      - name: Registry report
        run: python3 scripts/verify_audit_event_completeness.py --list-unregistered
