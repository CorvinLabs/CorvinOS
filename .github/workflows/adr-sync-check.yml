name: ADR-Code Sync Check

# Trigger: Auf jedem Push zu main + Pull Request
on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - '!core/**/tests/**'
      - '!core/**/*.pyc'
  pull_request:
    branches:
      - main
    paths:
      - 'core/**'
      - '!core/**/tests/**'
      - '!core/**/*.pyc'

jobs:
  adr-sync-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Detect code changes vs ADR changes
        id: detect
        run: |
          # Determine base for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="origin/main~1"
          fi

          # Get list of changed files
          CHANGED_FILES=$(git diff $BASE_REF..HEAD --name-only || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Filter core code changes (exclude tests)
          CORE_CHANGES=$(echo "$CHANGED_FILES" | grep '^core/' | grep -v '/tests/' | grep -v '\.pyc$' || true)
          echo "core_changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CORE_CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # ADR references: ADRs live ONLY in the sibling Corvin-ADR repo (ADR-0516),
          # so a CorvinOS diff can never contain one. What a commit MUST carry
          # instead is a reference to the ADR that documents it ("[ADR-0635]",
          # "ADR-0635 documents ...") — we collect every ADR id named in the
          # commit messages of the range and verify each exists upstream.
          COMMIT_MSGS=$(git log --format=%B $BASE_REF..HEAD 2>/dev/null || git log -1 --format=%B)
          ADR_REFS=$(echo "$COMMIT_MSGS" | grep -oE 'ADR-[0-9]{4}' | sort -u || true)
          echo "adr_refs<<EOF" >> $GITHUB_OUTPUT
          echo "$ADR_REFS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "commit_msgs<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check out Corvin-ADR (single source of truth)
        uses: actions/checkout@v4
        with:
          repository: CorvinLabs/Corvin-ADR
          path: .corvin-adr
          fetch-depth: 1

      - name: Validate ADR documentation
        id: validate
        run: |
          CORE_CHANGES="${{ steps.detect.outputs.core_changes }}"
          ADR_REFS="${{ steps.detect.outputs.adr_refs }}"
          COMMIT_MSGS="${{ steps.detect.outputs.commit_msgs }}"

          # No core code changed -> pass
          if [ -z "$CORE_CHANGES" ]; then
            echo "status=pass" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Explicit exception tags (see CLAUDE.md "Exception Workflow")
          if echo "$COMMIT_MSGS" | grep -qE '\[(skip-adr-check|test-only|docs-only)\]|^refactor(\(|:)'; then
            echo "status=pass_with_exception" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Core code changed: every referenced ADR must exist in Corvin-ADR
          if [ -z "$ADR_REFS" ]; then
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
          MISSING=""
          for ref in $ADR_REFS; do
            if ! ls .corvin-adr/decisions/ | grep -qE "^${ref}-|^${ref#ADR-}-"; then
              MISSING="$MISSING $ref"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Referenced ADRs not found in Corvin-ADR/decisions:$MISSING"
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "status=pass" >> $GITHUB_OUTPUT
          exit 0

      - name: Report results
        if: always()
        run: |
          STATUS="${{ steps.validate.outputs.status }}"
          CORE_CHANGES="${{ steps.detect.outputs.core_changes }}"
          ADR_REFS="${{ steps.detect.outputs.adr_refs }}"

          case "$STATUS" in
            pass)
              echo "✓ ADR-Sync Check: PASS (ADR dokumentiert oder kein Code geändert)"
              ;;
            pass_with_exception)
              echo "⚠ ADR-Sync Check: PASS (Ausnahme-Fall)"
              echo "  Commits enthalten: skip-adr-check | test-only | docs-only | refactor:"
              ;;
            fail)
              echo "✗ ADR-Sync Check: FAIL"
              echo ""
              echo "Geänderte Core-Module:"
              echo "$CORE_CHANGES" | sed 's/^/  • /'
              echo ""
              echo "Referenced ADRs:"
              if [ -z "$ADR_REFS" ]; then
                echo "  (none — add [ADR-NNNN] to the commit message, or an exception tag)"
              else
                echo "$ADR_REFS" | sed 's/^/  • /'
              fi
              exit 1
              ;;
          esac

      - name: Add PR comment (if fail)
        if: |
          failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
            ❌ **ADR-Sync Check Failed**

            Deine Code-Änderungen benötigen entsprechende ADR-Dokumentation.

            ### Aktion erforderlich:
            1. Erstelle eine ADR in \`Corvin-ADR/decisions/ADR-XXXX-<slug>.md\`
            2. Update die Felder: \`paths\`, \`commits\`, \`status\`
            3. Push die ADR zusammen mit dem Code

            ### Ausnahmen:
            - Test-only Änderungen: Ergänze \`test-only\` in der Commit-Message
            - Docs-only Änderungen: Ergänze \`docs-only\` in der Commit-Message
            - Reine Refactors: Beginne die Commit-Message mit \`refactor:\`

            → [ADR-Anforderungen](https://github.com/CorvinLabs/CorvinOS/blob/main/docs/claude-ref/adr-gate.md)
            → [ADR-Beispiele](https://github.com/CorvinLabs/Corvin-ADR/tree/main/decisions)
              `
            })
