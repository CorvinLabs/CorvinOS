name: Installation E2E Tests (All Platforms)

on:
  push:
    branches: [main, develop]
    paths:
      - install.sh
      - install.ps1
      - README.md
      - tests/e2e/**
      - tests/adversarial/**
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - README.md
      - tests/e2e/**
      - tests/adversarial/**

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 1-2: Fast local tests (syntax, checksums, version sync)
  # ─────────────────────────────────────────────────────────────────────────────
  tier-1-2:
    name: Tier-1/2 Tests (Fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tier-1/2 tests (syntax, checksums, versions)
        run: bash tests/e2e/test_installation_e2e.sh --fast
      - name: Adversarial Review (Security, Robustness, UX)
        run: bash tests/adversarial/test_installation_adversarial_simple.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 3-4: Docker-based E2E (Linux full install simulation)
  # ─────────────────────────────────────────────────────────────────────────────
  tier-3-4-linux:
    name: Tier-3/4 E2E (Linux Ubuntu 22.04)
    runs-on: ubuntu-latest
    needs: tier-1-2
    steps:
      - uses: actions/checkout@v4
      - name: Build test Docker image (syntax + structure)
        run: |
          docker build -f - -t corvinos-test:linux-latest . <<'EOF'
          FROM ubuntu:22.04
          RUN apt-get update && apt-get install -y curl ca-certificates && rm -rf /var/lib/apt/lists/*
          WORKDIR /test
          COPY install.sh .
          RUN bash -n install.sh
          RUN grep -q "claude\|SKIP_CLAUDE" install.sh
          RUN ! grep -i ollama install.sh
          EOF
      - name: Test image built successfully
        run: docker images | grep corvinos-test

  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 3-4: PowerShell validation (Windows-like environment)
  # ─────────────────────────────────────────────────────────────────────────────
  tier-3-4-windows:
    name: Tier-3/4 PowerShell (Windows-like)
    runs-on: ubuntu-latest
    needs: tier-1-2
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell (cross-platform)
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Validate install.ps1 structure
        run: |
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            if (-not (Test-Path -Path "./install.ps1" -PathType Leaf)) { throw "install.ps1 is missing" }
            if (-not (Select-String -Path "./install.ps1" -Pattern "#Requires -Version 5.1" -Quiet)) {
              throw "install.ps1 is missing the #Requires -Version 5.1 directive"
            }
            Write-Host "install.ps1 structure OK"
          '
      # Windows PowerShell 5.1 decodes a BOM-less script as ANSI (cp1252). The UTF-8
      # bytes of characters like U+2713 or U+2551 then decode to cp1252 smart quotes,
      # which PowerShell honours as string delimiters -- unbalancing every following
      # string and killing the script with a parse error before line 1 runs. Shipped
      # once already; ASCII-only is the fence.
      - name: Verify install.ps1 is ASCII-only
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' install.ps1; then
            echo "::error file=install.ps1::non-ASCII bytes found (see lines above)."
            echo "Windows PowerShell 5.1 reads a BOM-less script as cp1252, turning these"
            echo "bytes into smart quotes that act as string delimiters -> parse error."
            exit 1
          fi
          echo "install.ps1 is ASCII-only"
      - name: Verify install.ps1 parses (AST)
        run: |
          pwsh -NoProfile -Command '
            $errors = $null
            $path = (Resolve-Path "./install.ps1").Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object {
                Write-Host ("::error file=install.ps1,line={0}::{1}" -f $_.Extent.StartLineNumber, $_.Message)
              }
              throw "install.ps1 has $($errors.Count) parse error(s)"
            }
            Write-Host "install.ps1 parses cleanly"
          '
      - name: Verify no Ollama in install.ps1
        run: |
          ! grep -i "ollama\|hermes\|qwen3" install.ps1 || exit 1
          echo '✓ No Ollama found'
      - name: Verify Claude Code present
        run: |
          grep -q "claude\|Claude Code\|NoClaudeCode" install.ps1
          echo '✓ Claude Code integration present'

  # ─────────────────────────────────────────────────────────────────────────────
  # Final gate: All tests pass before merge
  # ─────────────────────────────────────────────────────────────────────────────
  final-gate:
    name: Final Gate (All Tests Pass)
    runs-on: ubuntu-latest
    needs: [tier-1-2, tier-3-4-linux, tier-3-4-windows]
    steps:
      - uses: actions/checkout@v4
      - name: All gates passed ✓
        run: echo "All installation tests passed. Ready for production."

  # ─────────────────────────────────────────────────────────────────────────────
  # Release readiness check (only on main)
  # ─────────────────────────────────────────────────────────────────────────────
  release-ready:
    name: Release Readiness Check
    runs-on: ubuntu-latest
    needs: final-gate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify version in pyproject.toml vs install.sh
        run: |
          VERSION_TOML=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          VERSION_INSTALL=$(grep 'CORVIN_MIN_VERSION=' install.sh | cut -d'"' -f2)
          if [ "$VERSION_TOML" = "$VERSION_INSTALL" ]; then
            echo "✓ Version sync: $VERSION_TOML"
          else
            echo "✗ Version mismatch: pyproject.toml=$VERSION_TOML install.sh=$VERSION_INSTALL"
            exit 1
          fi
      - name: Check git is clean (no uncommitted changes)
        run: git status --porcelain | grep -v "^ M " | grep -q . && exit 1 || true
      - name: ✓ Ready for v1.0.0 release
        run: echo "Installation system is production-ready for v1.0.0"
