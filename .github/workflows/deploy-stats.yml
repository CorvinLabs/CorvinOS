name: Deploy Stats Dashboard to corvin-labs.com

on:
  push:
    branches: [main]
    paths:
      - 'docs/stats.html'
      - 'core/learning/instance_registry.py'
      - 'core/console/corvin_console/routes/vibe_metrics_api.py'
      - '.github/workflows/deploy-stats.yml'
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Fetch cluster stats
        id: stats
        run: |
          python scripts/fetch_cluster_stats.py > /tmp/stats.json
          cat /tmp/stats.json

      - name: Inject stats into HTML
        run: |
          python scripts/inject_stats_data.py \
            --input docs/stats.html \
            --data /tmp/stats.json \
            --output /tmp/stats-final.html
          cp /tmp/stats-final.html docs/stats.html

      - name: Build Docker image
        run: |
          docker build -t corvinlabs/stats:latest -t corvinlabs/stats:${{ github.sha }} \
            -f deploy/Dockerfile.stats .

      - name: Push to Docker registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push corvinlabs/stats:latest
          docker push corvinlabs/stats:${{ github.sha }}

      - name: Deploy to Kubernetes (production)
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl set image deployment/stats-dashboard \
            stats=corvinlabs/stats:${{ github.sha }} \
            --record \
            -n production
          kubectl rollout status deployment/stats-dashboard -n production

      - name: Health check
        run: |
          sleep 10
          curl -f https://corvin-labs.com/stats || exit 1
          echo "✅ Stats dashboard is live at https://corvin-labs.com/stats"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: |
            {
              "text": "Stats Dashboard Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ job.status == 'success' && '✅ Deployed' || '❌ Failed' }}* to corvin-labs.com/stats\n\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }

      - name: Create deployment record
        if: success()
        run: |
          curl -X POST https://api.github.com/repos/${{ github.repository }}/deployments \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
              "ref": "${{ github.sha }}",
              "environment": "production",
              "description": "Stats dashboard deployment",
              "auto_merge": false,
              "required_contexts": []
            }'
