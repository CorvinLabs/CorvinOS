version: '3.8'

services:
  # Stats Dashboard (Nginx)
  stats-dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.stats
    container_name: corvinos-stats
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_ENDPOINT=http://api:8000/api/metrics
      - REFRESH_INTERVAL=5000
    volumes:
      - ./docs/stats.html:/usr/share/nginx/html/stats/index.html:ro
      - ./deploy/nginx-stats.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro  # SSL certs mount point
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - corvinos

  # Mock API (for testing, returns fake stats)
  api:
    image: python:3.11-slim
    container_name: corvinos-api-mock
    working_dir: /app
    command: python mock_api.py
    volumes:
      - ./scripts/mock_api.py:/app/mock_api.py:ro
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - corvinos

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: corvinos-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - corvinos

networks:
  corvinos:
    driver: bridge

volumes:
  prometheus_data:
