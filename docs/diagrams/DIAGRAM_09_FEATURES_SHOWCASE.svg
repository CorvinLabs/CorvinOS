<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0f0f0f; }
      .title { font-size: 40px; font-weight: bold; fill: #00d4ff; font-family: monospace; }
      .subtitle { font-size: 16px; fill: #888; font-family: monospace; }
      .feature-box { fill: #1a1a2e; stroke: #00ff88; stroke-width: 3; }
      .feature-title { font-size: 22px; font-weight: bold; fill: #00ff88; font-family: monospace; }
      .feature-desc { font-size: 16px; fill: #a8dadc; font-family: monospace; }
      .icon { font-size: 50px; }
      .benefit { font-size: 14px; fill: #888; font-family: monospace; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <text x="700" y="50" class="title" text-anchor="middle">CorvinOS: Core Features</text>

  <!-- ROW 1 -->
  <rect class="feature-box" x="50" y="120" width="300" height="180"/>
  <text x="200" y="190" class="feature-title" text-anchor="middle">Skills 2.0</text>

  <rect class="feature-box" x="400" y="120" width="300" height="180"/>
  <text x="550" y="190" class="feature-title" text-anchor="middle">Self-Learning</text>

  <rect class="feature-box" x="750" y="120" width="300" height="180"/>
  <text x="900" y="190" class="feature-title" text-anchor="middle">Complete Audit</text>

  <rect class="feature-box" x="1100" y="120" width="250" height="180"/>
  <text x="1225" y="190" class="feature-title" text-anchor="middle">Multi-Engine</text>

  <!-- ROW 2 -->
  <rect class="feature-box" x="50" y="370" width="300" height="170"/>
  <text x="200" y="433" class="feature-title" text-anchor="middle">Hybrid Context</text>

  <rect class="feature-box" x="400" y="370" width="300" height="170"/>
  <text x="550" y="433" class="feature-title" text-anchor="middle">Plugins</text>

  <rect class="feature-box" x="750" y="370" width="300" height="170"/>
  <text x="900" y="433" class="feature-title" text-anchor="middle">Live Dashboard</text>

  <rect class="feature-box" x="1100" y="370" width="250" height="170"/>
  <text x="1225" y="433" class="feature-title" text-anchor="middle">Compliance</text>

  <!-- KEY INSIGHT -->
  <text x="700" y="620" class="feature-title" text-anchor="middle">No hardcoded behavior • No buried feature flags</text>

</svg>
