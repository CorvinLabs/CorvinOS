<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0a0e27; }
      .title { font-size: 44px; font-weight: bold; fill: #00d4ff; font-family: monospace; letter-spacing: 1px; }
      .feature-box { fill: #1a2847; stroke: #00ff88; stroke-width: 2.5; rx: 8; }
      .feature-title { font-size: 24px; font-weight: bold; fill: #00ff88; font-family: monospace; }
      .icon { font-size: 56px; }
      .divider { stroke: #333; stroke-width: 1; }
    </style>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect class="bg" width="1400" height="950"/>
  <rect x="0" y="0" width="1400" height="950" fill="url(#grad)"/>

  <text x="700" y="60" class="title" text-anchor="middle">CorvinOS: Core Features</text>
  <line class="divider" x1="200" y1="80" x2="1200" y2="80"/>

  <!-- ROW 1 -->
  <g>
    <rect class="feature-box" x="40" y="120" width="310" height="200" rx="8"/>
    <text x="195" y="170" class="icon" text-anchor="middle">🎯</text>
    <text x="195" y="220" class="feature-title" text-anchor="middle">Skills 2.0</text>
  </g>

  <g>
    <rect class="feature-box" x="380" y="120" width="310" height="200" rx="8"/>
    <text x="535" y="170" class="icon" text-anchor="middle">🧠</text>
    <text x="535" y="220" class="feature-title" text-anchor="middle">Self-Learning</text>
  </g>

  <g>
    <rect class="feature-box" x="720" y="120" width="310" height="200" rx="8"/>
    <text x="875" y="170" class="icon" text-anchor="middle">🔐</text>
    <text x="875" y="220" class="feature-title" text-anchor="middle">Complete Audit</text>
  </g>

  <g>
    <rect class="feature-box" x="1050" y="120" width="310" height="200" rx="8"/>
    <text x="1205" y="170" class="icon" text-anchor="middle">⚙️</text>
    <text x="1205" y="220" class="feature-title" text-anchor="middle">Multi-Engine</text>
  </g>

  <!-- ROW 2 -->
  <g>
    <rect class="feature-box" x="40" y="390" width="310" height="200" rx="8"/>
    <text x="195" y="440" class="icon" text-anchor="middle">🧩</text>
    <text x="195" y="490" class="feature-title" text-anchor="middle">Hybrid Context</text>
  </g>

  <g>
    <rect class="feature-box" x="380" y="390" width="310" height="200" rx="8"/>
    <text x="535" y="440" class="icon" text-anchor="middle">🔌</text>
    <text x="535" y="490" class="feature-title" text-anchor="middle">Plugins</text>
  </g>

  <g>
    <rect class="feature-box" x="720" y="390" width="310" height="200" rx="8"/>
    <text x="875" y="440" class="icon" text-anchor="middle">📊</text>
    <text x="875" y="490" class="feature-title" text-anchor="middle">Live Dashboard</text>
  </g>

  <g>
    <rect class="feature-box" x="1050" y="390" width="310" height="200" rx="8"/>
    <text x="1205" y="440" class="icon" text-anchor="middle">⚖️</text>
    <text x="1205" y="490" class="feature-title" text-anchor="middle">Compliance</text>
  </g>

  <!-- BOTTOM MESSAGE -->
  <line class="divider" x1="200" y1="650" x2="1200" y2="650"/>
  <text x="700" y="720" class="feature-title" text-anchor="middle">No hardcoded behavior • No buried feature flags</text>
  <text x="700" y="760" style="font-size: 18px; fill: #a8dadc; font-family: monospace; text-anchor: middle;">Every decision is versioned, learnable, and provable</text>

</svg>
