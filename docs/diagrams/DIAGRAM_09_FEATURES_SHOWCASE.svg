  <text x="770" y="330" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" opacity="0.7">FEATURE</text>
  <text x="770" y="352" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Live Dashboard</text>
  <text x="770" y="375" text-anchor="middle" fill="#ddd" font-size="11">See & tune</text>
  <text x="770" y="405" text-anchor="middle" fill="#fff" font-size="11" opacity="0.8">📊</text>

