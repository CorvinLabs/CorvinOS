  <text x="600" y="590" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">No hardcoded behavior • No buried feature flags</text>
  <text x="600" y="620" text-anchor="middle" fill="#999" font-size="12">Every decision is versioned, learnable, and provable</text>

