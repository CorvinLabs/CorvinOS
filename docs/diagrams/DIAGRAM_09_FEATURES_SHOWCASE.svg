  <text x="1035" y="330" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" opacity="0.7">FEATURE</text>
  <text x="1035" y="352" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Compliance</text>
