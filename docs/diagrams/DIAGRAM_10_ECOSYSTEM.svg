<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0a0e27; }
      .title { font-size: 44px; font-weight: bold; fill: #00d4ff; font-family: 'Segoe UI', monospace; letter-spacing: 1px; }
      .layer-title { font-size: 26px; font-weight: bold; fill: #ffd700; font-family: monospace; }
      .box { fill: #1a2847; stroke: #00ff88; stroke-width: 2.5; rx: 8; }
      .core-box { fill: #0d1929; stroke: #00d4ff; stroke-width: 3; rx: 8; }
      .big-label { font-size: 20px; font-weight: bold; fill: #00ff88; font-family: monospace; }
      .medium-label { font-size: 16px; fill: #a8dadc; font-family: monospace; }
      .divider { stroke: #333; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1100"/>

  <!-- GRADIENT ACCENT -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1400" height="1100" fill="url(#grad)"/>

  <!-- TITLE -->
  <text x="700" y="60" class="title" text-anchor="middle">CorvinOS Architecture</text>
  <line class="divider" x1="200" y1="80" x2="1200" y2="80"/>

  <!-- INPUT INTERFACES -->
  <text x="700" y="130" class="layer-title" text-anchor="middle">📥 Input Channels</text>

  <g>
    <rect class="box" x="120" y="160" width="240" height="90" rx="6"/>
    <text x="240" y="195" class="big-label" text-anchor="middle">🖥️ CLI</text>
    <text x="240" y="220" class="medium-label" text-anchor="middle">Commands</text>
  </g>

  <g>
    <rect class="box" x="410" y="160" width="240" height="90" rx="6"/>
    <text x="530" y="195" class="big-label" text-anchor="middle">🌐 Web</text>
    <text x="530" y="220" class="medium-label" text-anchor="middle">Dashboard</text>
  </g>

  <g>
    <rect class="box" x="700" y="160" width="240" height="90" rx="6"/>
    <text x="820" y="195" class="big-label" text-anchor="middle">🎤 Voice</text>
    <text x="820" y="220" class="medium-label" text-anchor="middle">Discord</text>
  </g>

  <g>
    <rect class="box" x="990" y="160" width="240" height="90" rx="6"/>
    <text x="1110" y="195" class="big-label" text-anchor="middle">🔗 A2A</text>
    <text x="1110" y="220" class="medium-label" text-anchor="middle">App-to-App</text>
  </g>

  <!-- FLOW ARROWS -->
  <path d="M 240 250 L 240 310" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 530 250 L 530 310" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 820 250 L 820 310" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1110 250 L 1110 310" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ACP SKILLS LAYER -->
  <text x="700" y="350" class="layer-title" text-anchor="middle">🧠 Agentic Control Plane (ACP)</text>

  <g>
    <rect class="core-box" x="100" y="380" width="320" height="110" rx="8"/>
    <text x="260" y="415" class="big-label" text-anchor="middle">L5: Routing</text>
    <text x="260" y="445" class="medium-label" text-anchor="middle">Pick best engine</text>
  </g>

  <g>
    <rect class="core-box" x="540" y="380" width="320" height="110" rx="8"/>
    <text x="700" y="415" class="big-label" text-anchor="middle">L10: Context</text>
    <text x="700" y="445" class="medium-label" text-anchor="middle">Preserve facts</text>
  </g>

  <g>
    <rect class="core-box" x="980" y="380" width="320" height="110" rx="8"/>
    <text x="1140" y="415" class="big-label" text-anchor="middle">L22: Workflow</text>
    <text x="1140" y="445" class="medium-label" text-anchor="middle">Execute DAG</text>
  </g>

  <!-- FLOW ARROWS -->
  <path d="M 260 490 L 260 550" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 700 490 L 700 550" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1140 490 L 1140 550" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- LEARNING LAYER -->
  <text x="700" y="600" class="layer-title" text-anchor="middle">📊 Learning Loop</text>

  <rect class="box" x="150" y="630" width="1100" height="90" rx="8"/>
  <text x="700" y="665" class="big-label" text-anchor="middle">9D Loss Vector: Automatic Self-Optimization</text>
  <text x="700" y="690" class="medium-label" text-anchor="middle">6 Core + 3 Infrastructure + 1 Meta Loop</text>

  <!-- FLOW ARROWS -->
  <path d="M 700 720 L 700 770" stroke="#00d4ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- COMPLIANCE LAYER -->
  <text x="700" y="820" class="layer-title" text-anchor="middle">🔐 Compliance & Audit</text>

  <g>
    <rect class="box" x="120" y="850" width="280" height="100" rx="6"/>
    <text x="260" y="885" class="big-label" text-anchor="middle">Audit Trail</text>
    <text x="260" y="910" class="medium-label" text-anchor="middle">Hash-chained</text>
  </g>

  <g>
    <rect class="box" x="520" y="850" width="280" height="100" rx="6"/>
    <text x="660" y="885" class="big-label" text-anchor="middle">Consent Gate</text>
    <text x="660" y="910" class="medium-label" text-anchor="middle">Deny-by-default</text>
  </g>

  <g>
    <rect class="box" x="920" y="850" width="280" height="100" rx="6"/>
    <text x="1060" y="885" class="big-label" text-anchor="middle">Plugins</text>
    <text x="1060" y="910" class="medium-label" text-anchor="middle">5 trust tiers</text>
  </g>

  <!-- ARROW MARKER -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00d4ff" />
    </marker>
  </defs>

</svg>
