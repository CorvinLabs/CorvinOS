<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0f0f0f; }
      .title { font-size: 40px; font-weight: bold; fill: #00d4ff; font-family: monospace; }
      .subtitle { font-size: 16px; fill: #888; font-family: monospace; }
      .layer-title { font-size: 24px; font-weight: bold; fill: #ffd700; font-family: monospace; }
      .box { fill: #1a1a2e; stroke: #00ff88; stroke-width: 3; }
      .core-box { fill: #16213e; stroke: #00d4ff; stroke-width: 3; }
      .big-label { font-size: 20px; font-weight: bold; fill: #00ff88; font-family: monospace; }
      .medium-label { font-size: 18px; fill: #a8dadc; font-family: monospace; }
      .small-text { font-size: 14px; fill: #888; font-family: monospace; }
      .arrow { stroke: #00d4ff; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00d4ff" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1000"/>

  <text x="700" y="50" class="title" text-anchor="middle">CorvinOS Architecture</text>

  <!-- INPUT LAYER -->
  <rect class="box" x="200" y="150" width="200" height="80"/>
  <text x="300" y="175" class="big-label" text-anchor="middle">CLI</text>

  <rect class="box" x="450" y="150" width="200" height="80"/>
  <text x="550" y="175" class="big-label" text-anchor="middle">Web</text>

  <rect class="box" x="700" y="150" width="200" height="80"/>
  <text x="800" y="175" class="big-label" text-anchor="middle">Voice</text>

  <rect class="box" x="950" y="150" width="200" height="80"/>
  <text x="1050" y="175" class="big-label" text-anchor="middle">A2A</text>

  <!-- ARROWS DOWN -->
  <path class="arrow" d="M 300 230 L 300 280"/>
  <path class="arrow" d="M 550 230 L 550 280"/>
  <path class="arrow" d="M 800 230 L 800 280"/>
  <path class="arrow" d="M 1050 230 L 1050 280"/>

  <!-- CORE LAYER: ACP SKILLS -->

  <rect class="core-box" x="150" y="340" width="280" height="100"/>
  <text x="290" y="370" class="big-label" text-anchor="middle">L5: Routing</text>
  <text x="290" y="395" class="medium-label" text-anchor="middle">Pick best engine</text>

  <rect class="core-box" x="560" y="340" width="280" height="100"/>
  <text x="700" y="370" class="big-label" text-anchor="middle">L10: Context</text>
  <text x="700" y="395" class="medium-label" text-anchor="middle">Preserve important facts</text>

  <rect class="core-box" x="970" y="340" width="280" height="100"/>
  <text x="1110" y="370" class="big-label" text-anchor="middle">L22: Workflow</text>
  <text x="1110" y="395" class="medium-label" text-anchor="middle">Orchestrate Skills</text>

  <!-- ARROWS DOWN -->
  <path class="arrow" d="M 290 440 L 290 500"/>
  <path class="arrow" d="M 700 440 L 700 500"/>
  <path class="arrow" d="M 1110 440 L 1110 500"/>

  <!-- LEARNING LAYER -->

  <rect class="box" x="200" y="570" width="1000" height="120"/>
  <text x="700" y="600" class="big-label" text-anchor="middle">Self-Optimization</text>
  <text x="700" y="625" class="medium-label" text-anchor="middle">6 Core Loops + 3 Infrastructure Loops + 1 Meta Loop</text>

  <!-- ARROWS DOWN -->
  <path class="arrow" d="M 700 690 L 700 740"/>

  <!-- COMPLIANCE LAYER -->

  <rect class="box" x="150" y="800" width="280" height="100"/>
  <text x="290" y="830" class="big-label" text-anchor="middle">Audit Trail</text>
  <text x="290" y="855" class="medium-label" text-anchor="middle">Hash-chained</text>

  <rect class="box" x="560" y="800" width="280" height="100"/>
  <text x="700" y="830" class="big-label" text-anchor="middle">Consent Gate</text>
  <text x="700" y="855" class="medium-label" text-anchor="middle">Deny-by-default</text>

  <rect class="box" x="970" y="800" width="280" height="100"/>
  <text x="1110" y="830" class="big-label" text-anchor="middle">Plugins</text>
  <text x="1110" y="855" class="medium-label" text-anchor="middle">5 trust tiers</text>

</svg>
