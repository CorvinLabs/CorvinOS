  <text x="700" y="680" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">✓ All events logged, hash-chained, auditable</text>
  <text x="700" y="705" text-anchor="middle" fill="#ddd" font-size="11">Every step emits audit event • Tenant-scoped • GDPR compliant</text>
  <text x="700" y="730" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Operator can prove complete execution chain</text>
