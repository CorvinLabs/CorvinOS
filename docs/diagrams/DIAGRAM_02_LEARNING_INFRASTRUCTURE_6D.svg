<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0f0f0f; }
      .title { font-size: 26px; font-weight: bold; fill: #ff006e; font-family: monospace; }
      .subtitle { font-size: 22px; font-weight: bold; fill: #00d4ff; font-family: monospace; }
      .label { font-size: 17px; fill: #a8dadc; font-family: monospace; }
      .desc { font-size: 15px; fill: #888; font-family: monospace; }
      .loop-box { fill: #16213e; stroke: #ff006e; stroke-width: 2; }
      .metric-box { fill: #1a1a2e; stroke: #00d4ff; stroke-width: 1.5; }
      .arrow-dark { stroke: #666; stroke-width: 1.5; fill: none; }
      .arrow-bold { stroke: #ff006e; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-bold); }
      .number { font-size: 20px; font-weight: bold; fill: #ff006e; font-family: monospace; }
    </style>
    <marker id="arrowhead-bold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff006e" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <!-- Title -->
  <text x="700" y="40" class="title" text-anchor="middle">Learning Infrastructure: 6D Loss Vector (ADR-0614/0615/0616)</text>
  <text x="700" y="65" class="desc" text-anchor="middle">Unified learning loops with 6 independent dimensions coupled via backpropagation</text>

  <!-- SECTION 1: The Six Dimensions (top row) -->
  <text x="50" y="110" class="subtitle">6D LOSS VECTOR COMPONENTS:</text>

  <g id="dim1">
    <rect class="loop-box" x="60" y="130" width="180" height="80"/>
    <text x="150" y="148" class="number" text-anchor="middle">① Routing</text>
    <text x="150" y="165" class="label" text-anchor="middle">Correct Agent Selected?</text>
    <text x="150" y="178" class="desc" text-anchor="middle">L_route ∈ [0,1]</text>
    <text x="150" y="191" class="desc" text-anchor="middle">Source: Feedback</text>
  </g>

  <g id="dim2">
    <rect class="loop-box" x="270" y="130" width="180" height="80"/>
    <text x="360" y="148" class="number" text-anchor="middle">② Context</text>
    <text x="360" y="165" class="label" text-anchor="middle">Context Quality?</text>
    <text x="360" y="178" class="desc" text-anchor="middle">L_context ∈ [0,1]</text>
    <text x="360" y="191" class="desc" text-anchor="middle">Source: Accuracy</text>
  </g>

  <g id="dim3">
    <rect class="loop-box" x="480" y="130" width="180" height="80"/>
    <text x="570" y="148" class="number" text-anchor="middle">③ Execution</text>
    <text x="570" y="165" class="label" text-anchor="middle">Latency OK? SLA?</text>
    <text x="570" y="178" class="desc" text-anchor="middle">L_exec ∈ [0,1]</text>
    <text x="570" y="191" class="desc" text-anchor="middle">Source: Metrics</text>
  </g>

  <g id="dim4">
    <rect class="loop-box" x="690" y="130" width="180" height="80"/>
    <text x="780" y="148" class="number" text-anchor="middle">④ Confidence</text>
    <text x="780" y="165" class="label" text-anchor="middle">P(correct | input)?</text>
    <text x="780" y="178" class="desc" text-anchor="middle">L_conf ∈ [0,1]</text>
    <text x="780" y="191" class="desc" text-anchor="middle">Source: Skill Score</text>
  </g>

  <g id="dim5">
    <rect class="loop-box" x="900" y="130" width="180" height="80"/>
    <text x="990" y="148" class="number" text-anchor="middle">⑤ Compliance</text>
    <text x="990" y="165" class="label" text-anchor="middle">PII Leakage? Consent?</text>
    <text x="990" y="178" class="desc" text-anchor="middle">L_comply ∈ [0,1]</text>
    <text x="990" y="191" class="desc" text-anchor="middle">Source: Audit Scan</text>
  </g>

  <g id="dim6">
    <rect class="loop-box" x="1110" y="130" width="180" height="80"/>
    <text x="1200" y="148" class="number" text-anchor="middle">⑥ Learning</text>
    <text x="1200" y="165" class="label" text-anchor="middle">Config Convergence?</text>
    <text x="1200" y="178" class="desc" text-anchor="middle">L_learn ∈ [0,1]</text>
    <text x="1200" y="191" class="desc" text-anchor="middle">Source: Optimizer</text>
  </g>

  <!-- SECTION 2: Unified Loss Function -->
  <text x="50" y="250" class="subtitle">UNIFIED LOSS (Weighted Combination):</text>
  <rect class="metric-box" x="60" y="265" width="1310" height="80"/>
  <text x="715" y="285" class="label" text-anchor="middle">L_total = w₁·L_route + w₂·L_context + w₃·L_exec + w₄·L_conf + w₅·L_comply + w₆·L_learn</text>
  <text x="715" y="305" class="desc" text-anchor="middle">Weights ∈ [0,1], Σwᵢ = 1.0 | Gradient backprop to optimizer | Pareto frontier discovery</text>
  <text x="715" y="325" class="desc" text-anchor="middle">Converges in &lt;2000 samples | Audit-first: every L_i calculation → audit event</text>

  <!-- SECTION 3: Causal Coupling -->
  <text x="50" y="385" class="subtitle">CAUSAL COUPLING (Why unified loss matters):</text>

  <g id="coupling">
    <!-- Routing fails → Context degrades -->
    <path class="arrow-bold" d="M 150 240 L 250 260"/>
    <text x="190" y="245" class="desc" fill="#ff006e">→ Wrong agent selected</text>

    <!-- Context bad → Execution fails -->
    <path class="arrow-bold" d="M 360 240 L 460 260"/>
    <text x="395" y="245" class="desc" fill="#ff006e">→ Missing context info</text>

    <!-- Execution slow → User feedback negative -->
    <path class="arrow-bold" d="M 570 240 L 670 260"/>
    <text x="600" y="245" class="desc" fill="#ff006e">→ SLA miss</text>

    <!-- Low confidence → Learning fails -->
    <path class="arrow-bold" d="M 780 240 L 880 260"/>
    <text x="805" y="245" class="desc" fill="#ff006e">→ Optimizer diverges</text>

    <!-- Compliance error → Audit fail -->
    <path class="arrow-bold" d="M 990 240 L 1090 260"/>
    <text x="1025" y="245" class="desc" fill="#ff006e">→ Chain breaks</text>

    <!-- Learning diverge → cycle repeats -->
    <path class="arrow-bold" d="M 1200 240 Q 1250 180 1250 130" stroke-dasharray="5,5"/>
    <text x="1260" y="180" class="desc" fill="#ff006e">→ Retry learning</text>
  </g>

  <!-- SECTION 4: Six Independent Loops (detailed) -->
  <text x="50" y="380" class="subtitle">SIX INDEPENDENT FEEDBACK LOOPS:</text>

  <!-- Row 1: Loops 1-3 -->
  <g id="loops-top">
    <!-- Loop 1: Routing -->
    <rect class="loop-box" x="60" y="410" width="280" height="120"/>
    <text x="200" y="430" class="label" text-anchor="middle">LOOP 1: Routing Feedback</text>
    <text x="200" y="450" class="desc" text-anchor="middle">Input: Task</text>
    <text x="200" y="465" class="desc" text-anchor="middle">Decision: os.delegation_router</text>
    <text x="200" y="480" class="desc" text-anchor="middle">Feedback: "Was routing correct?"</text>
    <text x="200" y="495" class="desc" text-anchor="middle">Output: Updated router config</text>
    <text x="200" y="510" class="desc" text-anchor="middle">Audit: routing_feedback event</text>

    <!-- Loop 2: Context -->
    <rect class="loop-box" x="370" y="410" width="280" height="120"/>
    <text x="510" y="430" class="label" text-anchor="middle">LOOP 2: Context Quality</text>
    <text x="510" y="450" class="desc" text-anchor="middle">Input: Task + Router decision</text>
    <text x="510" y="465" class="desc" text-anchor="middle">Decision: os.context_adapter</text>
    <text x="510" y="480" class="desc" text-anchor="middle">Feedback: "Context helpful?"</text>
    <text x="510" y="495" class="desc" text-anchor="middle">Output: Preservation weights</text>
    <text x="510" y="510" class="desc" text-anchor="middle">Audit: context_feedback event</text>

    <!-- Loop 3: Execution -->
    <rect class="loop-box" x="680" y="410" width="280" height="120"/>
    <text x="820" y="430" class="label" text-anchor="middle">LOOP 3: Execution Performance</text>
    <text x="820" y="450" class="desc" text-anchor="middle">Input: Context + Agent</text>
    <text x="820" y="465" class="desc" text-anchor="middle">Decision: Skill choice (L22)</text>
    <text x="820" y="480" class="desc" text-anchor="middle">Feedback: Latency, SLA, errors</text>
    <text x="820" y="495" class="desc" text-anchor="middle">Output: Skill retry strategy</text>
    <text x="820" y="510" class="desc" text-anchor="middle">Audit: execution_metric event</text>

    <!-- Loop 4: Confidence -->
    <rect class="loop-box" x="990" y="410" width="280" height="120"/>
    <text x="1130" y="430" class="label" text-anchor="middle">LOOP 4: Confidence Scoring</text>
    <text x="1130" y="450" class="desc" text-anchor="middle">Input: All intermediate decisions</text>
    <text x="1130" y="465" class="desc" text-anchor="middle">Decision: Skill.execute() → score</text>
    <text x="1130" y="480" class="desc" text-anchor="middle">Feedback: Outcome verification</text>
    <text x="1130" y="495" class="desc" text-anchor="middle">Output: Confidence delta (±ΔC)</text>
    <text x="1130" y="510" class="desc" text-anchor="middle">Audit: confidence_updated event</text>
  </g>

  <!-- Row 2: Loops 5-6 -->
  <g id="loops-bottom">
    <!-- Loop 5: Compliance -->
    <rect class="loop-box" x="60" y="560" width="280" height="120"/>
    <text x="200" y="580" class="label" text-anchor="middle">LOOP 5: Compliance Scanning</text>
    <text x="200" y="600" class="desc" text-anchor="middle">Input: All outputs (audit trail)</text>
    <text x="200" y="615" class="desc" text-anchor="middle">Decision: Scan for PII/consent</text>
    <text x="200" y="630" class="desc" text-anchor="middle">Feedback: Violations found?</text>
    <text x="200" y="645" class="desc" text-anchor="middle">Output: Policy violations (fail-closed)</text>
    <text x="200" y="660" class="desc" text-anchor="middle">Audit: compliance_scan event</text>

    <!-- Loop 6: Learning Optimizer -->
    <rect class="loop-box" x="370" y="560" width="280" height="120"/>
    <text x="510" y="580" class="label" text-anchor="middle">LOOP 6: Learning Optimizer</text>
    <text x="510" y="600" class="desc" text-anchor="middle">Input: All 5 feedback signals</text>
    <text x="510" y="615" class="desc" text-anchor="middle">Decision: Gradient descent (SGD)</text>
    <text x="510" y="630" class="desc" text-anchor="middle">Feedback: Convergence check</text>
    <text x="510" y="645" class="desc" text-anchor="middle">Output: Updated weights (w₁..w₆)</text>
    <text x="510" y="660" class="desc" text-anchor="middle">Audit: optimizer_step event</text>

    <!-- Backprop Protocol -->
    <rect class="metric-box" x="680" y="560" width="590" height="120"/>
    <text x="975" y="580" class="label" text-anchor="middle">BACKPROPAGATION PROTOCOL (Loop Coupling)</text>
    <text x="975" y="600" class="desc" text-anchor="middle">Gradients flow BACKWARDS through decision DAG:</text>
    <text x="975" y="615" class="desc" text-anchor="middle">L6(optimizer) → ΔL5 (compliance) → ΔL4 (confidence) → ΔL3 (exec)</text>
    <text x="975" y="630" class="desc" text-anchor="middle">→ ΔL2 (context) → ΔL1 (routing)</text>
    <text x="975" y="645" class="desc" text-anchor="middle">Divergence detection: if |ΔL| > threshold for 5 steps → pause + alert</text>
    <text x="975" y="660" class="desc" text-anchor="middle">DAG validated at boot (topological sort, no cycles)</text>
  </g>

  <!-- SECTION 5: Console Dashboard Integration -->
  <text x="50" y="730" class="subtitle">CONSOLE DASHBOARD (Real-time Observability):</text>
  <rect class="metric-box" x="60" y="750" width="1310" height="120"/>

  <rect class="loop-box" x="80" y="765" width="150" height="90"/>
  <text x="155" y="780" class="label" text-anchor="middle">Loss Trends</text>
  <text x="155" y="800" class="desc" text-anchor="middle">Graph: 6D</text>
  <text x="155" y="815" class="desc" text-anchor="middle">over time</text>
  <text x="155" y="830" class="desc" text-anchor="middle">(24h view)</text>

  <rect class="loop-box" x="260" y="765" width="150" height="90"/>
  <text x="335" y="780" class="label" text-anchor="middle">Weight Vector</text>
  <text x="335" y="800" class="desc" text-anchor="middle">Sliders: w₁..w₆</text>
  <text x="335" y="815" class="desc" text-anchor="middle">(operator tuning)</text>
  <text x="335" y="830" class="desc" text-anchor="middle">normalized</text>

  <rect class="loop-box" x="440" y="765" width="150" height="90"/>
  <text x="515" y="780" class="label" text-anchor="middle">Pareto Frontier</text>
  <text x="515" y="800" class="desc" text-anchor="middle">2D/3D plot</text>
  <text x="515" y="815" class="desc" text-anchor="middle">Trade-off space</text>
  <text x="515" y="830" class="desc" text-anchor="middle">(cost vs quality)</text>

  <rect class="loop-box" x="620" y="765" width="150" height="90"/>
  <text x="695" y="780" class="label" text-anchor="middle">Convergence</text>
  <text x="695" y="800" class="desc" text-anchor="middle">Samples to</text>
  <text x="695" y="815" class="desc" text-anchor="middle">convergence</text>
  <text x="695" y="830" class="desc" text-anchor="middle">(&lt;2000 = ✅)</text>

  <rect class="loop-box" x="800" y="765" width="150" height="90"/>
  <text x="875" y="780" class="label" text-anchor="middle">Loop Health</text>
  <text x="875" y="800" class="desc" text-anchor="middle">Feedback rate</text>
  <text x="875" y="815" class="desc" text-anchor="middle">Divergence flag</text>
  <text x="875" y="830" class="desc" text-anchor="middle">Last update</text>

  <rect class="loop-box" x="980" y="765" width="150" height="90"/>
  <text x="1055" y="780" class="label" text-anchor="middle">Audit Trail</text>
  <text x="1055" y="800" class="desc" text-anchor="middle">Hash-chain</text>
  <text x="1055" y="815" class="desc" text-anchor="middle">events (all 6</text>
  <text x="1055" y="830" class="desc" text-anchor="middle">loops logged)</text>

  <rect class="loop-box" x="1160" y="765" width="200" height="90"/>
  <text x="1260" y="780" class="label" text-anchor="middle">Export / Report</text>
  <text x="1260" y="800" class="desc" text-anchor="middle">Download: CSV,</text>
  <text x="1260" y="815" class="desc" text-anchor="middle">PDF, JSON</text>
  <text x="1260" y="830" class="desc" text-anchor="middle">(30-day run)</text>

  <!-- Footer -->
  <text x="50" y="880" class="desc">ADR-0614 (Loss Vector), ADR-0615 (DAG + Backprop), ADR-0616 (Weight Discovery)</text>
  <text x="50" y="895" class="desc">All events audit-logged (hash-chained). Operator proof system: "show me the evidence" query returns full trace.</text>
</svg>
