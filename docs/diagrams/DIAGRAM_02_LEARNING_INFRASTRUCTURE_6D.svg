<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d2550"/>
      <stop offset="100%" style="stop-color:#1a1a6e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3e7e"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#f39c12"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#3498db"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="700" fill="#0f0f1e"/>
  <text x="700" y="50" text-anchor="middle" fill="#e0e0e0" font-size="28" font-weight="bold">6D Learning Loops</text>
  <line x1="100" y1="70" x2="1300" y2="70" stroke="#333" stroke-width="1"/>

  <rect x="80" y="110" width="250" height="100" rx="8" fill="url(#g1)"/>
  <text x="205" y="135" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Routing Loop</text>
  <text x="205" y="155" text-anchor="middle" fill="#ddd" font-size="11">Pick best engine?</text>
  <text x="205" y="190" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">α=10%</text>

  <rect x="360" y="110" width="250" height="100" rx="8" fill="url(#g2)"/>
  <text x="485" y="135" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Context Loop</text>
  <text x="485" y="155" text-anchor="middle" fill="#ddd" font-size="11">Save important facts?</text>
  <text x="485" y="190" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">α=10%</text>

  <rect x="640" y="110" width="250" height="100" rx="8" fill="url(#g3)"/>
  <text x="765" y="135" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Execution Loop</text>
  <text x="765" y="155" text-anchor="middle" fill="#ddd" font-size="11">Fast enough?</text>
  <text x="765" y="190" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">α=10%</text>

  <rect x="920" y="110" width="250" height="100" rx="8" fill="url(#g4)"/>
  <text x="1045" y="135" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Confidence Loop</text>
  <text x="1045" y="155" text-anchor="middle" fill="#ddd" font-size="11">Am I right?</text>
  <text x="1045" y="190" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">α=10%</text>

  <rect x="1200" y="110" width="120" height="100" rx="8" fill="url(#g5)"/>
  <text x="1260" y="135" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Compliance</text>
  <text x="1260" y="190" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">α=10%</text>

  <rect x="200" y="280" width="1000" height="120" rx="8" fill="url(#g6)"/>
  <text x="700" y="315" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Meta Loop: Learns Optimal Weights</text>
  <text x="700" y="340" text-anchor="middle" fill="#ddd" font-size="12">α=1% • Converges all dimensions together</text>
  <text x="700" y="360" text-anchor="middle" fill="#fff" font-size="11" opacity="0.8">Damping prevents oscillation • Scales to N loops</text>
</svg>