<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Project import flow: upload, staging, validation V1-V6, report with conflicts, verdict, apply, git step, repair, audit</title>
  <desc>A project bundle is streamed into the tenant's staging, validated in six stages before anything is extracted, answered as a report with the default place and the conflicts; the console asks the verdict for the chosen id and place, and the apply re-validates, extracts into a sibling, renames once onto the target, rewrites project.yaml, imports the git history without clone or checkout, registers with a new uid and the class floor, repairs, runs kb check and clears the pending state. Audit points are marked.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6475"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9ced8;stroke-width:1.2}
      .srv{fill:#f6f2ea;stroke:#c8a66a;stroke-width:1.2}
      .gate{fill:#fff7e8;stroke:#d08a16;stroke-width:1.4}
      .bad{fill:#fdf0ee;stroke:#c0503a;stroke-width:1.2}
      .h{font-size:14px;font-weight:600;fill:#1d2330}
      .t{font-size:12px;fill:#3b4352}
      .m{font-size:11px;fill:#5b6475;font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
      .au{font-size:11px;fill:#8a4f00;font-weight:600}
      .lane{font-size:12px;font-weight:600;fill:#5b6475;letter-spacing:.06em}
      .e{stroke:#5b6475;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#5b6475;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="720" fill="#fbfaf7"/>

  <text x="24" y="32" class="lane">BROWSER (share-dialogs.tsx, share-logic.ts)</text>
  <rect x="24" y="44" width="220" height="70" rx="8" class="box"/>
  <text x="36" y="66" class="h">Choose a bundle file…</text>
  <text x="36" y="86" class="t">native file picker, .zip, ≤ 500 MB</text>
  <text x="36" y="104" class="m">multipart, one part "file"</text>

  <rect x="384" y="44" width="300" height="90" rx="8" class="box"/>
  <text x="396" y="66" class="h">Preview (Unverified origin)</text>
  <text x="396" y="86" class="t">card, Will create, Id here, Where + Change… (picker),</text>
  <text x="396" y="102" class="t">Protection floor, conflict rows with one fix each,</text>
  <text x="396" y="118" class="t">Skip git history / knowledge base</text>

  <rect x="740" y="44" width="236" height="90" rx="8" class="gate"/>
  <text x="752" y="66" class="h">Import button</text>
  <text x="752" y="86" class="t">on only when the verdict for the</text>
  <text x="752" y="102" class="t">CURRENT id and place lists no conflict</text>
  <text x="752" y="120" class="m">Cancel → DELETE staging</text>

  <text x="24" y="170" class="lane">CONSOLE SERVER (routes/projects.py → projects_service.py → core/projects/bundle.py)</text>

  <rect x="24" y="184" width="220" height="104" rx="8" class="srv"/>
  <text x="36" y="206" class="h">POST /-/import/validate</text>
  <text x="36" y="226" class="t">streamed in 1 MiB pieces into</text>
  <text x="36" y="242" class="m">import_staging/&lt;sid&gt;/bundle.zip</text>
  <text x="36" y="260" class="t">TTL 1 h, 5 per tenant, 2 GiB host</text>
  <text x="36" y="278" class="t">413 &gt; 500 MB · 429 staging_full/busy</text>

  <rect x="274" y="184" width="200" height="104" rx="8" class="gate"/>
  <text x="286" y="206" class="h">bundle.validate V1-V6</text>
  <text x="286" y="226" class="t">container · envelope ·</text>
  <text x="286" y="242" class="t">integrity · manifest ·</text>
  <text x="286" y="258" class="t">staleness (warn) · secrets</text>
  <text x="286" y="278" class="t">nothing extracted, nothing written</text>

  <rect x="504" y="184" width="220" height="104" rx="8" class="srv"/>
  <text x="516" y="206" class="h">Report (200, report.json)</text>
  <text x="516" y="226" class="t">per card: default_location,</text>
  <text x="516" y="242" class="m">id_taken · same_source ·</text>
  <text x="516" y="258" class="m">folder_not_empty · nested</text>
  <text x="516" y="278" class="au">audit project.import_validated</text>

  <rect x="754" y="184" width="222" height="104" rx="8" class="srv"/>
  <text x="766" y="206" class="h">GET …/verdict</text>
  <text x="766" y="226" class="t">conflicts recomputed for</text>
  <text x="766" y="242" class="t">project, project_id, location;</text>
  <text x="766" y="258" class="t">a new id resolves same_source</text>
  <text x="766" y="278" class="t">(import as a copy)</text>

  <rect x="274" y="300" width="200" height="44" rx="8" class="bad"/>
  <text x="286" y="320" class="t">422 &lt;stage&gt;: staging deleted</text>
  <text x="286" y="336" class="au">audit project.import_rejected</text>

  <text x="24" y="388" class="lane">APPLY: POST /-/import/{sid}/apply (one of 2 slots, under the lock of the NEW id)</text>
  <rect x="24" y="396" width="150" height="84" rx="8" class="gate"/>
  <text x="36" y="418" class="h">1 Re-validate</text>
  <text x="36" y="436" class="t">V1-V6 again; open</text>
  <text x="36" y="452" class="t">conflict → 409 kind</text>

  <rect x="188" y="396" width="150" height="84" rx="8" class="srv"/>
  <text x="200" y="418" class="h">2 Requested</text>
  <text x="200" y="436" class="t">registry entry</text>
  <text x="200" y="452" class="m">pending: "import"</text>
  <text x="200" y="470" class="au">audit imported requested</text>

  <rect x="352" y="396" width="150" height="84" rx="8" class="srv"/>
  <text x="364" y="418" class="h">3 Extract</text>
  <text x="364" y="436" class="m">&lt;id&gt;.importing-*</text>
  <text x="364" y="452" class="t">exclusive, no-follow,</text>
  <text x="364" y="468" class="t">re-hashed, no links</text>

  <rect x="516" y="396" width="150" height="84" rx="8" class="srv"/>
  <text x="528" y="418" class="h">4 One rename</text>
  <text x="528" y="436" class="t">onto the target;</text>
  <text x="528" y="452" class="t">never over content</text>
  <text x="528" y="468" class="m">→ folder_not_empty</text>

  <rect x="680" y="396" width="296" height="84" rx="8" class="srv"/>
  <text x="692" y="418" class="h">5 project.yaml  ·  6 git step</text>
  <text x="692" y="436" class="t">tenant, id, title, protection written; then per repo</text>
  <text x="692" y="452" class="m">init --template= · verify · list-heads</text>
  <text x="692" y="468" class="m">unbundle · fsck · update-ref</text>

  <rect x="24" y="500" width="300" height="84" rx="8" class="srv"/>
  <text x="36" y="522" class="h">7 Register  ·  8 Repair</text>
  <text x="36" y="540" class="t">new random uid, class max(internal, export),</text>
  <text x="36" y="556" class="t">assistant read; ENGINE.json removed,</text>
  <text x="36" y="572" class="t">.mcp.json / .corvin/local regenerated</text>

  <rect x="344" y="500" width="300" height="84" rx="8" class="srv"/>
  <text x="356" y="522" class="h">9 kb check  ·  10 Applied</text>
  <text x="356" y="540" class="t">through this tenant's bound engine (warning</text>
  <text x="356" y="556" class="t">on failure); pending cleared; 201 with</text>
  <text x="356" y="572" class="au">warnings, notes · audit imported applied</text>

  <rect x="664" y="500" width="312" height="84" rx="8" class="box"/>
  <text x="676" y="522" class="h">Result in the dialog</text>
  <text x="676" y="540" class="t">new id and place, "Git history could not be</text>
  <text x="676" y="556" class="t">imported" when the part was dropped, what</text>
  <text x="676" y="572" class="t">git status shows and why · Open project</text>

  <rect x="24" y="604" width="460" height="92" rx="8" class="bad"/>
  <text x="36" y="626" class="h">Failure in 1-4: nothing stays</text>
  <text x="36" y="646" class="t">sibling and pending entry removed, 409 with the reason</text>
  <text x="36" y="662" class="au">audit imported error (reason_class)</text>
  <text x="36" y="682" class="t">a killed apply: health pending_import → Repair removes it</text>

  <rect x="504" y="604" width="472" height="92" rx="8" class="bad"/>
  <text x="516" y="626" class="h">Failure in 5-9: a registered project with a gap</text>
  <text x="516" y="646" class="t">409 import_incomplete with project_id; pending cleared;</text>
  <text x="516" y="662" class="au">audit imported error reason_class=incomplete</text>
  <text x="516" y="682" class="t">the doctor names what is missing; Repair completes it</text>

  <path d="M134 114 V184" class="e"/>
  <path d="M244 236 H274" class="e"/>
  <path d="M474 236 H504" class="e"/>
  <path d="M374 288 V300" class="d"/>
  <path d="M614 184 V134" class="e"/>
  <path d="M684 100 H740" class="d"/>
  <path d="M760 134 L800 184" class="d"/>
  <path d="M830 184 L700 134" class="d"/>
  <path d="M976 110 H990 V362 H99 V396" class="e"/>
  <path d="M174 438 H188" class="e"/>
  <path d="M338 438 H352" class="e"/>
  <path d="M502 438 H516" class="e"/>
  <path d="M666 438 H680" class="e"/>
  <path d="M828 480 C828 492 174 488 174 500" class="e"/>
  <path d="M324 542 H344" class="e"/>
  <path d="M644 542 H664" class="e"/>
</svg>
