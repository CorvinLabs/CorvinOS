  <text x="600" y="615" text-anchor="middle" fill="#ddd" font-size="11">Input → L5/L10/L22 → Learning → Audit</text>
  <text x="600" y="635" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Every layer versioned, auditable, GDPR compliant</text>
  <text x="600" y="655" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Compliance (L16, L34, L44) = fail-closed, non-negotiable</text>
  <text x="600" y="675" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Full docs at: docs/claude-ref/layer-summary.md</text>
