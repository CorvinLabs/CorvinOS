<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1000" height="900" fill="#0d1117"/>

  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" fill="#e6edf3" text-anchor="middle">
    CorvinOS 6D Loss Vector Hexagon
  </text>
  <text x="500" y="70" font-size="14" fill="#8b949e" text-anchor="middle">
    Six dimensions of quality. Fill the hexagon to optimize.
  </text>

  <!-- Hexagon (outer border) -->
  <polygon points="500,100 700,200 750,400 500,600 250,400 200,200"
           fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Hexagon (filled with gradient) -->
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#238636;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0969da;stop-opacity:0.2"/>
    </linearGradient>

    <!-- Color definitions for vertices -->
    <stop id="color-data" style="stop-color:#3fb950"/>
    <stop id="color-gen" style="stop-color:#238636"/>
    <stop id="color-user" style="stop-color:#1f6feb"/>
    <stop id="color-eff" style="stop-color:#79c0ff"/>
    <stop id="color-learn" style="stop-color:#d2a8ff"/>
    <stop id="color-sys" style="stop-color:#54aeff"/>
  </defs>

  <!-- Filled hexagon (current quality) -->
  <polygon points="500,200 650,300 700,450 500,550 300,450 350,300"
           fill="url(#hexGradient)" stroke="#3fb950" stroke-width="2" opacity="0.8"/>

  <!-- Vertex 1: Data Quality (Top) -->
  <circle cx="500" cy="100" r="50" fill="#3fb950" stroke="#7ee787" stroke-width="3"/>
  <text x="500" y="95" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">88%</text>
  <text x="500" y="115" font-size="11" fill="#ffffff" text-anchor="middle">Data Quality</text>
  <line x="500" y="150" x2="500" y2="200" stroke="#3fb950" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Vertex 2: Generation Quality (Top Right) -->
  <circle cx="700" cy="200" r="50" fill="#238636" stroke="#56d364" stroke-width="3"/>
  <text x="700" y="195" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">92%</text>
  <text x="750" y="215" font-size="11" fill="#ffffff" text-anchor="middle">Generation</text>
  <text x="750" y="230" font-size="11" fill="#ffffff" text-anchor="middle">Quality</text>

  <!-- Vertex 3: Efficiency (Bottom Right) -->
  <circle cx="750" cy="400" r="50" fill="#79c0ff" stroke="#54aeff" stroke-width="3"/>
  <text x="750" y="395" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">95%</text>
  <text x="820" y="415" font-size="11" fill="#ffffff" text-anchor="middle">Efficiency</text>
  <text x="820" y="430" font-size="11" fill="#ffffff" text-anchor="middle">(Cost/Speed)</text>

  <!-- Vertex 4: User Satisfaction (Bottom Left) -->
  <circle cx="500" cy="600" r="50" fill="#1f6feb" stroke="#79c0ff" stroke-width="3"/>
  <text x="500" y="595" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">88%</text>
  <text x="500" y="615" font-size="11" fill="#ffffff" text-anchor="middle">User</text>
  <text x="500" y="630" font-size="11" fill="#ffffff" text-anchor="middle">Satisfaction</text>

  <!-- Vertex 5: Learning Health (Bottom Left) -->
  <circle cx="250" cy="400" r="50" fill="#d2a8ff" stroke="#f0883e" stroke-width="3"/>
  <text x="250" y="395" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">90%</text>
  <text x="170" y="415" font-size="11" fill="#ffffff" text-anchor="middle">Learning</text>
  <text x="170" y="430" font-size="11" fill="#ffffff" text-anchor="middle">Loop Health</text>

  <!-- Vertex 6: System Health (Top Left) -->
  <circle cx="200" cy="200" r="50" fill="#54aeff" stroke="#54aeff" stroke-width="3"/>
  <text x="200" y="195" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">98%</text>
  <text x="130" y="215" font-size="11" fill="#ffffff" text-anchor="middle">System</text>
  <text x="130" y="230" font-size="11" fill="#ffffff" text-anchor="middle">Health</text>

  <!-- Center text: Overall quality -->
  <circle cx="500" cy="350" r="70" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="335" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">
    Overall
  </text>
  <text x="500" y="360" font-size="24" font-weight="bold" fill="#7ee787" text-anchor="middle">
    0.90
  </text>
  <text x="500" y="380" font-size="12" fill="#8b949e" text-anchor="middle">
    90% Quality
  </text>

  <!-- Legend -->
  <text x="50" y="750" font-size="14" font-weight="bold" fill="#e6edf3">How to Read:</text>

  <rect x="50" y="770" width="870" height="110" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <text x="70" y="795" font-size="12" fill="#8b949e">
    Each vertex represents one quality dimension (0-100%). The larger the filled hexagon, the higher the overall quality.
  </text>
  <text x="70" y="820" font-size="12" fill="#8b949e">
    CorvinOS measures all 6 dimensions simultaneously. A "full" hexagon means balanced excellence across all areas.
  </text>
  <text x="70" y="845" font-size="12" fill="#8b949e">
    Overall Quality = 1.0 - mean(loss_vector). Higher is better. Target: 0.95+ (95% quality).
  </text>

  <!-- Metrics table below -->
  <text x="50" y="880" font-size="12" font-weight="bold" fill="#e6edf3">Current Metrics:</text>
</svg>
