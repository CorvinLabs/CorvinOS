<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title>Data chapter: one credential store for database connections, one registry layout for knowledge providers</title>
  <style>
    .box  { fill:#f6f8fa; stroke:#57606a; rx:8; }
    .gate { fill:#fff8c5; stroke:#9a6700; rx:8; }
    .ok   { fill:#dafbe1; stroke:#1a7f37; rx:8; }
    .gone { fill:#ffebe9; stroke:#cf222e; rx:8; stroke-dasharray:4 3; }
    .lbl  { fill:#24292f; }
    .sub  { fill:#57606a; font-size:11px; }
    .h    { fill:#24292f; font-size:15px; font-weight:600; }
    .arr  { stroke:#57606a; stroke-width:1.4; fill:none; marker-end:url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>

  <text x="20" y="28" class="h">Databases - credentials</text>
  <rect x="20" y="44" width="200" height="56" class="box"/>
  <text x="32" y="66" class="lbl">Connect form</text>
  <text x="32" y="84" class="sub">RSA-OAEP in the browser</text>

  <rect x="260" y="44" width="230" height="56" class="gate"/>
  <text x="272" y="66" class="lbl">POST /data-sources/_secrets/{NAME}</text>
  <text x="272" y="84" class="sub">name rule, decrypt, audit (name only)</text>

  <rect x="530" y="44" width="200" height="56" class="ok"/>
  <text x="542" y="66" class="lbl">forge secret vault</text>
  <text x="542" y="84" class="sub">secrets.json, mode 0600</text>

  <rect x="770" y="44" width="190" height="56" class="box"/>
  <text x="782" y="66" class="lbl">connection_env.py</text>
  <text x="782" y="84" class="sub">manifest = names only</text>

  <rect x="660" y="130" width="140" height="48" class="box"/>
  <text x="672" y="152" class="lbl">compute runner</text>
  <text x="672" y="168" class="sub">compute_run datasources</text>
  <rect x="820" y="130" width="140" height="48" class="box"/>
  <text x="832" y="152" class="lbl">datasource_query</text>
  <text x="832" y="168" class="sub">chat tool, read-only</text>

  <rect x="260" y="130" width="230" height="48" class="gone"/>
  <text x="272" y="152" class="lbl">POST /byok/secrets/{name}</text>
  <text x="272" y="168" class="sub">provider keys only - no longer used here</text>

  <path class="arr" d="M220,72 L258,72"/>
  <path class="arr" d="M490,72 L528,72"/>
  <path class="arr" d="M730,72 L768,72"/>
  <path class="arr" d="M840,100 L740,128"/>
  <path class="arr" d="M880,100 L888,128"/>

  <text x="20" y="232" class="h">Knowledge - one registry layout</text>
  <rect x="20" y="248" width="170" height="48" class="box"/>
  <text x="32" y="270" class="lbl">Add Provider</text>
  <text x="32" y="286" class="sub">custom-provider/create</text>
  <rect x="20" y="306" width="170" height="48" class="box"/>
  <text x="32" y="328" class="lbl">Hub import</text>
  <text x="32" y="344" class="sub">hub/import (catalogue entry)</text>

  <rect x="230" y="270" width="250" height="64" class="ok"/>
  <text x="242" y="292" class="lbl">rag_registry_store.py</text>
  <text x="242" y="309" class="sub">rag/manifests/&lt;id&gt;.yaml + registry.json</text>
  <text x="242" y="324" class="sub">one count() for badge and licence gate</text>

  <rect x="520" y="270" width="190" height="64" class="box"/>
  <text x="532" y="292" class="lbl">RAGOrchestrator</text>
  <text x="532" y="309" class="sub">rebuilt when the registry</text>
  <text x="532" y="324" class="sub">signature changes</text>

  <rect x="750" y="270" width="210" height="64" class="gate"/>
  <text x="762" y="292" class="lbl">rag_service.run_query</text>
  <text x="762" y="309" class="sub">classification of the providers</text>
  <text x="762" y="324" class="sub">-&gt; L34 gate -&gt; count -&gt; audit</text>

  <rect x="700" y="364" width="125" height="44" class="box"/>
  <text x="712" y="390" class="lbl">Query Tester</text>
  <rect x="840" y="364" width="120" height="44" class="box"/>
  <text x="852" y="390" class="lbl">rag_query (chat)</text>

  <path class="arr" d="M190,272 L228,292"/>
  <path class="arr" d="M190,330 L228,312"/>
  <path class="arr" d="M480,302 L518,302"/>
  <path class="arr" d="M710,302 L748,302"/>
  <path class="arr" d="M830,334 L770,362"/>
  <path class="arr" d="M880,334 L895,362"/>

  <text x="20" y="450" class="h">Knowledge Hub - tenant-local catalogue</text>
  <rect x="20" y="466" width="440" height="72" class="box"/>
  <text x="32" y="488" class="lbl">publish {provider_id}: card read from the manifest; manifest stored</text>
  <text x="32" y="506" class="lbl">as rag_hub/manifests/&lt;sha256&gt;.yaml; import verifies the hash.</text>
  <text x="32" y="524" class="sub">reviews, export (real manifest, no share link), analytics per tenant; reads never write</text>

  <rect x="500" y="466" width="460" height="72" class="gone"/>
  <text x="512" y="488" class="lbl">Removed: DataHub creator</text>
  <text x="512" y="506" class="sub">panels/datahub-creator, routes/datahub_creator_routes.py (/datahub/projects*),</text>
  <text x="512" y="522" class="sub">core/datahub_creator - unregistered panel, no UI caller. DataHub (/datahub/*) stays.</text>
</svg>
