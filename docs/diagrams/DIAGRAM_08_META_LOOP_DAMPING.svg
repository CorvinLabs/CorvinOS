<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#3d2550"/><stop offset="100%" style="stop-color:#1a1a6e"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#2d3e7e"/><stop offset="100%" style="stop-color:#e74c3c"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#f39c12"/><stop offset="100%" style="stop-color:#e74c3c"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#27ae60"/><stop offset="100%" style="stop-color:#f39c12"/></linearGradient>
  </defs>
  <rect width="1200" height="850" fill="#0f0f1e"/>
  <text x="600" y="50" text-anchor="middle" fill="#e0e0e0" font-size="28" font-weight="bold">Meta Loop + Damping Protocol</text>
  <line x1="100" y1="70" x2="1100" y2="70" stroke="#333" stroke-width="1"/>

  <text x="100" y="120" fill="#ffd700" font-size="14" font-weight="bold">❌ Problem: Without Damping</text>
  <rect x="100" y="140" width="400" height="120" rx="8" fill="url(#g2)"/>
  <text x="300" y="170" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">All loops update at 10%</text>
  <text x="300" y="190" text-anchor="middle" fill="#ddd" font-size="11">Coupling causes oscillation</text>
  <text x="300" y="210" text-anchor="middle" fill="#ddd" font-size="11">System diverges or deadlocks</text>
  <text x="300" y="235" text-anchor="middle" fill="#fff" font-size="11" opacity="0.8">⚡ UNSTABLE</text>

  <text x="700" y="120" fill="#ffd700" font-size="14" font-weight="bold">✓ Solution: Tiered Damping</text>
  <rect x="700" y="140" width="400" height="120" rx="8" fill="url(#g3)"/>
  <text x="900" y="170" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Tier 1: 10%, Tier 2: 5%, Tier 3: 1%</text>
  <text x="900" y="190" text-anchor="middle" fill="#ddd" font-size="11">Prevents coupling oscillation</text>
  <text x="900" y="210" text-anchor="middle" fill="#ddd" font-size="11">Converges smoothly in <10K samples</text>
  <text x="900" y="235" text-anchor="middle" fill="#fff" font-size="11" opacity="0.8">✓ STABLE</text>

  <rect x="100" y="320" width="1000" height="100" rx="8" fill="url(#g1)"/>
  <text x="600" y="360" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">TIER 1 (α=10%): Core Loops</text>
  <text x="600" y="380" text-anchor="middle" fill="#ddd" font-size="11">Routing, Context, Execution, Confidence, Compliance, Learning</text>
  <text x="600" y="400" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Fast convergence for frequent feedback</text>

  <rect x="100" y="450" width="1000" height="100" rx="8" fill="url(#g2)"/>
  <text x="600" y="490" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">TIER 2 (α=5%): Infrastructure Loops</text>
  <text x="600" y="510" text-anchor="middle" fill="#ddd" font-size="11">Memory, Plugins, Security</text>
  <text x="600" y="530" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Hourly metrics • Slower adaptation</text>

  <rect x="100" y="580" width="1000" height="100" rx="8" fill="url(#g4)"/>
  <text x="600" y="620" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">TIER 3 (α=1%): Meta Loop</text>
  <text x="600" y="640" text-anchor="middle" fill="#ddd" font-size="11">Learns optimal weights for all 9 dimensions</text>
  <text x="600" y="660" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Very slow • Highest-level tuning</text>
</svg>
