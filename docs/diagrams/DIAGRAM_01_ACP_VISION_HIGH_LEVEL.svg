<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d2550"/>
      <stop offset="100%" style="stop-color:#1a1a6e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3e7e"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#f39c12"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#3498db"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0f0f1e"/>
  <text x="600" y="50" text-anchor="middle" fill="#e0e0e0" font-size="28" font-weight="bold">ACP Vision: Skills 2.0</text>
  <line x1="100" y1="70" x2="1100" y2="70" stroke="#333" stroke-width="1"/>

  <rect x="80" y="110" width="1040" height="80" rx="8" fill="url(#g1)"/>
  <text x="100" y="130" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">L5: ROUTING</text>
  <text x="100" y="150" fill="#fff" font-size="16" font-weight="bold">Smart Engine Selection</text>
  <text x="100" y="170" fill="#ddd" font-size="11">Claude • Opus • Hermes • Learn best per task</text>

  <path d="M 600 190 L 600 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="80" y="220" width="1040" height="80" rx="8" fill="url(#g2)"/>
  <text x="100" y="240" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">L10: CONTEXT</text>
  <text x="100" y="260" fill="#fff" font-size="16" font-weight="bold">Hybrid Context Model</text>
  <text x="100" y="280" fill="#ddd" font-size="11">Preserve → Adapt → Merge • Saves 30% tokens</text>

  <path d="M 600 300 L 600 330" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="80" y="330" width="1040" height="80" rx="8" fill="url(#g3)"/>
  <text x="100" y="350" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">L22: WORKFLOW</text>
  <text x="100" y="370" fill="#fff" font-size="16" font-weight="bold">Orchestrate Skills</text>
  <text x="100" y="390" fill="#ddd" font-size="11">DAG-validated execution • Optimal ordering</text>

  <path d="M 600 410 L 600 440" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="80" y="440" width="1040" height="80" rx="8" fill="url(#g4)"/>
  <text x="100" y="460" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LEARNING LOOP</text>
  <text x="100" y="480" fill="#fff" font-size="16" font-weight="bold">9D Self-Optimization</text>
  <text x="100" y="500" fill="#ddd" font-size="11">Converges <10K samples • Operator always in control</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db"/>
    </marker>
  </defs>
</svg>