<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; }
      .store { fill: #f7fafc; stroke: #2b6cb0; stroke-width: 1.5; }
      .chain { fill: #fffaf0; stroke: #c05621; stroke-width: 1.5; }
      .t { font-size: 13px; fill: #1a202c; font-weight: bold; }
      .s { font-size: 11px; fill: #2d3748; }
      .n { font-size: 10px; fill: #718096; }
      .line { stroke: #4a5568; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1100" height="520" fill="#edf2f7"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Marketplace Packages and CorvinTV settings: stores and audit-first writes (2026-10-24)</text>

  <text x="30" y="74" class="t">Marketplace &#8594; Packages tab</text>
  <rect x="30" y="88" width="320" height="92" rx="6" class="box"/>
  <text x="44" y="110" class="s">POST /v1/console/packages/upload</text>
  <text x="44" y="128" class="s">DELETE /v1/console/packages/{id}</text>
  <text x="44" y="146" class="s">GET /packages, /packages/{id}/details</text>
  <text x="44" y="166" class="n">id pattern ^[a-z0-9][a-z0-9_-]*$ ; no feature flag</text>

  <rect x="30" y="214" width="320" height="70" rx="6" class="chain"/>
  <text x="44" y="236" class="t">1. audit FIRST (strict)</text>
  <text x="44" y="254" class="s">console.action_performed package.install|uninstall</text>
  <text x="44" y="272" class="n">not committed &#8594; 503, nothing changed</text>

  <rect x="30" y="318" width="320" height="118" rx="6" class="store"/>
  <text x="44" y="340" class="t">2. &lt;CORVIN_HOME&gt;/tenants/&lt;tid&gt;/packages/</text>
  <text x="44" y="360" class="s">installed/&lt;id&gt;/ (ZIP contents + metadata.json)</text>
  <text x="44" y="378" class="s">archive/&lt;id&gt;-&lt;ver&gt;-&lt;UTC&gt;/metadata.json</text>
  <text x="44" y="396" class="s">uninstall refused (409) while a package depends on it</text>
  <text x="44" y="416" class="n">registry only: contents are not activated</text>
  <text x="44" y="430" class="n">before 2026-10-24: ~/.corvin/packages</text>

  <path d="M190,180 L190,212" class="line"/>
  <path d="M190,284 L190,316" class="line"/>

  <text x="390" y="74" class="t">CorvinTV panel</text>
  <rect x="390" y="88" width="320" height="92" rx="6" class="box"/>
  <text x="404" y="110" class="s">PUT /v1/console/video/settings</text>
  <text x="404" y="128" class="s">  tts_engine, max_duration_minutes</text>
  <text x="404" y="146" class="s">PUT /v1/console/video/styles/default</text>
  <text x="404" y="166" class="n">POST /video/styles with set_default=true</text>

  <rect x="390" y="214" width="320" height="70" rx="6" class="chain"/>
  <text x="404" y="236" class="t">1. schema check, then audit FIRST</text>
  <text x="404" y="254" class="s">video_producer.settings_changed (new + previous)</text>
  <text x="404" y="272" class="s">video_producer.style_default_changed</text>

  <rect x="390" y="318" width="320" height="118" rx="6" class="store"/>
  <text x="404" y="340" class="t">2. tenant plugin registry record</text>
  <text x="404" y="360" class="s">&lt;tid&gt;/plugins/registry.yaml: video_producer.settings</text>
  <text x="404" y="378" class="s">tts_engine, max_video_length_minutes</text>
  <text x="404" y="396" class="s">PluginLifecycle.set_settings (plugin.config_changed)</text>
  <text x="404" y="416" class="n">one store with the Installed tab; survives restart</text>
  <text x="404" y="430" class="n">before 2026-10-24: a process-memory dict</text>

  <path d="M550,180 L550,212" class="line"/>
  <path d="M550,284 L550,316" class="line"/>

  <rect x="760" y="214" width="310" height="70" rx="6" class="chain"/>
  <text x="774" y="236" class="t">tenant audit chain</text>
  <text x="774" y="254" class="s">&lt;tid&gt;/global/forge/audit.jsonl</text>
  <text x="774" y="272" class="n">hash-chained; write failure = refusal (503)</text>
  <path d="M350,232 L370,232 L370,197 L736,197 L736,236 L758,236" class="line"/>
  <path d="M710,256 L758,256" class="line"/>

  <rect x="760" y="318" width="310" height="70" rx="6" class="store"/>
  <text x="774" y="340" class="t">default style pointer</text>
  <text x="774" y="358" class="s">&lt;tid&gt;/video_producer/styles/default</text>
  <text x="774" y="376" class="n">written only after style_default_changed commits</text>

  <text x="30" y="470" class="n">Proof: core/console/tests/test_marketplace_tv_gaps_e2e.py (HTTP, red on origin/main); tests/sandbox/test_gap_marketplace_tv.py (two uvicorn processes, restart).</text>
  <text x="30" y="488" class="n">Docs: docs/claude-ref/layer-plugins.md (Marketplace console), default-plugins.md (CorvinTV), layer-36-erasure.md (packages store).</text>
</svg>
