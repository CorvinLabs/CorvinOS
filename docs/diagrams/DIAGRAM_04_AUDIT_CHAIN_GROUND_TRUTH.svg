<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d2550"/>
      <stop offset="100%" style="stop-color:#1a1a6e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3e7e"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#f39c12"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#3498db"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="800" fill="#0f0f1e"/>
  <text x="700" y="50" text-anchor="middle" fill="#e0e0e0" font-size="28" font-weight="bold">Audit Chain: Proof System</text>
  <line x1="100" y1="70" x2="1300" y2="70" stroke="#333" stroke-width="1"/>

  <rect x="100" y="120" width="280" height="100" rx="8" fill="url(#g1)"/>
  <text x="240" y="150" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Event 1</text>
  <text x="240" y="175" text-anchor="middle" fill="#ddd" font-size="10">hash: abc123</text>

  <line x1="380" y1="170" x2="440" y2="170" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="120" width="280" height="100" rx="8" fill="url(#g2)"/>
  <text x="580" y="150" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Event 2</text>
  <text x="580" y="175" text-anchor="middle" fill="#ddd" font-size="10">prev: abc123</text>

  <line x1="720" y1="170" x2="780" y2="170" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="780" y="120" width="280" height="100" rx="8" fill="url(#g3)"/>
  <text x="920" y="150" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Event 3</text>
  <text x="920" y="175" text-anchor="middle" fill="#ddd" font-size="10">prev: def456</text>

  <line x1="1060" y1="170" x2="1120" y2="170" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1120" y="120" width="170" height="100" rx="8" fill="url(#g4)"/>
  <text x="1205" y="150" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">...</text>

  <rect x="100" y="280" width="1190" height="120" rx="8" fill="url(#g5)"/>
  <text x="695" y="320" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">✓ Immutable Hash Chain</text>
  <text x="695" y="345" text-anchor="middle" fill="#ddd" font-size="11">Every event linked to previous • Cryptographic proof of integrity</text>
  <text x="695" y="365" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Tenant-scoped isolation • RFC 3161 timestamping • GDPR compliant</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db"/>
    </marker>
  </defs>
</svg>