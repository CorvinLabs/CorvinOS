<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #666; }
      .bar-confidence { fill: #00aa44; }
      .bar-cache { fill: #0066cc; }
      .bar-skills { fill: #ff8800; }
      .bar-vibe { fill: #9966cc; }
      .bar-overhead { fill: #cc0000; opacity: 0.6; }
      .bar-label { font-size: 11px; fill: #333; font-weight: bold; }
      .bar-value { font-size: 10px; fill: white; font-weight: bold; }
      .axis-label { font-size: 11px; fill: #555; }
      .grid-line { stroke: #eee; stroke-width: 1; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="35" class="title" text-anchor="middle">
    Token Savings by Subsystem (Weekly Aggregate)
  </text>
  <text x="600" y="55" class="subtitle" text-anchor="middle">
    Where do we actually save the most tokens? Breakdown by subsystem contribution to total savings
  </text>

  <!-- Legend -->
  <rect x="80" y="70" width="15" height="15" class="bar-confidence"/>
  <text x="100" y="83" class="subtitle">Confidence Exit (Early stop)</text>

  <rect x="380" y="70" width="15" height="15" class="bar-cache"/>
  <text x="400" y="83" class="subtitle">Cache Hit (Decision history)</text>

  <rect x="700" y="70" width="15" height="15" class="bar-skills"/>
  <text x="720" y="83" class="subtitle">Skill Grading (Filter low-grade)</text>

  <rect x="1000" y="70" width="15" height="15" class="bar-vibe"/>
  <text x="1020" y="83" class="subtitle">Vibe Intent (Understood first time)</text>

  <!-- Grid lines -->
  <line x1="80" y1="150" x2="1100" y2="150" class="grid-line"/>
  <line x1="80" y1="200" x2="1100" y2="200" class="grid-line"/>
  <line x1="80" y1="250" x2="1100" y2="250" class="grid-line"/>
  <line x1="80" y1="300" x2="1100" y2="300" class="grid-line"/>
  <line x1="80" y1="350" x2="1100" y2="350" class="grid-line"/>
  <line x1="80" y1="400" x2="1100" y2="400" class="grid-line"/>
  <line x1="80" y1="450" x2="1100" y2="450" class="grid-line"/>
  <line x1="80" y1="500" x2="1100" y2="500" class="grid-line"/>

  <!-- Y-axis labels (% contribution to savings) -->
  <text x="70" y="505" class="axis-label" text-anchor="end">0%</text>
  <text x="70" y="455" class="axis-label" text-anchor="end">10%</text>
  <text x="70" y="405" class="axis-label" text-anchor="end">20%</text>
  <text x="70" y="355" class="axis-label" text-anchor="end">30%</text>
  <text x="70" y="305" class="axis-label" text-anchor="end">40%</text>
  <text x="70" y="255" class="axis-label" text-anchor="end">50%</text>
  <text x="70" y="205" class="axis-label" text-anchor="end">60%</text>
  <text x="70" y="155" class="axis-label" text-anchor="end">70%</text>

  <!-- Y-axis line -->
  <line x1="80" y1="150" x2="80" y2="500" stroke="#333" stroke-width="2"/>

  <!-- X-axis line -->
  <line x1="80" y1="500" x2="1100" y2="500" stroke="#333" stroke-width="2"/>

  <!-- SUBSYSTEM 1: Confidence Exit -->
  <!-- Bar (42% of total savings) -->
  <rect x="120" y="290" width="80" height="210" class="bar-confidence"/>
  <text x="160" y="385" class="bar-value">42%</text>

  <!-- Value box -->
  <rect x="120" y="520" width="80" height="120" fill="#f0fff0" stroke="#00aa44" stroke-width="1" rx="4"/>
  <text x="160" y="540" class="bar-label" text-anchor="middle">Confidence</text>
  <text x="160" y="557" class="axis-label" text-anchor="middle">Exit</text>
  <text x="130" y="575" class="axis-label">Triggers: 127</text>
  <text x="160" y="590" class="axis-label" text-anchor="middle">Saved:</text>
  <text x="160" y="605" class="axis-label" text-anchor="middle">304.8k tokens</text>
  <text x="160" y="620" class="axis-label" text-anchor="middle">Avg: 2.4k/trigger</text>
  <text x="160" y="635" class="axis-label" text-anchor="middle">⭐⭐⭐⭐⭐</text>

  <!-- SUBSYSTEM 2: Cache Hit -->
  <!-- Bar (18% of total savings) -->
  <rect x="270" y="410" width="80" height="90" class="bar-cache"/>
  <text x="310" y="460" class="bar-value">18%</text>

  <!-- Value box -->
  <rect x="270" y="520" width="80" height="120" fill="#f0f7ff" stroke="#0066cc" stroke-width="1" rx="4"/>
  <text x="310" y="540" class="bar-label" text-anchor="middle">Cache</text>
  <text x="310" y="557" class="axis-label" text-anchor="middle">Hit</text>
  <text x="280" y="575" class="axis-label">Hits: 45</text>
  <text x="310" y="590" class="axis-label" text-anchor="middle">Saved:</text>
  <text x="310" y="605" class="axis-label" text-anchor="middle">107.1k tokens</text>
  <text x="310" y="620" class="axis-label" text-anchor="middle">Avg: 2.4k/hit</text>
  <text x="310" y="635" class="axis-label" text-anchor="middle">⭐⭐⭐⭐</text>

  <!-- SUBSYSTEM 3: Skill Grading -->
  <!-- Bar (12% of total savings) -->
  <rect x="420" y="440" width="80" height="60" class="bar-skills"/>
  <text x="460" y="475" class="bar-value">12%</text>

  <!-- Value box -->
  <rect x="420" y="520" width="80" height="120" fill="#fffbf0" stroke="#ff8800" stroke-width="1" rx="4"/>
  <text x="460" y="540" class="bar-label" text-anchor="middle">Skill</text>
  <text x="460" y="557" class="axis-label" text-anchor="middle">Grading</text>
  <text x="430" y="575" class="axis-label">Filtered: 340</text>
  <text x="460" y="590" class="axis-label" text-anchor="middle">Saved:</text>
  <text x="460" y="605" class="axis-label" text-anchor="middle">71.4k tokens</text>
  <text x="460" y="620" class="axis-label" text-anchor="middle">Avg: 210/filter</text>
  <text x="460" y="635" class="axis-label" text-anchor="middle">⭐⭐⭐</text>

  <!-- SUBSYSTEM 4: Vibe Intent -->
  <!-- Bar (8% of total savings) -->
  <rect x="570" y="460" width="80" height="40" class="bar-vibe"/>
  <text x="610" y="485" class="bar-value">8%</text>

  <!-- Value box -->
  <rect x="570" y="520" width="80" height="120" fill="#f5f0ff" stroke="#9966cc" stroke-width="1" rx="4"/>
  <text x="610" y="540" class="bar-label" text-anchor="middle">Vibe</text>
  <text x="610" y="557" class="axis-label" text-anchor="middle">Intent</text>
  <text x="580" y="575" class="axis-label">Matches: 89</text>
  <text x="610" y="590" class="axis-label" text-anchor="middle">Saved:</text>
  <text x="610" y="605" class="axis-label" text-anchor="middle">47.6k tokens</text>
  <text x="610" y="620" class="axis-label" text-anchor="middle">Avg: 535/match</text>
  <text x="610" y="635" class="axis-label" text-anchor="middle">⭐⭐⭐</text>

  <!-- OVERHEAD: Learning Cost -->
  <!-- Bar (-3% = cost, shown below axis) -->
  <rect x="720" y="500" width="80" height="30" class="bar-overhead"/>
  <text x="760" y="525" class="bar-value">-3%</text>

  <!-- Value box -->
  <rect x="720" y="520" width="80" height="120" fill="#fff0f0" stroke="#cc0000" stroke-width="1" rx="4"/>
  <text x="760" y="540" class="bar-label" text-anchor="middle">Learning</text>
  <text x="760" y="557" class="axis-label" text-anchor="middle">Overhead</text>
  <text x="730" y="575" class="axis-label">Cost: 17.9k</text>
  <text x="760" y="590" class="axis-label" text-anchor="middle">Net gain:</text>
  <text x="760" y="605" class="axis-label" text-anchor="middle">531.2k tokens</text>
  <text x="760" y="620" class="axis-label" text-anchor="middle">Total 7d</text>
  <text x="760" y="635" class="axis-label" text-anchor="middle">⚠️ Worth it</text>

  <!-- TOTAL BAR (right side, cumulative) -->
  <rect x="870" y="165" width="100" height="335" fill="url(#gradientTotal)" stroke="#333" stroke-width="2" rx="4"/>
  <text x="920" y="350" class="bar-value" text-anchor="middle" font-size="14">79.2%</text>

  <!-- Gradient definition for total -->
  <defs>
    <linearGradient id="gradientTotal">
      <stop offset="0%" style="stop-color:#00aa44;stop-opacity:1" />
      <stop offset="23%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="38%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="48%" style="stop-color:#9966cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Total label -->
  <rect x="870" y="520" width="100" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4"/>
  <text x="920" y="540" class="bar-label" text-anchor="middle">NET</text>
  <text x="920" y="557" class="axis-label" text-anchor="middle">SAVINGS</text>
  <text x="920" y="575" class="axis-label" text-anchor="middle">7-day</text>
  <text x="920" y="590" class="bar-label" text-anchor="middle">79.2%</text>
  <text x="920" y="610" class="axis-label" text-anchor="middle">531.2k tokens</text>
  <text x="920" y="625" class="axis-label" text-anchor="middle">vs Baseline</text>

  <!-- Key insights -->
  <rect x="1020" y="120" width="140" height="320" fill="#fffacd" stroke="#ffcc00" stroke-width="2" rx="4"/>
  <text x="1090" y="145" class="title" text-anchor="middle" font-size="14">🎯 Insights</text>

  <text x="1030" y="165" class="axis-label" font-weight="bold">What works best?</text>
  <text x="1030" y="183" class="axis-label">1. Confidence Exit</text>
  <text x="1040" y="198" class="axis-label" font-size="9">(42% of savings)</text>
  <text x="1040" y="213" class="axis-label" font-size="9">→ Early stopping is</text>
  <text x="1040" y="228" class="axis-label" font-size="9">   killer feature</text>

  <text x="1030" y="248" class="axis-label" font-weight="bold">2. Cache Hit</text>
  <text x="1040" y="263" class="axis-label" font-size="9">(18% of savings)</text>
  <text x="1040" y="278" class="axis-label" font-size="9">→ But only 26% hit</text>
  <text x="1040" y="293" class="axis-label" font-size="9">   rate (low hanging)</text>

  <text x="1030" y="313" class="axis-label" font-weight="bold">3. Synergistic</text>
  <text x="1040" y="328" class="axis-label" font-size="9">42% + 18% + 12%</text>
  <text x="1040" y="343" class="axis-label" font-size="9">+ 8% = 80% total</text>

  <!-- Annotation: Cost vs Benefit -->
  <g>
    <line x1="720" y1="500" x2="720" y2="515" stroke="#cc0000" stroke-width="2"/>
    <text x="770" y="520" class="axis-label" font-size="9" font-weight="bold">Learning</text>
    <text x="770" y="533" class="axis-label" font-size="9">cost is small</text>
    <text x="770" y="546" class="axis-label" font-size="9">(-3%) vs gains</text>
    <text x="770" y="559" class="axis-label" font-size="9">(+80%)</text>
    <text x="770" y="572" class="axis-label" font-size="9">→ High ROI</text>
  </g>

  <!-- X-axis label -->
  <text x="600" y="665" class="axis-label" text-anchor="middle">
    Stacked contributions: Each subsystem's token savings as % of total 531.2k token savings (7-day aggregate)
  </text>
</svg>
