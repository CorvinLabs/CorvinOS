<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>

    <filter id="shadow3d">
      <feDropShadow dx="5" dy="10" stdDeviation="8" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="gradStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9940"/>
      <stop offset="100%" style="stop-color:#fb8500"/>
    </linearGradient>

    <linearGradient id="gradStep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>

    <linearGradient id="gradAction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="800" y="50" font-size="36" font-weight="bold" fill="#e6edf3" text-anchor="middle">
    Complete Request Flow Through CorvinOS
  </text>

  <!-- Step 1: Request arrives -->
  <g filter="url(#shadow3d)">
    <rect x="50" y="100" width="220" height="100" rx="12" fill="url(#gradStart)" stroke="#fb8500" stroke-width="2"/>
    <polygon points="50,100 60,90 270,90 260,100" fill="#8b4513" opacity="0.3"/>
    <text x="160" y="145" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 1:</text>
    <text x="160" y="165" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Request Arrives</text>
    <text x="160" y="185" font-size="10" fill="#e6edf3" text-anchor="middle">"Classify this email"</text>
  </g>

  <!-- Arrow -->
  <line x1="270" y1="150" x2="340" y2="150" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Router decides -->
  <g filter="url(#shadow3d)">
    <rect x="340" y="100" width="220" height="100" rx="12" fill="url(#gradStep)" stroke="#79c0ff" stroke-width="2"/>
    <polygon points="340,100 350,90 560,90 550,100" fill="#0969da" opacity="0.3"/>
    <text x="450" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 2:</text>
    <text x="450" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Router Decides</text>
    <text x="450" y="185" font-size="10" fill="#e6edf3" text-anchor="middle">"Send to Haiku (learned)"</text>
  </g>

  <!-- Arrow -->
  <line x1="560" y1="150" x2="630" y2="150" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: DataHub prepares -->
  <g filter="url(#shadow3d)">
    <rect x="630" y="100" width="220" height="100" rx="12" fill="url(#gradStep)" stroke="#79c0ff" stroke-width="2"/>
    <polygon points="630,100 640,90 850,90 840,100" fill="#0969da" opacity="0.3"/>
    <text x="740" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 3:</text>
    <text x="740" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">DataHub Prepares</text>
    <text x="740" y="185" font-size="10" fill="#e6edf3" text-anchor="middle">Context + quality=0.91</text>
  </g>

  <!-- Arrow -->
  <line x1="850" y1="150" x2="920" y2="150" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 4: Skill executes -->
  <g filter="url(#shadow3d)">
    <rect x="920" y="100" width="220" height="100" rx="12" fill="url(#gradAction)" stroke="#7ee787" stroke-width="2"/>
    <polygon points="920,100 930,90 1140,90 1130,100" fill="#0d3622" opacity="0.3"/>
    <text x="1030" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 4:</text>
    <text x="1030" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Skill Executes</text>
    <text x="1030" y="185" font-size="10" fill="#e6edf3" text-anchor="middle">Output + 140ms latency</text>
  </g>

  <!-- Arrow -->
  <line x1="1140" y1="150" x2="1210" y2="150" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 5: Quality measured -->
  <g filter="url(#shadow3d)">
    <rect x="1210" y="100" width="220" height="100" rx="12" fill="url(#gradStep)" stroke="#79c0ff" stroke-width="2"/>
    <polygon points="1210,100 1220,90 1430,90 1420,100" fill="#0969da" opacity="0.3"/>
    <text x="1320" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 5:</text>
    <text x="1320" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Quality Checked</text>
    <text x="1320" y="185" font-size="10" fill="#e6edf3" text-anchor="middle">6D score = 0.94</text>
  </g>

  <!-- Bend down to next row -->
  <polyline points="1320,200 1320,280 750,280" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Step 6: User feedback -->
  <g filter="url(#shadow3d)">
    <rect x="550" y="280" width="220" height="100" rx="12" fill="url(#gradStart)" stroke="#fb8500" stroke-width="2"/>
    <polygon points="550,280 560,270 770,270 760,280" fill="#8b4513" opacity="0.3"/>
    <text x="660" y="315" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 6:</text>
    <text x="660" y="335" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">User Feedback</text>
    <text x="660" y="365" font-size="10" fill="#e6edf3" text-anchor="middle">Signal: +0.95 ✓</text>
  </g>

  <!-- Arrow -->
  <line x1="550" y1="330" x2="480" y2="330" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 7: Attribution -->
  <g filter="url(#shadow3d)">
    <rect x="260" y="280" width="220" height="100" rx="12" fill="url(#gradAction)" stroke="#7ee787" stroke-width="2"/>
    <polygon points="260,280 270,270 480,270 470,280" fill="#0d3622" opacity="0.3"/>
    <text x="370" y="315" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 7:</text>
    <text x="370" y="335" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Attribution</text>
    <text x="370" y="365" font-size="10" fill="#e6edf3" text-anchor="middle">Memory helped most</text>
  </g>

  <!-- Arrow down -->
  <line x1="370" y1="380" x2="370" y2="440" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 8: Weight update -->
  <g filter="url(#shadow3d)">
    <rect x="260" y="440" width="220" height="100" rx="12" fill="url(#gradAction)" stroke="#7ee787" stroke-width="2"/>
    <polygon points="260,440 270,430 480,430 470,440" fill="#0d3622" opacity="0.3"/>
    <text x="370" y="475" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 8:</text>
    <text x="370" y="495" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Weight Update</text>
    <text x="370" y="525" font-size="10" fill="#e6edf3" text-anchor="middle">Memory: 0.50→0.51</text>
  </g>

  <!-- Arrow right -->
  <line x1="480" y1="490" x2="550" y2="490" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 9: Convergence check -->
  <g filter="url(#shadow3d)">
    <rect x="550" y="440" width="220" height="100" rx="12" fill="url(#gradAction)" stroke="#7ee787" stroke-width="2"/>
    <polygon points="550,440 560,430 770,430 760,440" fill="#0d3622" opacity="0.3"/>
    <text x="660" y="475" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 9:</text>
    <text x="660" y="495" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Convergence?</text>
    <text x="660" y="525" font-size="10" fill="#e6edf3" text-anchor="middle">After 500 samples: YES</text>
  </g>

  <!-- Arrow right -->
  <line x1="770" y1="490" x2="840" y2="490" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 10: Regenerate -->
  <g filter="url(#shadow3d)">
    <rect x="840" y="440" width="220" height="100" rx="12" fill="url(#gradAction)" stroke="#7ee787" stroke-width="2"/>
    <polygon points="840,440 850,430 1060,430 1050,440" fill="#0d3622" opacity="0.3"/>
    <text x="950" y="475" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Step 10:</text>
    <text x="950" y="495" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Regenerate</text>
    <text x="950" y="525" font-size="10" fill="#e6edf3" text-anchor="middle">v2 with learned weights</text>
  </g>

  <!-- Curved arrow back to top (feedback loop) -->
  <path d="M 1060 490 Q 1200 250 1320 200" stroke="#d2a8ff" stroke-width="3" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="1250" y="350" font-size="11" fill="#d2a8ff" font-weight="bold" font-style="italic">Loop Repeats</text>

  <!-- Bottom timeline -->
  <g filter="url(#shadow3d)">
    <rect x="100" y="670" width="1400" height="80" rx="12" fill="#0a3622" stroke="#238636" stroke-width="2"/>

    <circle cx="150" cy="710" r="12" fill="#56d364" stroke="#7ee787" stroke-width="2"/>
    <text x="150" y="715" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Day 1</text>

    <line x1="200" y1="710" x2="350" y2="710" stroke="#238636" stroke-width="2" opacity="0.5"/>

    <circle cx="400" cy="710" r="12" fill="#f0883e" stroke="#fb8500" stroke-width="2"/>
    <text x="400" y="715" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Week 1</text>

    <line x1="450" y1="710" x2="600" y2="710" stroke="#238636" stroke-width="2" opacity="0.5"/>

    <circle cx="650" cy="710" r="12" fill="#79c0ff" stroke="#54aeff" stroke-width="2"/>
    <text x="650" y="715" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Week 2-3</text>

    <line x1="700" y1="710" x2="1050" y2="710" stroke="#238636" stroke-width="2" opacity="0.5"/>

    <circle cx="1100" cy="710" r="12" fill="#56d364" stroke="#7ee787" stroke-width="2"/>
    <text x="1100" y="715" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Stable</text>

    <text x="150" y="745" font-size="10" fill="#8b949e">Learning starts</text>
    <text x="400" y="745" font-size="10" fill="#8b949e">Weights change</text>
    <text x="650" y="745" font-size="10" fill="#8b949e">Converged</text>
    <text x="1100" y="745" font-size="10" fill="#8b949e">Permanent</text>
  </g>

  <!-- Key insight box -->
  <g filter="url(#shadow3d)">
    <rect x="100" y="820" width="1400" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>

    <text x="800" y="855" font-size="13" font-weight="bold" fill="#56d364" text-anchor="middle">This loop repeats forever.</text>
    <text x="800" y="875" font-size="12" fill="#e6edf3" text-anchor="middle">Every request teaches the system. Every outcome improves the routing.</text>
    <text x="800" y="895" font-size="12" fill="#e6edf3" text-anchor="middle">After convergence (week 2-3), weights stabilize. Quality plateaus at peak.</text>
    <text x="800" y="920" font-size="11" fill="#7ee787" text-anchor="middle" font-weight="bold">Result: Permanent cost savings + quality improvement</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#58a6ff"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#d2a8ff"/>
    </marker>
  </defs>
</svg>
