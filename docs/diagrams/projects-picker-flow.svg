<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Folder picker flow: places, listing, verdict, mutation re-validation</title>
  <desc>The console's folder picker asks the server for places, lists one folder's directories with the location rule's verdict for the picker's purpose, enables Choose only on an ok verdict, and the action re-validates the folder on confirm.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6475"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9ced8;stroke-width:1.2}
      .srv{fill:#f6f2ea;stroke:#c8a66a;stroke-width:1.2}
      .gate{fill:#fff7e8;stroke:#d08a16;stroke-width:1.4}
      .h{font-size:14px;font-weight:600;fill:#1d2330}
      .t{font-size:12px;fill:#3b4352}
      .m{font-size:11px;fill:#5b6475;font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
      .lane{font-size:12px;font-weight:600;fill:#5b6475;letter-spacing:.06em}
      .e{stroke:#5b6475;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#5b6475;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <text x="24" y="34" class="lane">BROWSER (folder-picker.tsx, picker-logic.ts)</text>
  <text x="24" y="282" class="lane">CONSOLE SERVER (routes/projects.py, core/projects/browse.py, registry.py)</text>
  <line x1="24" y1="256" x2="936" y2="256" stroke="#e1ddd3"/>

  <rect x="24" y="52" width="196" height="96" rx="8" class="box"/>
  <text x="38" y="76" class="h">1 Places</text>
  <text x="38" y="96" class="t">workspace, projects folder,</text>
  <text x="38" y="112" class="t">home, drives, recent,</text>
  <text x="38" y="128" class="t">favourites</text>

  <rect x="252" y="52" width="216" height="96" rx="8" class="box"/>
  <text x="266" y="76" class="h">2 Listing of one folder</text>
  <text x="266" y="96" class="t">directories only, notes per row;</text>
  <text x="266" y="112" class="t">link / foreign / Corvin data /</text>
  <text x="266" y="128" class="t">system folder: not enterable</text>

  <rect x="500" y="52" width="210" height="96" rx="8" class="gate"/>
  <text x="514" y="76" class="h">3 Verdict box</text>
  <text x="514" y="96" class="t">the server's sentence for the</text>
  <text x="514" y="112" class="t">purpose; Choose only on ok;</text>
  <text x="514" y="128" class="t">hint word = warning, still ok</text>

  <rect x="742" y="52" width="194" height="96" rx="8" class="box"/>
  <text x="756" y="76" class="h">4 Choose</text>
  <text x="756" y="96" class="t">the dialog's field is filled;</text>
  <text x="756" y="112" class="t">Cancel / Esc keep the old</text>
  <text x="756" y="128" class="t">value</text>

  <rect x="252" y="170" width="216" height="62" rx="8" class="box"/>
  <text x="266" y="194" class="h">Enter a path instead…</text>
  <text x="266" y="214" class="t">Ctrl/Cmd+L; same listing + verdict</text>

  <path class="e" d="M220 100 H250"/>
  <path class="e" d="M468 100 H498"/>
  <path class="e" d="M710 100 H740"/>
  <path class="d" d="M360 170 V150"/>

  <rect x="24" y="300" width="196" height="120" rx="8" class="srv"/>
  <text x="38" y="324" class="h">GET /-/browse/places</text>
  <text x="38" y="344" class="t">throttle 10/s per session,</text>
  <text x="38" y="360" class="t">slots 2 per tenant / 4 total,</text>
  <text x="38" y="376" class="t">browse pool, 2 s budget</text>
  <text x="38" y="400" class="m">slow -&gt; {places: [], verdict}</text>

  <rect x="252" y="300" width="216" height="120" rx="8" class="srv"/>
  <text x="266" y="324" class="h">GET /-/browse?path&amp;purpose</text>
  <text x="266" y="344" class="t">input rule first (422 path_rule,</text>
  <text x="266" y="360" class="t">UNC never stat-ed); blocked</text>
  <text x="266" y="376" class="t">paths answer entries: []</text>
  <text x="266" y="400" class="m">refusals audited, no path</text>

  <rect x="500" y="300" width="210" height="120" rx="8" class="srv"/>
  <text x="514" y="324" class="h">verdict = validate_location</text>
  <text x="514" y="344" class="t">{ok, reason_class, message,</text>
  <text x="514" y="360" class="t">warnings, notes} - the same</text>
  <text x="514" y="376" class="t">rule the action uses</text>
  <text x="514" y="400" class="m">no second rule set</text>

  <rect x="742" y="300" width="194" height="120" rx="8" class="gate"/>
  <text x="756" y="324" class="h">5 The action re-validates</text>
  <text x="756" y="344" class="t">plan / adopt / move /</text>
  <text x="756" y="360" class="t">relocate / storage judge the</text>
  <text x="756" y="376" class="t">folder again on confirm</text>
  <text x="756" y="400" class="m">records a recent place</text>

  <path class="e" d="M122 148 V298"/>
  <path class="e" d="M360 232 V298"/>
  <path class="e" d="M605 298 V150"/>
  <path class="e" d="M468 360 H498"/>
  <path class="e" d="M839 148 V298"/>
  <text x="128" y="230" class="m">places</text>
  <text x="611" y="230" class="m">verdict</text>
  <text x="845" y="230" class="m">POST on confirm</text>
  <text x="24" y="452" class="t">The verdict is advisory; the mutation is the gate. A folder that changed between the verdict and the confirm is refused there with the same sentence.</text>
</svg>
