<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>

    <!-- 3D shadow effect -->
    <filter id="shadow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.3" flood-color="#000000"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D gradient for boxes -->
    <linearGradient id="grad3d-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0969da;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad3d-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#238636;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3622;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad3d-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8957e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6e40c9;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad3d-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb8500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="50" font-size="36" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, sans-serif">
    What is an Operating System?
  </text>

  <!-- Main OS Circle (center) -->
  <g filter="url(#shadow3d)">
    <circle cx="600" cy="400" r="140" fill="url(#grad3d-green)" stroke="#56d364" stroke-width="3"/>
    <!-- 3D effect: second circle slightly offset -->
    <circle cx="605" cy="405" r="140" fill="#0d3622" opacity="0.3" stroke="none"/>

    <text x="600" y="395" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Operating
    </text>
    <text x="600" y="420" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      System
    </text>
  </g>

  <!-- Function 1: Resource Management -->
  <g filter="url(#shadow3d)">
    <!-- Box with 3D effect -->
    <rect x="80" y="120" width="220" height="140" rx="20" fill="url(#grad3d-blue)" stroke="#79c0ff" stroke-width="2"/>
    <rect x="85" y="125" width="220" height="140" rx="20" fill="#0969da" opacity="0.2" stroke="none"/>

    <text x="190" y="155" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Resource
    </text>
    <text x="190" y="180" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Management
    </text>
    <text x="190" y="210" font-size="11" fill="#e6edf3" text-anchor="middle" font-family="Arial, sans-serif">
      CPU, RAM, Disk
    </text>
    <text x="190" y="228" font-size="11" fill="#8b949e" text-anchor="middle" font-family="Arial, sans-serif">
      Allocation
    </text>

    <!-- Arrow down -->
    <line x1="190" y1="260" x2="190" y2="300" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Function 2: Optimization -->
  <g filter="url(#shadow3d)">
    <rect x="900" y="120" width="220" height="140" rx="20" fill="url(#grad3d-orange)" stroke="#f0883e" stroke-width="2"/>
    <rect x="905" y="125" width="220" height="140" rx="20" fill="#d97706" opacity="0.2" stroke="none"/>

    <text x="1010" y="155" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Optimization
    </text>
    <text x="1010" y="180" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      & Caching
    </text>
    <text x="1010" y="210" font-size="11" fill="#e6edf3" text-anchor="middle" font-family="Arial, sans-serif">
      Speed, Efficiency
    </text>
    <text x="1010" y="228" font-size="11" fill="#8b949e" text-anchor="middle" font-family="Arial, sans-serif">
      Performance
    </text>

    <!-- Arrow down -->
    <line x1="1010" y1="260" x2="1010" y2="300" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- Function 3: Learning -->
  <g filter="url(#shadow3d)">
    <rect x="490" y="620" width="220" height="140" rx="20" fill="url(#grad3d-purple)" stroke="#d2a8ff" stroke-width="2"/>
    <rect x="495" y="625" width="220" height="140" rx="20" fill="#6e40c9" opacity="0.2" stroke="none"/>

    <text x="600" y="655" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Learning &
    </text>
    <text x="600" y="680" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Improvement
    </text>
    <text x="600" y="710" font-size="11" fill="#e6edf3" text-anchor="middle" font-family="Arial, sans-serif">
      Prediction, Feedback
    </text>
    <text x="600" y="728" font-size="11" fill="#8b949e" text-anchor="middle" font-family="Arial, sans-serif">
      Better Over Time
    </text>

    <!-- Arrow up -->
    <line x1="600" y1="620" x2="600" y2="540" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- Connecting lines to center -->
  <line x1="300" y1="190" x2="480" y2="340" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="900" y1="190" x2="720" y2="340" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Bottom explanation box -->
  <g filter="url(#shadow3d)">
    <rect x="100" y="500" width="1000" height="90" rx="15" fill="#0a3622" stroke="#238636" stroke-width="2"/>
    <rect x="105" y="505" width="1000" height="90" rx="15" fill="#0d3622" opacity="0.3" stroke="none"/>

    <text x="600" y="530" font-size="14" font-weight="bold" fill="#56d364" text-anchor="middle" font-family="Arial, sans-serif">
      CorvinOS applies the same principles to AI workflows:
    </text>
    <text x="600" y="555" font-size="12" fill="#e6edf3" text-anchor="middle" font-family="Arial, sans-serif">
      Manages LLM tokens • Optimizes routing & latency • Learns from feedback & improves automatically
    </text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#79c0ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#f0883e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#d2a8ff"/>
    </marker>
  </defs>
</svg>
