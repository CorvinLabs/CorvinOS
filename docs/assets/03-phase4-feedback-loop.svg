<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="22" font-weight="bold" text-anchor="middle">Phase 4b: Outcome Feedback Loop — Closed-Loop Learning</text>

  <!-- Main flow circle -->
  <!-- Task -->
  <circle cx="150" cy="150" r="50" fill="#E8F4F8" stroke="#0066CC" stroke-width="2"/>
  <text x="150" y="155" font-size="12" font-weight="bold" text-anchor="middle">Task</text>

  <!-- CEL provides context -->
  <circle cx="400" cy="150" r="50" fill="#FFF4E6" stroke="#FF8C00" stroke-width="2"/>
  <text x="400" y="150" font-size="11" font-weight="bold" text-anchor="middle">CEL Provides</text>
  <text x="400" y="165" font-size="11" font-weight="bold" text-anchor="middle">Context</text>

  <!-- Arrow Task -> CEL -->
  <path d="M 200 150 L 350 150" stroke="#0066CC" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Agent uses context -->
  <circle cx="650" cy="150" r="50" fill="#E8E8F8" stroke="#0033FF" stroke-width="2"/>
  <text x="650" y="150" font-size="11" font-weight="bold" text-anchor="middle">Agent Uses</text>
  <text x="650" y="165" font-size="11" font-weight="bold" text-anchor="middle">Context</text>

  <!-- Arrow CEL -> Agent -->
  <path d="M 450 150 L 600 150" stroke="#FF8C00" stroke-width="2" fill="none" marker-end="url(#arrowhead-orange)"/>

  <!-- Execution -->
  <circle cx="900" cy="150" r="50" fill="#F8E8E8" stroke="#CC0000" stroke-width="2"/>
  <text x="900" y="150" font-size="11" font-weight="bold" text-anchor="middle">Execution</text>
  <text x="900" y="165" font-size="11" font-weight="bold" text-anchor="middle">Outcome</text>

  <!-- Arrow Agent -> Execution -->
  <path d="M 700 150 L 850 150" stroke="#0033FF" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)"/>

  <!-- Feedback down -->
  <path d="M 900 200 L 900 280" stroke="#CC0000" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/>

  <!-- Feedback collection -->
  <rect x="750" y="290" width="300" height="150" fill="#F8F8F8" stroke="#333" stroke-width="2" rx="5"/>
  <text x="900" y="315" font-size="12" font-weight="bold" text-anchor="middle">Feedback Collector</text>
  <line x1="760" y1="320" x2="1040" y2="320" stroke="#333" stroke-width="1"/>

  <text x="760" y="340" font-size="10" font-weight="bold">Context Usage:</text>
  <text x="770" y="355" font-size="9">• Used: YES/NO</text>
  <text x="770" y="368" font-size="9">• Helpful: YES/NO</text>
  <text x="770" y="381" font-size="9">• Impact: critical/helpful/neutral/harmful</text>

  <!-- Bayesian update -->
  <path d="M 750 365 L 600 365" stroke="#CC0000" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/>

  <!-- Learning update -->
  <rect x="380" y="290" width="300" height="150" fill="#F0F8F0" stroke="#00AA00" stroke-width="2" rx="5"/>
  <text x="530" y="315" font-size="12" font-weight="bold" text-anchor="middle">Bayesian Update</text>
  <line x1="390" y1="320" x2="670" y2="320" stroke="#00AA00" stroke-width="1"/>

  <text x="390" y="340" font-size="10" font-weight="bold">Update Formula:</text>
  <text x="400" y="355" font-size="8" font-family="monospace">new_conf = old_conf +</text>
  <text x="400" y="368" font-size="8" font-family="monospace">(base_update × learning_rate)</text>
  <text x="400" y="381" font-size="8" font-family="monospace">learning_rate = 0.05</text>

  <!-- Back to CEL -->
  <path d="M 380 365 L 250 365 L 250 200" stroke="#00AA00" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>

  <!-- Context reranking -->
  <path d="M 400 200 L 400 240" stroke="#00AA00" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>

  <rect x="280" y="240" width="240" height="100" fill="#E8F8E8" stroke="#00AA00" stroke-width="2" rx="5"/>
  <text x="400" y="260" font-size="11" font-weight="bold" text-anchor="middle">Next Time:</text>
  <text x="400" y="278" font-size="10" text-anchor="middle">Context Reranked Based</text>
  <text x="400" y="293" font-size="10" text-anchor="middle">on Outcomes</text>
  <text x="400" y="308" font-size="9" text-anchor="middle" fill="#666">(confidence scores updated)</text>

  <!-- Signal interpretations -->
  <text x="100" y="480" font-size="12" font-weight="bold">Feedback Signals:</text>

  <!-- Critical (green) -->
  <rect x="50" y="500" width="220" height="80" fill="#00DD00" rx="3"/>
  <text x="160" y="520" font-size="11" font-weight="bold" text-anchor="middle" fill="white">impact = "critical"</text>
  <text x="160" y="535" font-size="9" text-anchor="middle" fill="white">→ confidence +0.10</text>
  <text x="160" y="548" font-size="8" text-anchor="middle" fill="white">(This was very helpful)</text>
  <text x="160" y="560" font-size="8" text-anchor="middle" fill="white">learning_rate × 0.10 = +0.005</text>

  <!-- Helpful (yellow) -->
  <rect x="310" y="500" width="220" height="80" fill="#DDDD77" rx="3"/>
  <text x="420" y="520" font-size="11" font-weight="bold" text-anchor="middle">impact = "helpful"</text>
  <text x="420" y="535" font-size="9" text-anchor="middle">→ confidence +0.05</text>
  <text x="420" y="548" font-size="8" text-anchor="middle">(Contributed to success)</text>
  <text x="420" y="560" font-size="8" text-anchor="middle">learning_rate × 0.05 = +0.0025</text>

  <!-- Neutral (gray) -->
  <rect x="570" y="500" width="220" height="80" fill="#CCCCCC" rx="3"/>
  <text x="680" y="520" font-size="11" font-weight="bold" text-anchor="middle">impact = "neutral"</text>
  <text x="680" y="535" font-size="9" text-anchor="middle">→ confidence -0.02</text>
  <text x="680" y="548" font-size="8" text-anchor="middle">(Noise, not useful)</text>
  <text x="680" y="560" font-size="8" text-anchor="middle">learning_rate × -0.02 = -0.001</text>

  <!-- Harmful (red) -->
  <rect x="830" y="500" width="220" height="80" fill="#FF9999" rx="3"/>
  <text x="940" y="520" font-size="11" font-weight="bold" text-anchor="middle">impact = "harmful"</text>
  <text x="940" y="535" font-size="9" text-anchor="middle">→ confidence -0.15</text>
  <text x="940" y="548" font-size="8" text-anchor="middle">(Led to wrong path)</text>
  <text x="940" y="560" font-size="8" text-anchor="middle">learning_rate × -0.15 = -0.0075</text>

  <!-- Pattern discovery -->
  <text x="100" y="630" font-size="12" font-weight="bold">Pattern Discovery (Combinations):</text>

  <rect x="50" y="650" width="900" height="110" fill="#FFFACD" stroke="#DAA520" stroke-width="2" rx="5"/>
  <text x="500" y="675" font-size="11" font-weight="bold" text-anchor="middle">Which Combinations Work Best?</text>
  <line x1="60" y1="680" x2="940" y2="680" stroke="#DAA520" stroke-width="1"/>

  <text x="500" y="703" font-size="10" text-anchor="middle" font-family="monospace">
    ("adr-0269", "skill-e2e-wiring", "memory-phase3") → 95% success
  </text>
  <text x="500" y="723" font-size="10" text-anchor="middle" font-family="monospace">
    ("adr-0267", "skill-graph-traversal") → 88% success
  </text>
  <text x="500" y="743" font-size="10" text-anchor="middle" font-family="monospace">
    ("memory-concurrent-bugs", "skill-debugging") → 72% success
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066CC" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF8C00" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0033FF" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#CC0000" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00AA00" />
    </marker>
  </defs>
</svg>