<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="1000" height="700" fill="white"/>
  <text x="500" y="30" text-anchor="middle" class="title">Migration Big Bang Timeline (Weeks 11–13)</text>
  <text x="100" y="100" class="label">Week 11: Feature Flag Deprecation</text>
  <text x="100" y="200" class="label">Week 12: Staged Rollout</text>
  <text x="100" y="300" class="label">Week 13: Post-Deploy Verification</text>
  <rect x="50" y="130" width="200" height="80" class="box-red" rx="4"/>
  <text x="150" y="175" text-anchor="middle" class="label">Day 1–3:
Delete flags
from config</text>
  <rect x="300" y="130" width="200" height="80" class="box" rx="4"/>
  <text x="400" y="175" text-anchor="middle" class="label">Day 4:
Compliance
audit</text>
  <text x="50" y="230" class="small">Delete all if FLAGS.* → Migrate to Skills API</text>
  <rect x="50" y="280" width="150" height="80" class="box-green" rx="4"/>
  <text x="125" y="325" text-anchor="middle" class="label">Day 1:
10% canary
Monitor</text>
  <rect x="250" y="280" width="150" height="80" class="box" rx="4"/>
  <text x="325" y="325" text-anchor="middle" class="label">Day 3:
50% scale
HARD STOP</text>
  <rect x="450" y="280" width="150" height="80" class="box-green" rx="4"/>
  <text x="525" y="325" text-anchor="middle" class="label">Day 5:
100% full
Complete</text>
  <text x="50" y="380" class="small">Metrics: Latency, Error Rate, Confidence all monitored</text>
  <rect x="50" y="430" width="200" height="80" class="box" rx="4"/>
  <text x="150" y="475" text-anchor="middle" class="label">Day 1–7:
Post-deploy
verification</text>
  <text x="50" y="530" class="small">Verify: All audit events logged, no silent operations, skills registry stable</text>
  <text x="50" y="560" class="small">Fallback: Shallow rollback < 1min if any CRITICAL issue detected</text>
</svg>