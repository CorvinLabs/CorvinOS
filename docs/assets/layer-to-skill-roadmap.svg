<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="1000" height="700" fill="white"/>
  <text x="500" y="30" text-anchor="middle" class="title">L-Layer → Skill Transformation Roadmap</text>
  <text x="50" y="100" class="label">Phase 1 (Weeks 1–4)</text>
  <rect x="50" y="130" width="250" height="100" class="box-green" rx="4"/>
  <text x="175" y="185" text-anchor="middle" class="label">L5 → os.delegation_router
✅ COMPLETE
Routing logic automated</text>
  <rect x="50" y="250" width="250" height="100" class="box-green" rx="4"/>
  <text x="175" y="305" text-anchor="middle" class="label">L10 → os.context_adapter
✅ COMPLETE
Context engineering plugin</text>
  <text x="350" y="100" class="label">Phase 2 (Weeks 5–10)</text>
  <rect x="350" y="130" width="250" height="100" class="box" rx="4"/>
  <text x="475" y="185" text-anchor="middle" class="label">L16 → os.security_orchestrator
🔄 IN PROGRESS
Consent + house-rules automation</text>
  <rect x="350" y="250" width="250" height="100" class="box" rx="4"/>
  <text x="475" y="305" text-anchor="middle" class="label">L22 → os.workflow_optimizer
📅 PENDING
Execution chain learning</text>
  <text x="650" y="100" class="label">Phase 3 (Weeks 11–24)</text>
  <rect x="650" y="130" width="250" height="100" class="box" rx="4"/>
  <text x="775" y="185" text-anchor="middle" class="label">L34 → os.flow_guard
📅 PENDING
Data flow classification</text>
  <rect x="650" y="250" width="250" height="100" class="box" rx="4"/>
  <text x="775" y="305" text-anchor="middle" class="label">L44 → os.house_rules
📅 PENDING
Acceptable use enforcement</text>
  <text x="50" y="450" class="small">Key: ✅ Complete | 🔄 In Progress | 📅 Pending</text>
  <text x="50" y="480" class="small">Each transition: Code + ADR + E2E proof + Audit verification</text>
  <text x="50" y="510" class="small">Roadmap: 6–8 weeks to complete (all L-layers → Skills)</text>
