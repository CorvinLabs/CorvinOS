<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Learning Loop: Confidence Over Time</text>

  <!-- Axes -->
  <line x1="100" y1="400" x2="900" y2="400" stroke="#333" stroke-width="2"/> <!-- X-axis -->
  <line x1="100" y1="400" x2="100" y2="50" stroke="#333" stroke-width="2"/> <!-- Y-axis -->

  <!-- X-axis labels (weeks) -->
  <text x="150" y="430" font-size="12" text-anchor="middle" fill="#666">Week 1</text>
  <text x="300" y="430" font-size="12" text-anchor="middle" fill="#666">Week 2</text>
  <text x="450" y="430" font-size="12" text-anchor="middle" fill="#666">Week 3</text>
  <text x="600" y="430" font-size="12" text-anchor="middle" fill="#666">Week 4</text>
  <text x="750" y="430" font-size="12" text-anchor="middle" fill="#666">Week 5</text>
  <text x="900" y="430" font-size="12" text-anchor="middle" fill="#666">Week 6</text>

  <!-- Y-axis labels (confidence) -->
  <text x="80" y="405" font-size="12" text-anchor="end" fill="#666">0.0</text>
  <text x="80" y="305" font-size="12" text-anchor="end" fill="#666">0.5</text>
  <text x="80" y="205" font-size="12" text-anchor="end" fill="#666">1.0</text>

  <!-- Y-axis title -->
  <text x="30" y="220" font-size="12" font-weight="bold" fill="#666" text-anchor="middle" transform="rotate(-90 30 220)">Confidence Score</text>

  <!-- X-axis title -->
  <text x="500" y="470" font-size="12" font-weight="bold" text-anchor="middle" fill="#666">Time</text>

  <!-- S-curve (learning progression) -->
  <path d="M 150 360 Q 300 340 450 280 T 750 120" stroke="#c2185b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Data points -->
  <circle cx="150" cy="360" r="6" fill="#f57c00" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="340" r="6" fill="#f57c00" stroke="#333" stroke-width="1"/>
  <circle cx="450" cy="280" r="6" fill="#f57c00" stroke="#333" stroke-width="1"/>
  <circle cx="600" cy="180" r="6" fill="#f57c00" stroke="#333" stroke-width="1"/>
  <circle cx="750" cy="120" r="6" fill="#f57c00" stroke="#333" stroke-width="1"/>

  <!-- Annotations -->
  <!-- Week 1 -->
  <rect x="120" y="310" width="60" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="150" y="328" font-size="10" font-weight="bold" text-anchor="middle" fill="#f57c00">v1.0</text>
  <text x="150" y="342" font-size="9" text-anchor="middle" fill="#666">Conf: 0.60</text>

  <!-- Week 2 -->
  <text x="320" y="315" font-size="10" fill="#666">User feedback:</text>
  <text x="320" y="328" font-size="9" fill="#999">"That routing was slow"</text>

  <!-- Week 3 -->
  <rect x="430" y="240" width="70" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="465" y="258" font-size="10" font-weight="bold" text-anchor="middle" fill="#f57c00">Adjusted</text>
  <text x="465" y="272" font-size="9" text-anchor="middle" fill="#666">threshold↓</text>

  <!-- Week 6 -->
  <rect x="720" y="80" width="60" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="750" y="98" font-size="10" font-weight="bold" text-anchor="middle" fill="#f57c00">v1.0</text>
  <text x="750" y="112" font-size="9" text-anchor="middle" fill="#666">Conf: 0.92</text>

  <!-- Legend -->
  <text x="100" y="470" font-size="11" font-weight="bold" fill="#1a1a1a">Key:</text>
  <circle cx="185" cy="465" r="4" fill="#c2185b"/>
  <text x="200" y="470" font-size="11" fill="#666">Confidence curve (S-shaped improvement)</text>

  <circle cx="500" cy="465" r="4" fill="#f57c00"/>
  <text x="515" y="470" font-size="11" fill="#666">Data point (weekly snapshot)</text>
</svg>