<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="900" height="600" fill="white"/>
  <text x="450" y="30" text-anchor="middle" class="title">Learning Loop Cycle</text>
  <rect x="350" y="50" width="200" height="60" class="box" rx="4"/>
  <text x="450" y="85" text-anchor="middle" class="label">1. Skill Execution</text>
  <rect x="630" y="200" width="200" height="60" class="box-green" rx="4"/>
  <text x="730" y="235" text-anchor="middle" class="label">2. User Feedback</text>
  <rect x="350" y="350" width="200" height="60" class="box-green" rx="4"/>
  <text x="450" y="385" text-anchor="middle" class="label">3. Optimizer</text>
  <rect x="70" y="200" width="200" height="60" class="box" rx="4"/>
  <text x="170" y="235" text-anchor="middle" class="label">4. Config Update</text>
  <path d="M 550 80 L 630 200" class="arrow-green"/>
  <path d="M 730 260 L 450 350" class="arrow-green"/>
  <path d="M 350 410 L 170 260" class="arrow-green"/>
  <path d="M 170 200 L 350 110" class="arrow-green"/>
  <text x="750" y="270" class="small">Week 1: Confidence 0.60</text>
  <text x="380" y="500" class="small">Week 2: Confidence 0.72</text>
  <text x="50" y="300" class="small">Week 3: Confidence 0.81</text>
  <text x="50" y="550" class="small">Self-learning: Feedback → Config Optimization → Better Performance</text>
</svg>