<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="1000" height="600" fill="white"/>
  <text x="500" y="30" text-anchor="middle" class="title">Canary Rollout Timeline (7 Days)</text>
  <line x1="100" y1="400" x2="900" y2="400" stroke="#111827" stroke-width="2"/>
  <text x="90" y="430" class="small">Day 1</text>
  <line x1="100" y1="395" x2="100" y2="405" stroke="#111827" stroke-width="2"/>
  <text x="210" y="430" class="small">Day 2</text>
  <line x1="220" y1="395" x2="220" y2="405" stroke="#111827" stroke-width="2"/>
  <text x="330" y="430" class="small">Day 3</text>
  <line x1="340" y1="395" x2="340" y2="405" stroke="#111827" stroke-width="2"/>
  <text x="450" y="430" class="small">Day 4</text>
  <line x1="460" y1="395" x2="460" y2="405" stroke="#111827" stroke-width="2"/>
  <text x="570" y="430" class="small">Day 5</text>
  <line x1="580" y1="395" x2="580" y2="405" stroke="#111827" stroke-width="2"/>
  <text x="690" y="430" class="small">Day 6</text>
  <line x1="700" y1="395" x2="700" y2="405" stroke="#111827" stroke-width="2"/>
  <text x="810" y="430" class="small">Day 7</text>
  <line x1="820" y1="395" x2="820" y2="405" stroke="#111827" stroke-width="2"/>
  <rect x="11980" y="300" width="2400" height="80" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="2"/>
  <text x="11990" y="340" class="small">10% Canary</text>
  <rect x="26380" y="300" width="2400" height="80" fill="#3B82F6" opacity="0.3" stroke="#3B82F6" stroke-width="2"/>
  <text x="26390" y="340" class="small">50% Scale</text>
  <rect x="40780" y="300" width="9600" height="80" fill="#10B981" opacity="0.3" stroke="#10B981" stroke-width="2"/>
  <text x="40790" y="340" class="small">100% Full</text>
  <text x="100" y="200" class="small">Latency: 45ms (✅ SLA)</text>
  <text x="100" y="230" class="small">Error Rate: 0.2% (✅ Safe)</text>
  <text x="100" y="260" class="small">Confidence: 0.87 (✅ High)</text>
  <rect x="580" y="100" width="150" height="80" class="box-red" rx="4"/>
  <text x="655" y="145" text-anchor="middle" class="label">HARD STOP
Gate (Day 4)
Rollback if
metrics bad</text>
</svg>