<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Staged Rollout: Zero-Downtime Deployment</text>
  
  <line x1="100" y1="100" x2="900" y2="100" stroke="#333" stroke-width="2"/>
  <text x="100" y="85" font-size="11" fill="#666">Day 1</text>
  <text x="300" y="85" font-size="11" fill="#666">Day 2</text>
  <text x="500" y="85" font-size="11" fill="#666">Day 3</text>
  <text x="700" y="85" font-size="11" fill="#666">Day 5</text>
  <text x="900" y="85" font-size="11" fill="#666">Day 7</text>
  
  <rect x="80" y="120" width="40" height="60" fill="#f57c00"/>
  <text x="100" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">10%</text>
  
  <rect x="280" y="120" width="100" height="60" fill="#f57c00"/>
  <text x="330" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">50%</text>
  
  <rect x="480" y="120" width="200" height="60" fill="#388e3c"/>
  <text x="580" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">100%</text>
  
  <text x="100" y="220" font-size="11" font-weight="bold" fill="#f57c00">Phase 1: Canary</text>
  <text x="100" y="240" font-size="10" fill="#666">Deploy v0.4 to 10%</text>
  <text x="100" y="260" font-size="10" fill="#666">Monitor for 24h</text>
  
  <text x="300" y="220" font-size="11" font-weight="bold" fill="#f57c00">Phase 2: Scale</text>
  <text x="300" y="240" font-size="10" fill="#666">If metrics OK, scale to 50%</text>
  <text x="300" y="260" font-size="10" fill="#666">Monitor for 24h</text>
  
  <text x="480" y="220" font-size="11" font-weight="bold" fill="#388e3c">Phase 3: Full</text>
  <text x="480" y="240" font-size="10" fill="#666">If metrics OK, full deployment</text>
  <text x="480" y="260" font-size="10" fill="#666">No restart needed</text>
  
  <rect x="100" y="310" width="800" height="50" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="3"/>
  <text x="500" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Downtime: 0 seconds | Rollback time: &lt; 30 seconds</text>
</svg>