<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="900" height="600" fill="white"/>
  <text x="450" y="30" text-anchor="middle" class="title">Call Site Rewrite: 5 Locations Updated</text>
  <text x="50" y="80" class="label">Pattern: Replace hardcoded flag checks with Skills API</text>
  <text x="50" y="130" class="small">1. routing.py:42</text>
  <text x="70" y="155" class="small">OLD: if FLAGS.vibe_engineering: route_to_opus()</text>
  <text x="70" y="180" class="small">NEW: registry.execute('os.vibe_engineering', ...)</text>
  <text x="50" y="215" class="small">2. adapter.py:156</text>
  <text x="70" y="240" class="small">OLD: if FLAGS.delegation: classify(request)</text>
  <text x="70" y="265" class="small">NEW: registry.execute('os.delegation_router', ...)</text>
  <text x="50" y="300" class="small">3. context.py:89</text>
  <text x="70" y="325" class="small">OLD: if FLAGS.context_adapt: adapt_ctx()</text>
  <text x="70" y="350" class="small">NEW: registry.execute('os.context_adapter', ...)</text>
  <text x="50" y="385" class="small">4. loader.py:23</text>
  <text x="70" y="410" class="small">OLD: if FLAGS.plugin_load: init_plugins()</text>
  <text x="70" y="435" class="small">NEW: registry.execute('os.plugin_loader', ...)</text>
  <text x="50" y="470" class="small">5. console.py:201</text>
  <text x="70" y="495" class="small">OLD: if FLAGS.web_enable: start_web()</text>
  <text x="70" y="520" class="small">NEW: registry.execute('os.web_console', ...)</text>
  <text x="50" y="530" class="small">All 5 locations updated in Week 11 Day 1–3</text>
  <text x="50" y="560" class="small">Each change: Code review + ADR reference + Audit verification</text>
</svg>