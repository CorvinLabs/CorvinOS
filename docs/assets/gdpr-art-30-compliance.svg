<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="30" text-anchor="middle" class="title">GDPR Article 30 Compliance (Records of Processing)</text>
  <text x="50" y="80" class="label">Required: Records of Processing Activities</text>
  <rect x="50" y="130" width="700" height="60" class="box-green" rx="4"/>
  <text x="400" y="165" text-anchor="middle" class="label">What: Audit events: skill execution, feedback, config changes ✅</text>
  <rect x="50" y="210" width="700" height="60" class="box-green" rx="4"/>
  <text x="400" y="245" text-anchor="middle" class="label">Who: Tenant ID, LoM (Line of Moral Responsibility) ✅</text>
  <rect x="50" y="290" width="700" height="60" class="box-green" rx="4"/>
  <text x="400" y="325" text-anchor="middle" class="label">When: Timestamp on every event (ISO 8601) ✅</text>
  <rect x="50" y="370" width="700" height="60" class="box-green" rx="4"/>
  <text x="400" y="405" text-anchor="middle" class="label">Where: ~/.corvin/audit.jsonl + daily snapshots ✅</text>
  <rect x="50" y="450" width="700" height="60" class="box-green" rx="4"/>
  <text x="400" y="485" text-anchor="middle" class="label">How: Hash-chained, immutable, append-only ✅</text>
  <text x="50" y="530" class="small">Audit Trail Status: 100/100 events logged ✅</text>
  <text x="50" y="560" class="small">Chain integrity: 0 gaps, all hashes verified ✅</text>
  <text x="50" y="590" class="small">Operator proof: Can extract full records at any time</text>
</svg>