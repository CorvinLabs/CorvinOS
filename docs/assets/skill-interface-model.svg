<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Skill Interface Model</text>
  
  <rect x="50" y="80" width="900" height="300" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
  
  <text x="80" y="120" font-size="13" font-weight="bold" fill="#1976d2">class Skill:</text>
  <text x="100" y="145" font-size="11" fill="#1a1a1a">id: str = "os.routing"</text>
  <text x="100" y="165" font-size="11" fill="#1a1a1a">version: str = "1.2"</text>
  <text x="100" y="185" font-size="11" fill="#1a1a1a">dependencies: list = ["os.vibe_engineering"]</text>
  <text x="100" y="205" font-size="11" fill="#1a1a1a">config: dict = {"threshold": 0.65}</text>
  
  <line x1="80" y1="220" x2="920" y2="220" stroke="#ddd" stroke-width="1"/>
  
  <text x="100" y="245" font-size="11" fill="#7b1fa2">def execute(self, input: dict) -> dict:</text>
  <text x="130" y="265" font-size="10" fill="#1a1a1a">if input["complexity"] > self.config["threshold"]:</text>
  <text x="160" y="285" font-size="10" fill="#1a1a1a">return {"engine": "claude-opus-5"}</text>
  <text x="130" y="305" font-size="10" fill="#1a1a1a">else:</text>
  <text x="160" y="325" font-size="10" fill="#1a1a1a">return {"engine": "claude-haiku-4-5"}</text>
  
  <text x="80" y="360" font-size="10" fill="#666">✓ Input + output logged to audit trail automatically</text>
</svg>