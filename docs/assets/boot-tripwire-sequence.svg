<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="900" height="700" fill="white"/>
  <text x="450" y="30" text-anchor="middle" class="title">Boot Tripwire Sequence (Fail-Closed)</text>
  <line x1="100" y1="100" x2="100" y2="600" stroke="#111827" stroke-width="2"/>
  <text x="150" y="250" class="small">1. CorvinOS Boot</text>
  <text x="150" y="300" class="small">2. Load Audit Trail from Disk</text>
  <text x="150" y="350" class="small">3. Read Last Hash from Chain</text>
  <text x="150" y="400" class="small">4. Recalculate All Hashes</text>
  <text x="150" y="450" class="small">5. Compare: Computed == Stored?</text>
  <polygon points="500,380 550,330 600,380 550,430" fill="#F3F4F6" stroke="#3B82F6" stroke-width="2"/>
  <text x="505" y="385" class="small">Chain OK?</text>
  <text x="680" y="350" class="small">✅ YES</text>
  <path d="M 600 380 L 650 380" class="arrow-green"/>
  <rect x="680" y="350" width="150" height="60" class="box-green" rx="4"/>
  <text x="755" y="385" text-anchor="middle" class="label">✅ Boot Continues
Plugins Load
System Ready</text>
  <text x="520" y="470" class="small">❌ NO</text>
  <path d="M 550 430 L 550 500" class="arrow-red"/>
  <rect x="450" y="520" width="200" height="80" class="box-red" rx="4"/>
  <text x="550" y="565" text-anchor="middle" class="label">❌ FAIL
Exit Code 1
No Plugins Loaded
Operator Alerted</text>
  <text x="50" y="650" class="small">Non-negotiable: tripwire runs on EVERY boot, no override, no env var, no skip</text>
</svg>