<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Feedback Types Matrix (ADR-0314)</text>
  
  <rect x="50" y="80" width="900" height="380" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
  
  <text x="70" y="120" font-size="12" font-weight="bold" fill="#1a1a1a">Feedback Type</text>
  <text x="300" y="120" font-size="12" font-weight="bold" fill="#1a1a1a">Signal Format</text>
  <text x="550" y="120" font-size="12" font-weight="bold" fill="#1a1a1a">What It Measures</text>
  
  <line x1="50" y1="140" x2="950" y2="140" stroke="#ddd" stroke-width="1"/>
  
  <text x="70" y="170" font-size="11" fill="#1976d2">outcome_feedback</text>
  <text x="300" y="170" font-size="10" fill="#666">yes/no/other</text>
  <text x="550" y="170" font-size="10" fill="#666">Was the decision correct?</text>
  
  <line x1="50" y1="190" x2="950" y2="190" stroke="#ddd" stroke-width="1"/>
  
  <text x="70" y="220" font-size="11" fill="#7b1fa2">preference_feedback</text>
  <text x="300" y="220" font-size="10" fill="#666">LLM / deterministic / neither</text>
  <text x="550" y="220" font-size="10" fill="#666">User's style preference</text>
  
  <line x1="50" y1="240" x2="950" y2="240" stroke="#ddd" stroke-width="1"/>
  
  <text x="70" y="270" font-size="11" fill="#388e3c">confidence_score</text>
  <text x="300" y="270" font-size="10" fill="#666">0.0 to 1.0</text>
  <text x="550" y="270" font-size="10" fill="#666">P(Skill makes correct decision)</text>
  
  <line x1="50" y1="290" x2="950" y2="290" stroke="#ddd" stroke-width="1"/>
  
  <text x="70" y="320" font-size="11" fill="#f57c00">metric_observed</text>
  <text x="300" y="320" font-size="10" fill="#666">latency_ms, error_rate, cost</text>
  <text x="550" y="320" font-size="10" fill="#666">Performance metrics</text>
  
  <line x1="50" y1="340" x2="950" y2="340" stroke="#ddd" stroke-width="1"/>
  
  <rect x="70" y="360" width="830" height="80" fill="#e8f5e9" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="90" y="385" font-size="11" font-weight="bold" fill="#388e3c">Processing:</text>
  <text x="90" y="405" font-size="10" fill="#666">All feedback types read by Optimizer → Skill config adjusted → Next invocation uses tuned config</text>
  <text x="90" y="425" font-size="10" fill="#666">No code commit. No restart. Just learned.</text>
</svg>