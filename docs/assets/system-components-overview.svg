<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="1000" height="800" fill="white"/>
  <text x="500" y="30" text-anchor="middle" class="title">System Components Overview (High-Level)</text>
  <rect x="350" y="300" width="300" height="150" class="box" rx="4"/>
  <text x="500" y="380" text-anchor="middle" class="label">Skills
Registry
(v2.1)

All Skills
Versioned
Composed</text>
  <rect x="50" y="50" width="200" height="120" class="box-green" rx="4"/>
  <text x="150" y="115" text-anchor="middle" class="label">API
Layer

HTTP
Routes</text>
  <rect x="750" y="50" width="200" height="120" class="box-red" rx="4"/>
  <text x="850" y="115" text-anchor="middle" class="label">Compliance
Gates

Consent
House-Rules
Disclosure</text>
  <rect x="50" y="650" width="200" height="120" class="box" rx="4"/>
  <text x="150" y="715" text-anchor="middle" class="label">Audit
Trail

Hash-Chained
Immutable
Tenant-Scoped</text>
  <rect x="750" y="650" width="200" height="120" class="box-green" rx="4"/>
  <text x="850" y="715" text-anchor="middle" class="label">Learning
Loop

Feedback
Optimizer
Convergence</text>
  <rect x="350" y="600" width="300" height="120" class="box-red" rx="4"/>
  <text x="500" y="665" text-anchor="middle" class="label">Meta-Skills
(Locked)

Audit
Disclosure
Consent</text>
  <path d="M 250 110 L 350 350" class="arrow"/>
  <path d="M 750 110 L 650 350" class="arrow-red"/>
  <path d="M 150 650 L 400 450" class="arrow"/>
  <path d="M 850 650 L 600 450" class="arrow-green"/>
  <path d="M 450 600 L 450 450" class="arrow-red"/>
  <text x="50" y="780" class="small">All components connected, audited, fail-closed on compliance violations</text>
</svg>