  <rect x="100" y="50" width="800" height="40" fill="#e8f5e9" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="500" y="75" font-size="11" font-weight="bold" text-anchor="middle" fill="#388e3c">Typical S-curve: slow start → rapid improvement → plateau at 0.9+ confidence</text>
