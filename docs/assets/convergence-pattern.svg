<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
      .box-green { fill: #F3F4F6; stroke: #10B981; stroke-width: 2; }
      .box-red { fill: #F3F4F6; stroke: #EF4444; stroke-width: 2; }
      .title { font-size: 18px; font-weight: bold; fill: #111827; font-family: sans-serif; }
      .label { font-size: 14px; fill: #111827; font-family: sans-serif; }
      .small { font-size: 12px; fill: #6B7280; font-family: sans-serif; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      line { stroke: #6B7280; stroke-width: 1; }
      circle { fill: #F3F4F6; stroke: #3B82F6; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B82F6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="30" text-anchor="middle" class="title">Confidence Convergence (Learning Curve)</text>
  <line x1="80" y1="500" x2="750" y2="500" stroke="#111827" stroke-width="2"/>
  <line x1="80" y1="500" x2="80" y2="50" stroke="#111827" stroke-width="2"/>
  <text x="40" y="505" class="small">0.0</text>
  <text x="40" y="460" class="small">0.1</text>
  <text x="40" y="415" class="small">0.2</text>
  <text x="40" y="370" class="small">0.3</text>
  <text x="40" y="325" class="small">0.4</text>
  <text x="40" y="280" class="small">0.5</text>
  <text x="40" y="235" class="small">0.6</text>
  <text x="40" y="190" class="small">0.7</text>
  <text x="40" y="145" class="small">0.8</text>
  <text x="40" y="100" class="small">0.9</text>
  <text x="40" y="55" class="small">1.0</text>
  <text x="150" y="530" class="small">W1</text>
  <text x="300" y="530" class="small">W2</text>
  <text x="450" y="530" class="small">W3</text>
  <text x="600" y="530" class="small">W4</text>
  <path d="M 150 380 Q 300 250 450 150 T 750 100" class="arrow-green" stroke-width="3"/>
  <circle cx="150" cy="380" r="5" fill="#10B981"/>
  <circle cx="300" cy="250" r="5" fill="#10B981"/>
  <circle cx="450" cy="150" r="5" fill="#10B981"/>
  <circle cx="600" cy="110" r="5" fill="#10B981"/>
  <text x="150" y="410" class="small">0.60</text>
  <text x="300" y="280" class="small">0.72</text>
  <text x="450" y="180" class="small">0.87</text>
  <text x="600" y="140" class="small">0.92</text>
  <line x1="80" y1="50" x2="750" y2="50" stroke="#6B7280" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="760" y="55" class="small">Max: 1.0</text>
  <text x="50" y="580" class="small">Y-axis: Confidence Score | X-axis: Weeks Since Deploy</text>
</svg>