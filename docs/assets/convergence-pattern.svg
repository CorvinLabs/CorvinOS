  <circle cx="680" cy="70" r="5" fill="#f57c00"/>
  <circle cx="760" cy="68" r="5" fill="#f57c00"/>
  <circle cx="840" cy="67" r="5" fill="#f57c00"/>
  
  <text x="120" y="330" font-size="10" text-anchor="middle" fill="#666">Iter 1</text>
