  <path d="M 120 300 L 200 280 L 280 240 L 360 160 L 440 120 L 520 90 L 600 75 L 680 70 L 760 68 L 840 67" stroke="#c2185b" stroke-width="3" fill="none"/>
  
  <circle cx="120" cy="300" r="5" fill="#f57c00"/>
  <circle cx="200" cy="280" r="5" fill="#f57c00"/>
  <circle cx="280" cy="240" r="5" fill="#f57c00"/>
  <circle cx="360" cy="160" r="5" fill="#f57c00"/>
  <circle cx="440" cy="120" r="5" fill="#f57c00"/>
