<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" role="img" aria-labelledby="t d"><title id="t">Where you can plug into CorvinOS</title><desc id="d">Hub-and-spoke: CorvinOS in the centre; solid spokes go to live extension points (plugin types that are called, Forge tools, SkillForge skills, Plugin-Builder, MCP servers, Claude Code plugins, Tier A custom layers); dashed spokes go to plugin types that are not called and to engines and bridges, which are hard-coded.</desc><defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient></defs><rect width="980" height="620" rx="14" fill="url(#bgg)"/><text x="32" y="44" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#e6edf3" text-anchor="start">Where you can plug in</text><rect x="32" y="54" width="56" height="3" rx="1.5" fill="#f0b429"/><text x="32" y="80" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Solid spokes run today. Dashed spokes exist as an interface but nothing calls them — or the surface is hard-coded.</text><circle cx="490" cy="340" r="66" fill="#202833" stroke="#f0b429" stroke-width="2"/><text x="490" y="336" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#f0b429" text-anchor="middle">CorvinOS</text><text x="490" y="356" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">one registry</text><rect x="60" y="108" width="200" height="58" rx="10" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="160.0" y="133.75" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">8 plugin types</text><text x="160.0" y="150.75" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">called by the runtime</text><rect x="218.4" y="99" width="35.6" height="17" rx="8.5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="236.2" y="111.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="middle">LIVE</text><defs><marker id="m89265972" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker></defs><path d="M432.0812091465069 304.37116805073 L213.64532019704433 170.0" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#m89265972)"/><rect x="390" y="108" width="200" height="58" rx="10" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="490.0" y="133.75" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Forge tools</text><text x="490.0" y="150.75" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">MCP · bwrap/docker</text><rect x="548.4" y="99" width="35.6" height="17" rx="8.5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="566.2" y="111.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="middle">LIVE</text><defs