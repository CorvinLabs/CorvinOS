<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" role="img" aria-labelledby="t d"><title id="t">Plugin boot sequence</title><desc id="d">Four stages in bootstrap_all: global specs (empty today), declarative spec.plugins.installed, builtin discovery from the Corvin-Marketplace tree, and the runtime tenant registry. All feed one registry.</desc><defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient></defs><rect width="980" height="400" rx="14" fill="url(#bgg)"/><text x="32" y="44" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#e6edf3" text-anchor="start">Boot: four sources, one registry</text><rect x="32" y="54" width="56" height="3" rx="1.5" fill="#f0b429"/><text x="32" y="80" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">bootstrap_all() runs the stages in order; every stage registers into the same PluginRegistry.</text><rect x="32" y="112" width="208" height="84" rx="10" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="136.0" y="143.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">1. Global</text><text x="136.0" y="160.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">_GLOBAL_SPECS</text><text x="136.0" y="176.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">empty today</text><rect x="198.4" y="103" width="35.6" height="17" rx="8.5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="216.2" y="115.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="middle">LIVE</text><defs><marker id="m38123292" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0b429"/></marker></defs><path d="M240 154 L268 154" fill="none" stroke="#f0b429" stroke-width="1.6" marker-end="url(#m38123292)"/><rect x="268" y="112" width="208" height="84" rx="10" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="372.0" y="143.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">2. Declarative</text><text x="372.0" y="160.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">tenant.corvin.yaml</text><text x="372.0" y="176.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">spec.plugins.installed</text><rect x="434.4" y="103" width="35.6" height="17" rx="8.5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="452.2" y="115.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="middle">LIVE</text><defs><marker id="m17238427" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0b429"/></marker></defs><path d="M476 154 L504 154" fill="none" stroke="#f0b429" stroke-width="1.6" marker-end="url(#m17238427)"/><rect x="504" y="112" width="208" height="84" rx="10" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="608.0" y="143.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">3. Builtin discovery</text><text x="608.0" y="160.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">Corvin-Marketplace tree</text><text x="608.0" y="176.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">plugin.yaml · opt-out</text><rect x="670.4" y="103" width="35.6" height="17" rx="8.5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="688.2" y="115.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="middle">LIVE</text><defs><marker id="m63373658" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0b429"/></marker></defs><path d="M712 154 L740 154" fill="none" stroke="#f0b429" stroke-width="1.6" marker-end="url(#m63373658)"/><rect x="740" y="112" width="208" height="84" rx="10" fill="#1b222c" stroke="#bc8cff" stroke-width="1.6" stroke-dasharray="6 4"/><text x="844.0" y="143.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">4. Runtime registry</text><text x="844.0" y="160.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">&lt;tenant&gt;/plugins/</text><text x="844.0" y="176.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">registry.yaml</text><rect x="900.0" y="103" width="42.0" height="17" rx="8.5" fill="#0d1117" stroke="#bc8cff" stroke-width="1"/><text x="921.0" y="115.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#bc8cff" text-anchor="middle">GATED</text><rect x="32" y="246" width="916" height="66" rx="10" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="490.0" y="275.75" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">PluginRegistry — core/plugins/corvin_plugins/</text><text x="490.0" y="293.25" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">one lifecycle: register · on_load (deadline) · health_check · enable · disable · unload</text><rect x="906.4" y="237" width="35.6" height="17" rx="8.5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/><text x="924.2" y="249.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3fb950" text-anchor="middle">LIVE</text><defs><marker id="m37665873" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><path d="M136 196 L136 246" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m37665873)"/><defs><marker id="m20990746" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><path d="M372 196 L372 246" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m20990746)"/><defs><marker id="m86153953" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><path d="M608 196 L608 246" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m86153953)"/><defs><marker id="m25107805" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><path d="M844 196 L844 246" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m25107805)"/><rect x="32" y="365" width="22" height="14" rx="4" fill="#1b222c" stroke="#3fb950" stroke-width="1.6"/><text x="62" y="376" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">LIVE — runs today</text><rect x="195.1" y="365" width="22" height="14" rx="4" fill="#1b222c" stroke="#bc8cff" stroke-width="1.6" stroke-dasharray="6 4"/><text x="225.1" y="376" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">GATED — off until enabled</text><text x="948" y="376" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end" font-style="italic">stage 4 needs the plugin_runtime_lifecycle flag</text></svg>
