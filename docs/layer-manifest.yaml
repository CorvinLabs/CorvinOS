    doc_files:
      - "docs/claude-ref/layer-16-security.md"
    code_patterns:
      - "core/security/**/*.py"
      - "core/consent/**/*.py"
      - "core/audit/**/*.py"
    keywords:
      - security
      - consent
      - audit
      - toctou
      - hardening
      - GDPR
    related_adrs:
      - "ADR-0002"

  - id: L18
    name: "Roles (Owner/Admin/Member/Observer)"
    description: "4-tier role hierarchy with 7-day TTL. GDPR Art. 6."
    doc_files:
      - "docs/claude-ref/layer-users.md"
    code_patterns:
      - "core/users/**/*.py"
      - "core/rbac/**/*.py"
    keywords:
