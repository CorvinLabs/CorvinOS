# Layer Stack Manifest (ADR-0267)
#
# Comprehensive registry of all 36+ security and compliance layers in CorvinOS.
# Each layer enforces one security/compliance mechanism independently.
# This manifest is used by the Task Router (Phase 1 of ADR-0267) to map tasks
# to affected layers and route them through appropriate analysis and verification pipelines.
#
# Format: YAML array of layer definitions, ordered L1–L44.
# Each layer carries: id, name, description, doc_files, code_patterns, keywords, related_adrs.

layers:
  - id: L4
    name: "Cowork (Multi-Persona Hub)"
    description: "Route each chat to a different persona; multi-persona hub for task routing."
    doc_files:
      - "docs/claude-ref/layer-plugins.md"
    code_patterns:
      - "core/cowork/**/*.py"
      - "operator/cowork/**/*.py"
    keywords:
      - persona
      - cowork
      - routing
      - multi-persona
    related_adrs: []

  - id: L5
    name: "Auto-Routing (Keyword-Based Persona Selection)"
    description: "Keyword-based persona selection via heuristic or API."
    doc_files:
      - "docs/claude-ref/layer-plugins.md"
    code_patterns:
      - "core/auto_routing/**/*.py"
      - "core/persona/**/*.py"
    keywords:
      - auto-routing
      - persona selection
      - keyword heuristic
    related_adrs: []

  - id: L6
    name: "Forge (Runtime Tool Generation)"
    description: "Runtime tool generation, schema-bound, MCP server. ADR-0030/0033."
    doc_files:
      - "docs/claude-ref/layer-plugins.md"
    code_patterns:
      - "core/forge/**/*.py"
      - "operator/forge/**/*.py"
      - "core/plugins/corvin_plugins/**/*.py"
    keywords:
      - forge
      - tool generation
      - mcp
      - schema
    related_adrs:
      - "ADR-0030"
      - "ADR-0033"

  - id: L7
    name: "SkillForge (Runtime Skill Generation)"
    description: "Runtime skill generation via prompt injection. ADR-0032/0034."
    doc_files:
      - "docs/claude-ref/layer-plugins.md"
    code_patterns:
      - "core/skillforge/**/*.py"
      - "operator/skill-forge/**/*.py"
    keywords:
      - skillforge
      - skill generation
      - prompt injection
    related_adrs:
      - "ADR-0032"
      - "ADR-0034"

  - id: L8
    name: "Session Lifecycle"
    description: "Session management: /new, /clear, /reset, audit-first lifecycle."
    doc_files:
      - "docs/claude-ref/session-lifecycle.md"
    code_patterns:
      - "core/sessions/**/*.py"
      - "core/console/**/*session*.py"
    keywords:
      - session
      - lifecycle
      - new
      - clear
      - reset
      - audit
    related_adrs: []

  - id: L10
    name: "Path-Gate (FS-Write Protection)"
    description: "File-system write protection, fail-closed, Bash detection. GDPR Art. 32."
    doc_files:
      - "docs/claude-ref/layer-10-path-gate.md"
    code_patterns:
      - "core/path_gate/**/*.py"
      - "core/security/**/*path*.py"
    keywords:
      - path-gate
      - filesystem protection
      - fail-closed
      - bash detection
      - GDPR
    related_adrs:
      - "ADR-0008"
      - "ADR-0009"

  - id: L11
    name: "Dialectic Decision-Points"
    description: "Six integration sites for dialectical reasoning (skill promotion, auto-routing, etc)."
    doc_files:
      - "docs/claude-ref/layer-11-dialectic.md"
    code_patterns:
      - "core/dialectic/**/*.py"
      - "operator/bundle/skills/ldd/**/*.py"
    keywords:
      - dialectic
      - decision
      - reasoning
      - antithesis
      - synthesis
    related_adrs:
      - "ADR-0115"

  - id: L12
    name: "Voice Listener-Profile"
    description: "TTS tuning for the listener via voice_audience_* fields."
    doc_files:
      - "docs/claude-ref/layer-12-voice-profile.md"
    code_patterns:
      - "core/voice/**/*.py"
      - "core/stt/**/*.py"
    keywords:
      - voice
      - listener profile
      - tts
      - voice_audience
    related_adrs:
      - "ADR-0185"

  - id: L13
    name: "/btw Mid-Stream Injection"
    description: "In-flight note pushing via side-channel envelope."
    doc_files:
      - "docs/claude-ref/layer-13-btw-injection.md"
    code_patterns:
      - "core/btw/**/*.py"
      - "core/console/**/*btw*.py"
    keywords:
      - btw
      - mid-stream
      - injection
      - side-channel
    related_adrs: []

  - id: L14
    name: "LDD-Toggle System"
    description: "Enable/disable all 12 LDD layers per persona/scope."
    doc_files:
      - "docs/claude-ref/layer-14-ldd-toggle.md"
    code_patterns:
